name: Bug report
description: Something on the site, in the administration, the connector or CI is broken.
labels:
  - bug
body:
  - type: checkboxes
    attributes:
      label: Before submitting
      options:
        - label: I searched the open issues and pull requests and found no duplicate.
          required: true
        - label: I left out personal data, tokens and log lines with names or e-mails (the repository is public).
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Public site
        - Donor area (/darce)
        - Administration (/sprava)
        - MCP connector
        - Backend or database
        - CI, deploy or backups
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: input
    id: revision
    attributes:
      label: Revision or commit
      description: The revision `nfnn_status` shows, or the commit of `main`.

  - type: input
    id: agent
    attributes:
      label: Agent
      description: When an agent filed this, its harness and machine, such as "Codex · T3 on the server".
