version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: typescript
        versions: [">=6.1"]
      - dependency-name: "@types/node"
        versions: [">=27"]
    groups:
      angular:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
          - "@schematics/angular"
          - "angular-eslint"
          - "typescript"
      npm-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: gradle
    directory: /backend
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      gradle-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /mcp
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: typescript
        versions: [">=6.1"]
      - dependency-name: "@types/node"
        versions: [">=27"]
    groups:
      mcp-sdk:
        patterns:
          - "@modelcontextprotocol/*"
      mcp-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directories: [/backend, /frontend, /mcp, /deploy/backup, /deploy/postgres]
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: nginx
        versions: [">=1.31, <1.32", ">=1.33, <1.34", ">=1.35, <1.36"]
      - dependency-name: postgres
        versions: [">=18"]
    groups:
      base-images:
        patterns: ["*"]
