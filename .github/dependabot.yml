version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    groups:
      angular:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
          - "@schematics/angular"
          - "angular-eslint"
          - "typescript"
      npm-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: gradle
    directory: /backend
    schedule:
      interval: monthly
    groups:
      gradle-minor-and-patch:
        update-types: [minor, patch]
