name: Deploy to ZimaOS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build and push images
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prefix=ghcr.io/${GITHUB_REPOSITORY,,}
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for app in backend frontend; do
            docker build \
              --label org.opencontainers.image.source="https://github.com/$GITHUB_REPOSITORY" \
              --label org.opencontainers.image.revision="$GITHUB_SHA" \
              -t "$prefix-$app:latest" -t "$prefix-$app:${GITHUB_SHA::7}" "$app"
            docker push --all-tags "$prefix-$app"
          done

  deploy:
    needs: images
    runs-on: [self-hosted, zima-nfnn]
    permissions:
      contents: read
      packages: read
    env:
      NFNN_DIR: /DATA/AppData/nfnn
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install compose file
        run: |
          if [ ! -s "$NFNN_DIR/.env" ]; then
            echo "::error::$NFNN_DIR/.env is missing, see deploy/README.md"
            exit 1
          fi
          cp deploy/compose.yml "$NFNN_DIR/compose.yml"

      - name: Pull and start
        working-directory: ${{ env.NFNN_DIR }}
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export NFNN_TAG=${GITHUB_SHA::7}
          export DOCKER_CONFIG="$RUNNER_TEMP/docker"
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker compose pull
          docker logout ghcr.io
          docker compose up -d --wait --wait-timeout 300 --remove-orphans

      - name: Verify
        working-directory: ${{ env.NFNN_DIR }}
        run: |
          gw=$(awk '$2 == "00000000" { print $3; exit }' /proc/net/route)
          host=$(printf '%d.%d.%d.%d' "0x${gw:6:2}" "0x${gw:4:2}" "0x${gw:2:2}" "0x${gw:0:2}")
          port=$(docker compose port frontend 80 | awk -F: '{ print $NF }')
          echo "checking http://$host:$port/"
          curl -fsS --max-time 10 --retry 2 "http://$host:$port/" | grep -q '<app-root'
          status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "http://$host:$port/api/")
          echo "/api/ answered $status"
          case "$status" in
            502|503|504|000) echo "::error::nginx could not reach the backend"; exit 1 ;;
          esac

      - name: Logs
        if: failure()
        working-directory: ${{ env.NFNN_DIR }}
        run: |
          docker compose ps
          docker compose logs --no-color --tail 100
