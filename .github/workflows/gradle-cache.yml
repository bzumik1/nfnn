name: Gradle cache

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/gradle-cache.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gradle-cache
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6

      - name: Build and run the architecture rules, which downloads everything the PR check needs
        run: ./gradlew assemble testClasses test --tests "*architecture*" -PnoCucumber
