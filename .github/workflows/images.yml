name: Publish and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: images
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build and push images
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prefix=ghcr.io/${GITHUB_REPOSITORY,,}
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for app in backend frontend; do
            docker build \
              --label org.opencontainers.image.source="https://github.com/$GITHUB_REPOSITORY" \
              --label org.opencontainers.image.revision="$GITHUB_SHA" \
              -t "$prefix-$app:latest" -t "$prefix-$app:${GITHUB_SHA::7}" "$app"
            docker push --all-tags "$prefix-$app"
          done

  deploy:
    needs: images
    runs-on: [self-hosted, nfnn]
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Start the new version
        run: |
          docker compose --env-file /nfnn/secrets.env -f deploy/compose.yml \
            up -d --pull always --remove-orphans --wait --wait-timeout 300

      - name: Verify
        run: |
          docker exec nfnn-frontend wget -q -O - http://127.0.0.1/ | grep -q '<app-root'
          docker exec nfnn-frontend wget -q -O - http://backend:8080/actuator/health | grep -q '"status":"UP"'

      - name: Remove replaced images
        run: docker image prune -f

      - name: Logs
        if: failure()
        run: docker compose --env-file /nfnn/secrets.env -f deploy/compose.yml logs --no-color --tail 200
