name: Publish Docker images

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "deploy/backup/**"
      - "deploy/postgres/**"
      - "mcp/**"
      - ".github/workflows/images.yml"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: images
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build and push images
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prefix=ghcr.io/${GITHUB_REPOSITORY,,}
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for image in backend:backend frontend:frontend backup:deploy/backup postgres:deploy/postgres mcp:mcp; do
            app=${image%%:*}
            context=${image#*:}
            docker build \
              --build-arg REVISION="${GITHUB_SHA::7}" \
              --label org.opencontainers.image.source="https://github.com/$GITHUB_REPOSITORY" \
              --label org.opencontainers.image.revision="$GITHUB_SHA" \
              -t "$prefix-$app:latest" -t "$prefix-$app:${GITHUB_SHA::7}" "$context"
            docker push --all-tags "$prefix-$app"
          done

