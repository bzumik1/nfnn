name: Issue labels

on:
  push:
    branches: [main]
    paths:
      - scripts/pr-labels.mjs
      - .github/workflows/issue-labels.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync:
    name: Sync the managed labels
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the label list from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: scripts/pr-labels.mjs
          sparse-checkout-cone-mode: false

      - name: Create or update each managed label
        if: hashFiles('scripts/pr-labels.mjs') != ''
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const { syncLabels } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/pr-labels.mjs`);
            await syncLabels({ github, context });
