name: Nightly

on:
  schedule:
    - cron: "23 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  public-screens:
    name: Veřejné stránky proti v2
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the frontend's dependencies and Playwright's Chromium headless shell
        working-directory: frontend
        run: |
          npm ci
          scripts/install-playwright-browsers.sh --only-shell chromium

      - name: The public pages of main look as v2 drew them, but for the accepted differences
        run: |
          baseline=$(tr -d '[:space:]' < regression/v2/BASELINE_COMMIT)
          git fetch --depth=1 origin "$baseline"
          node scripts/compare-screens.mjs --base="$baseline" --v2-only --public-only --accepted=regression/public-screens-since-v2.json --out="$RUNNER_TEMP/v2"

      - name: Put the comparison into the job summary
        if: ${{ !cancelled() }}
        run: |
          [ -f "$RUNNER_TEMP/v2/report.md" ] && cat "$RUNNER_TEMP/v2/report.md" >> "$GITHUB_STEP_SUMMARY" || echo "The comparison wrote no report" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the shots of v2 and of main with the crops of every difference
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verejne-stranky-proti-v2
          path: |
            ${{ runner.temp }}/v2/report.md
            ${{ runner.temp }}/v2/crops/
            ${{ runner.temp }}/v2/base-shots/
            ${{ runner.temp }}/v2/head-shots/
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Zkouška vydání
    uses: ./.github/workflows/release-rehearsal.yml

  sync-convergence:
    name: Konvergence synchronizace
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Three devices of one donor and three of the administration converge on what a fresh download gives, over 300 seeds
        run: ./gradlew test --tests "*DonorDeviceSyncTest" --tests "*AdminDeviceSyncTest" -PnoCucumber
        env:
          SYNC_CONVERGENCE_SEEDS: "300"

      - name: Keep the test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: konvergence-synchronizace
          path: backend/build/reports/
          retention-days: 14

  bulk-receipts:
    name: Hromadná potvrzení (300)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the frontend's dependencies and Playwright's Chromium headless shell
        run: |
          npm ci
          scripts/install-playwright-browsers.sh --only-shell chromium

      - name: Build the frontend for production
        run: npm run build

      - name: The browser issues and draws 300 yearly receipts into one PDF at a quarter of the CPU within the budget
        run: npx playwright test e2e/bulk-receipts-load.spec.ts --project=chromium
        env:
          BULK_RECEIPTS_LOAD: "1"
          E2E_DIST: dist/frontend/browser
          CI: "1"

      - name: Keep the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hromadna-potvrzeni
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14
          if-no-files-found: ignore

  report:
    name: Hlášení
    needs: [public-screens, release, sync-convergence, bulk-receipts]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the nightly issue when a job failed, and close it once every job passes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULTS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          lane() {
            case "$1" in
              public-screens) echo "Veřejné stránky proti v2|veřejný web|další řez, který mění veřejné stránky nebo jejich vzhled (2.4, 2.5, 2.6, 2.7, 2.22, 2.26a)" ;;
              release) echo "Zkouška vydání (nasazená revize a latest)|provoz, schéma a obrazy|další řez s changesetem Liquibase nebo se změnou obrazů, compose, záloh či importu (2.3, 2.4, 2.9, 2.12, 2.17, 2.27)" ;;
              sync-convergence) echo "Konvergence synchronizace (300 semínek)|kopie dat v zařízení dárce a její synchronizace|další řez, který mění synchronizaci nebo kopii v zařízení (2.13, 2.17)" ;;
              bulk-receipts) echo "Hromadná potvrzení (300 potvrzení při čtvrtinovém výkonu)|kreslení potvrzení v prohlížeči a hromadná potvrzení|další řez, který mění kreslení potvrzení nebo hromadná potvrzení (2.19)" ;;
              *) echo "$1|neurčeno|doplňte job do tabulky v nightly.yml a v .claude/rules/testing-nightly.md" ;;
            esac
          }
          table="| Noční job | Výsledek | Oblast | Co čeká, dokud je červený |
          |---|---|---|---|"
          failed=0
          for job in $(jq -r 'keys[]' <<<"$RESULTS"); do
            result=$(jq -r --arg job "$job" '.[$job].result' <<<"$RESULTS")
            IFS='|' read -r title area waits <<<"$(lane "$job")"
            table="$table
          | $title | $result | $area | $waits |"
            [ "$result" = success ] || failed=1
          done
          echo "$table"
          existing=$(gh issue list --label nightly --state open --json number --jq '.[0].number // empty')
          if [ "$failed" = 1 ]; then
            gh label create nightly --color B60205 --description "Noční běh selhal" 2> /dev/null || true
            body="Noční běh $(date -u +%Y-%m-%d) neprošel: $RUN_URL

          $table

          Dokud je job červený, další řez jeho oblasti čeká. Opravu dělá vlákno, které vlastní oblast; issue se zavře samo po prvním zeleném nočním běhu."
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --body "$body"
              echo "Updated the nightly issue #$existing"
            else
              gh issue create --title "Noční běh selhal" --label nightly --body "$body"
            fi
            exit 0
          fi
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Noční běh $(date -u +%Y-%m-%d) prošel celý: $RUN_URL

          $table"
            gh issue close "$existing" --reason completed
            echo "Closed the nightly issue #$existing"
          fi
          echo "Every nightly job passed"
