name: PR check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew build

      - name: Keep test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: backend/build/reports/
          retention-days: 14

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Formatting follows Prettier
        run: npm run format:check

      - name: Code follows the lint rules
        run: npm run lint

      - name: Styles use the theme's tokens
        run: npm run lint:styles

      - name: Unit tests
        run: npx ng test --watch=false

      - name: Build
        run: npm run build

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end and accessibility tests
        run: npm run e2e

  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build images
        run: |
          docker build -t ghcr.io/bzumik1/nfnn-backend:latest backend
          docker build -t ghcr.io/bzumik1/nfnn-frontend:latest frontend

      - name: Compose file has no dollar signs
        run: |
          if grep -n '\$' deploy/compose.yml; then
            echo "::error::ZimaOS stores the compose file without its \$\$ escapes, so every \$ becomes an empty variable"
            exit 1
          fi

      - name: Compose file names no secret
        run: |
          if grep -noE '\b(POSTGRES_PASSWORD|PGPASSWORD|DB_PASSWORD|JWT_SECRET|MAIL_PASSWORD|FIO_TOKEN)\b' deploy/compose.yml; then
            echo "::error::Secrets live in the env files on the server (deploy/*.env.example), never in deploy/compose.yml"
            exit 1
          fi

      - name: Env template values survive the YAML copy ZimaOS makes
        run: |
          failed=0
          while IFS= read -r line; do
            file=${line%%:*}
            entry=${line#*:}
            entry=${entry#\#}
            key=${entry%%=*}
            value=${entry#*=}
            tag=$(printf 'v: %s\n' "$value" | yq '.v | tag' 2>/dev/null) || tag=invalid
            case "$tag" in
              '!!str') continue ;;
              '!!int') [[ $value =~ ^(0|[1-9][0-9]*)$ ]] && continue ;;
              '!!bool') [[ $value =~ ^(true|false)$ ]] && continue ;;
              '!!timestamp') [ "$key" = FIO_HISTORY_FROM ] && continue ;;
            esac
            echo "::error file=$file::$key=$value is read by YAML as $tag, so ZimaOS stores it in another form; make the backend accept that form and allow it here"
            failed=1
          done < <(grep -HE '^#?[A-Z_]+=.+' deploy/*.env.example)
          exit $failed

      - name: Prepare compose file and env files from the templates
        run: |
          env_dir="$RUNNER_TEMP/nfnn/env"
          mkdir -p "$RUNNER_TEMP/nfnn"
          umask 077
          mkdir "$env_dir"
          db_password=$(openssl rand -hex 32)
          jwt_secret=$(openssl rand -hex 32)
          sed -E "s/^(POSTGRES_PASSWORD|PGPASSWORD|DB_PASSWORD)=$/\1=$db_password/" deploy/db.env.example > "$env_dir/db.env"
          sed -E "s/^JWT_SECRET=$/JWT_SECRET=$jwt_secret/" deploy/backend.env.example > "$env_dir/backend.env"
          if [ "$(grep -cE '^(POSTGRES_PASSWORD|PGPASSWORD|DB_PASSWORD)=[0-9a-f]{64}$' "$env_dir/db.env")" != 3 ]; then
            echo "::error::deploy/db.env.example must have the empty lines POSTGRES_PASSWORD=, PGPASSWORD= and DB_PASSWORD="
            exit 1
          fi
          if ! grep -qE '^JWT_SECRET=[0-9a-f]{64}$' "$env_dir/backend.env"; then
            echo "::error::deploy/backend.env.example must have the empty line JWT_SECRET="
            exit 1
          fi
          sed "s#/DATA/AppData/nfnn#$RUNNER_TEMP/nfnn#g" deploy/compose.yml > "$RUNNER_TEMP/compose.yml"
          echo "COMPOSE_FILE=$RUNNER_TEMP/compose.yml" >> "$GITHUB_ENV"

      - name: Start the production stack
        run: docker compose up -d --wait --wait-timeout 300

      - name: Verify
        run: |
          curl -fsS --max-time 10 http://localhost:8089/ | grep -q '<app-root'
          status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 http://localhost:8089/api/)
          echo "/api/ answered $status"
          case "$status" in
            502|503|504|000) echo "::error::nginx could not reach the backend"; exit 1 ;;
          esac
          for container in nfnn-postgres nfnn-backup; do
            for key in JWT_SECRET FIO_TOKEN MAIL_PASSWORD; do
              if docker exec "$container" printenv "$key" > /dev/null; then
                echo "::error::$container must not receive $key: only the backend reads backend.env"
                exit 1
              fi
            done
          done
          for _ in $(seq 30); do
            for dump in "$RUNNER_TEMP"/nfnn/backups/nfnn-*.dump; do
              [ -f "$dump" ] || continue
              if ! docker exec nfnn-backup pg_restore --list "/backups/$(basename "$dump")" | grep -q 'Compression: zstd'; then
                echo "::error::the backup dump is not compressed with zstd"
                exit 1
              fi
              echo "$dump is a zstd dump"
              exit 0
            done
            sleep 2
          done
          echo "::error::the backup service wrote no dump"
          exit 1

      - name: Logs
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Stop
        if: always()
        run: docker compose down
