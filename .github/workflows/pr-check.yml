name: PR check

on:
  pull_request:
    branches: [main]
    paths:
      - "**"
      - "!docs/**"
      - "!.claude/**"
      - "!**/*.md"

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Build and test
        run: ./gradlew build

      - name: Keep test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: backend/build/reports/
          retention-days: 14

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Formatting follows Prettier
        run: npm run format:check

      - name: Code follows the lint rules
        run: npm run lint

      - name: Styles use the theme's tokens
        run: npm run lint:styles

      - name: Unit tests
        run: npx ng test --watch=false

      - name: Build
        run: npm run build

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end and accessibility tests
        run: npm run e2e

  mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - run: npm ci

      - name: Formatting, types and tests
        run: npm run check

  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build images
        run: |
          docker build -t ghcr.io/bzumik1/nfnn-backend:latest backend
          docker build -t ghcr.io/bzumik1/nfnn-frontend:latest frontend
          docker build -t ghcr.io/bzumik1/nfnn-backup:latest deploy/backup
          docker build -t ghcr.io/bzumik1/nfnn-postgres:latest deploy/postgres
          docker build -t ghcr.io/bzumik1/nfnn-mcp:latest mcp

      - name: Compose file has no dollar signs
        run: |
          if grep -n '\$' deploy/compose.yml; then
            echo "::error::ZimaOS stores the compose file without its \$\$ escapes, so every \$ becomes an empty variable"
            exit 1
          fi

      - name: Compose file names no secret
        run: |
          if grep -noE '\b(POSTGRES_PASSWORD|PGPASSWORD|DB_PASSWORD|JWT_SECRET|SETTINGS_KEY|MAIL_PASSWORD|FIO_TOKEN)\b' deploy/compose.yml; then
            echo "::error::Secrets are generated into secrets/ or entered in the first setup, never written into deploy/compose.yml"
            exit 1
          fi

      - name: Only the frontend publishes a port, nothing reads an env file and the secrets folder reaches only its services
        run: |
          if [ "$(yq '[.services[] | select(has("ports"))] | length' deploy/compose.yml)" != 1 ] || [ "$(yq '.services.frontend | has("ports")' deploy/compose.yml)" != true ]; then
            echo "::error::only the frontend publishes a port"
            exit 1
          fi
          if [ "$(yq '[.services[] | select(has("env_file"))] | length' deploy/compose.yml)" != 0 ]; then
            echo "::error::no service reads an env file: secrets are generated into secrets/ and settings come from the first setup"
            exit 1
          fi
          secrets_mounts=$(yq -o=json '[.services | to_entries[] | select(.value.volumes[]? | test("^/DATA/AppData/nfnn/secrets:")) | .key + "=" + (.value.volumes[] | select(test("^/DATA/AppData/nfnn/secrets:")))] | sort | join(" ")' deploy/compose.yml)
          if [ "$secrets_mounts" != '"backend=/DATA/AppData/nfnn/secrets:/secrets backup=/DATA/AppData/nfnn/secrets:/secrets:ro postgres=/DATA/AppData/nfnn/secrets:/secrets"' ]; then
            echo "::error::the secrets folder goes to postgres and the backend, read-only to the backup, and to nothing else (found $secrets_mounts)"
            exit 1
          fi
          if [ "$(yq '.services.mcp.volumes | length' deploy/compose.yml)" != 1 ] || [ "$(yq '.services.mcp.volumes[0]' deploy/compose.yml)" != /DATA/AppData/nfnn/logs:/logs ] || [ "$(yq '.services.mcp | has("env_file")' deploy/compose.yml)" != false ]; then
            echo "::error::the MCP connector mounts only the logs folder (for its own log file) and reads no env file (it holds no secret)"
            exit 1
          fi
          if [ "$(yq '.services.frontend.volumes | length' deploy/compose.yml)" != 1 ] || [ "$(yq '.services.frontend.volumes[0]' deploy/compose.yml)" != /DATA/AppData/nfnn/logs:/logs ] || [ "$(yq '.services.frontend | has("env_file")' deploy/compose.yml)" != false ]; then
            echo "::error::the frontend mounts only the logs folder (for its access log) and reads no env file"
            exit 1
          fi
          if [ "$(yq '[.services[] | select(has("network_mode") or has("links"))] | length' deploy/compose.yml)" != 0 ] || [ "$(yq '.networks.internal.internal' deploy/compose.yml)" != true ]; then
            echo "::error::the services live on their own networks (not the default bridge that other apps on the server share) and the database network has no way out"
            exit 1
          fi
          networks=$(yq -o=json '[.services | to_entries[] | .key + "=" + (.value.networks | sort | join(","))] | sort | join(" ")' deploy/compose.yml)
          if [ "$networks" != '"backend=edge,internal backup=internal frontend=edge mcp=edge postgres=internal"' ]; then
            echo "::error::only the backend and the backup reach the database network, and the database reaches nothing else (found $networks)"
            exit 1
          fi
          if [ "$(yq '[.services[] | select((.security_opt // []) | contains(["no-new-privileges:true"]) | not)] | length' deploy/compose.yml)" != 0 ]; then
            echo "::error::every service sets no-new-privileges"
            exit 1
          fi

      - name: Both images rotate their log with the same script
        run: |
          if ! cmp frontend/rotate-log.sh mcp/rotate-log.sh; then
            echo "::error::frontend/rotate-log.sh and mcp/rotate-log.sh are one script copied into two build contexts; change both"
            exit 1
          fi

      - name: Prepare the compose file
        run: |
          mkdir -p "$RUNNER_TEMP/nfnn"
          install -d -m 755 "$RUNNER_TEMP/nfnn/logs"
          for log in nginx-access.log mcp.log; do
            echo "2026-01-01T00:00:00+00:00 left over from an earlier day" > "$RUNNER_TEMP/nfnn/logs/$log"
            chmod 644 "$RUNNER_TEMP/nfnn/logs/$log"
            touch -d '2 days ago' "$RUNNER_TEMP/nfnn/logs/$log"
          done
          sed "s#/DATA/AppData/nfnn#$RUNNER_TEMP/nfnn#g" deploy/compose.yml > "$RUNNER_TEMP/compose.yml"
          echo "COMPOSE_FILE=$RUNNER_TEMP/compose.yml" >> "$GITHUB_ENV"

      - name: Start the production stack
        run: docker compose up -d --wait --wait-timeout 300

      - name: First setup
        run: |
          secrets="$RUNNER_TEMP/nfnn/secrets"
          for file in db-password jwt-secret settings-key; do
            [ "$(sudo stat -c '%a %U' "$secrets/$file")" = '600 root' ] || { echo "::error::secrets/$file must exist, owned by root with mode 600"; sudo ls -la "$secrets"; exit 1; }
          done
          status=$(curl -fsS --max-time 10 http://localhost:8089/api/operations/setup)
          [ "$status" = '{"required":true,"codeRequired":false,"lastRestore":null}' ] || { echo "::error::a fresh install opened directly must ask for the setup without a code (got $status)"; exit 1; }
          proxied=$(curl -fsS --max-time 10 -H 'X-Forwarded-For: 203.0.113.7' http://localhost:8089/api/operations/setup)
          [ "$proxied" = '{"required":true,"codeRequired":true,"lastRestore":null}' ] || { echo "::error::a request through a proxy must need the code (got $proxied)"; exit 1; }
          wrong=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 -H 'X-Forwarded-For: 203.0.113.7' -H 'Content-Type: application/json' --data '{"code":"AAAA-BBBB-CCCC"}' http://localhost:8089/api/operations/setup/unlock)
          [ "$wrong" = 403 ] || { echo "::error::a wrong code must answer 403 (got $wrong)"; exit 1; }
          code=$(docker logs nfnn-backend 2>&1 | grep -oE '^ +[2-9A-Z]{4}-[2-9A-Z]{4}-[2-9A-Z]{4} *$' | tail -n 1 | tr -d ' ')
          [ -n "$code" ] || { echo "::error::the backend printed no setup code into the container log"; exit 1; }
          if grep -q -- "$code" "$RUNNER_TEMP/nfnn/logs/backend.log"; then
            echo "::error::the setup code must not reach backend.log, which administrators and the connector read"
            exit 1
          fi
          right=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 -H 'X-Forwarded-For: 203.0.113.7' -H 'Content-Type: application/json' --data "{\"code\":\"$code\"}" http://localhost:8089/api/operations/setup/unlock)
          [ "$right" = 204 ] || { echo "::error::the code from the log must unlock the setup (got $right)"; exit 1; }
          restarts=$(docker inspect -f '{{.RestartCount}}' nfnn-backend)
          saved=$(curl -fsS --max-time 30 -H 'X-Forwarded-For: 203.0.113.7' -H 'Content-Type: application/json' --data "{\"code\":\"$code\",\"settings\":[{\"name\":\"PUBLIC_URL\",\"value\":\"http://localhost:8089\"},{\"name\":\"MAIL_HOST\",\"value\":\"localhost\"},{\"name\":\"MAIL_PORT\",\"value\":\"1025\"},{\"name\":\"MAIL_FROM\",\"value\":\"info@nfnn.cz\"},{\"name\":\"CONTACT_RECIPIENT\",\"value\":\"info@nfnn.cz\"},{\"name\":\"ADMIN_EMAILS\",\"value\":\"spravce@example.cz\"},{\"name\":\"MAIL_PASSWORD\",\"value\":\"not-a-real-password\"}]}" http://localhost:8089/api/operations/setup)
          echo "$saved" | jq -e '.restarting == true' > /dev/null || { echo "::error::the setup was not saved: $saved"; exit 1; }
          echo "The backend restarts with the stored settings"
          for _ in $(seq 90); do
            if [ "$(docker inspect -f '{{.RestartCount}}' nfnn-backend)" -gt "$restarts" ] && [ "$(docker inspect -f '{{.State.Health.Status}}' nfnn-backend)" = healthy ]; then
              break
            fi
            sleep 2
          done
          [ "$(docker inspect -f '{{.State.Health.Status}}' nfnn-backend)" = healthy ] && [ "$(docker inspect -f '{{.RestartCount}}' nfnn-backend)" -gt "$restarts" ] || { echo "::error::the backend did not come back after the setup"; exit 1; }
          done_status=$(curl -fsS --max-time 10 http://localhost:8089/api/operations/setup)
          [ "$(echo "$done_status" | jq -r '.required')" = false ] || { echo "::error::the setup still asks after the restart"; exit 1; }
          grep -q 'Loaded 7 stored settings' "$RUNNER_TEMP/nfnn/logs/backend.log" || { echo "::error::the backend did not load the stored settings"; exit 1; }
          stored=$(docker exec nfnn-postgres psql -U novanadeje -d novanadeje -tA -c "select value from operations_setting where name = 'MAIL_PASSWORD'")
          case "$stored" in
            v1:*) ;;
            *) echo "::error::the SMTP password must be stored encrypted"; exit 1 ;;
          esac
          if echo "$stored" | grep -q not-a-real-password; then
            echo "::error::the stored SMTP password is readable in the database"
            exit 1
          fi
          closed=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 -H 'Content-Type: application/json' --data '{"code":null,"settings":[]}' http://localhost:8089/api/operations/setup)
          [ "$closed" = 409 ] || { echo "::error::a completed setup must answer 409 (got $closed)"; exit 1; }

      - name: The database takes the generated password even when it had another one
        run: |
          docker exec nfnn-postgres psql -U novanadeje -d novanadeje -c "alter role novanadeje password 'an-old-password'"
          docker compose restart postgres
          for _ in $(seq 30); do
            if docker exec nfnn-postgres sh -c 'PGPASSWORD=$(cat /secrets/db-password) psql -h 127.0.0.1 -U novanadeje -d novanadeje -tA -c "select 1"' 2> /dev/null | grep -q 1; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::nfnn-postgres did not set the role's password to the generated one"
          exit 1

      - name: Verify
        run: |
          curl -fsS --max-time 10 http://localhost:8089/ | grep -q '<app-root'
          status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 http://localhost:8089/api/)
          echo "/api/ answered $status"
          case "$status" in
            502|503|504|000) echo "::error::nginx could not reach the backend"; exit 1 ;;
          esac
          for container in nfnn-postgres nfnn-backup nfnn-mcp nfnn-frontend; do
            for key in JWT_SECRET SETTINGS_KEY DB_PASSWORD FIO_TOKEN MAIL_PASSWORD; do
              if docker exec "$container" printenv "$key" > /dev/null || docker exec "$container" sh -c "tr '\\0' '\\n' < /proc/1/environ" | grep -q "^$key="; then
                echo "::error::$container must not receive $key, neither in its configuration nor in its main process"
                exit 1
              fi
            done
          done
          docker exec nfnn-backend sh -c 'uid=$(awk "/^Uid:/ {print \$2}" /proc/1/status); [ "$uid" = "$(id -u app)" ]' || { echo "::error::the backend's Java process must run as the app user"; exit 1; }
          backend_ip=$(docker inspect -f '{{(index .NetworkSettings.Networks "nfnn-edge").IPAddress}}' nfnn-backend)
          postgres_ip=$(docker inspect -f '{{(index .NetworkSettings.Networks "nfnn-internal").IPAddress}}' nfnn-postgres)
          if docker run --rm --network bridge --entrypoint sh ghcr.io/bzumik1/nfnn-postgres:latest -c "wget -q -T 3 -O /dev/null http://$backend_ip:8080/actuator/health || pg_isready -q -h $postgres_ip -t 3"; then
            echo "::error::a container on the default bridge reached the backend or the database"
            exit 1
          fi
          docker exec nfnn-frontend sh -c '! getent hosts postgres' || { echo "::error::the frontend must not see the database"; exit 1; }
          docker exec nfnn-mcp sh -c '! getent hosts postgres' || { echo "::error::the connector must not see the database"; exit 1; }
          echo "The backend and the backup service write their logs into the logs folder"
          logs="$RUNNER_TEMP/nfnn/logs"
          grep -q 'Backend revision dev is ready' "$logs/backend.log" || { echo "::error::the backend did not write its log file"; ls -la "$logs"; exit 1; }
          grep -q 'backup written' "$logs/backup.log" || { echo "::error::the backup service did not write its log file"; ls -la "$logs"; exit 1; }
          echo "The MCP connector answers through the frontend: a challenge without a token, the resource metadata and the authorization server metadata"
          [ -z "$(docker port nfnn-mcp)" ] || { echo "::error::the MCP connector must publish no port"; exit 1; }
          issuer=$(curl -fsS --max-time 10 http://localhost:8089/.well-known/oauth-authorization-server | jq -r '.issuer')
          [ -n "$issuer" ] && [ "$issuer" != null ] || { echo "::error::the authorization server metadata names no issuer"; exit 1; }
          echo "The authorization server is $issuer"
          echo "The connector picks up the address saved in the first setup within its 30 s refresh"
          for _ in $(seq 25); do
            docker exec nfnn-mcp wget -q -O - http://127.0.0.1:8081/health | jq -e --arg issuer "$issuer" '.issuer == $issuer' > /dev/null && break
            sleep 2
          done
          docker exec nfnn-mcp wget -q -O - http://127.0.0.1:8081/health | jq -e --arg issuer "$issuer" '.issuer == $issuer' > /dev/null || { echo "::error::the MCP connector still names another authorization server"; exit 1; }
          mcp_headers=$(curl -sS -D - -o /dev/null --max-time 10 -X POST -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' --data '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' http://localhost:8089/mcp)
          echo "$mcp_headers" | grep -q '^HTTP/1.1 401' || { echo "::error::/mcp without a token must answer 401"; echo "$mcp_headers"; exit 1; }
          echo "$mcp_headers" | grep -qi "^WWW-Authenticate: Bearer .*resource_metadata=\"$issuer/.well-known/oauth-protected-resource/mcp\"" || { echo "::error::the 401 must point at the protected resource metadata"; echo "$mcp_headers"; exit 1; }
          metadata=$(curl -fsS --max-time 10 http://localhost:8089/.well-known/oauth-protected-resource/mcp)
          [ "$(echo "$metadata" | jq -r '.resource')" = "$issuer/mcp" ] || { echo "::error::the protected resource metadata does not name /mcp"; echo "$metadata"; exit 1; }
          [ "$(echo "$metadata" | jq -r '.authorization_servers[0]')" = "$issuer" ] || { echo "::error::the protected resource metadata does not name the site as its authorization server"; echo "$metadata"; exit 1; }
          [ "$(echo "$metadata" | jq -r '.scopes_supported | join(" ")')" = "admin:read admin:write" ] || { echo "::error::the protected resource metadata does not list both scopes"; echo "$metadata"; exit 1; }
          docker exec nfnn-mcp wget -q -O - http://127.0.0.1:8081/health | grep -q '"status":"UP"' || { echo "::error::the MCP connector did not discover the authorization server"; exit 1; }
          docker exec nfnn-mcp sh -c 'uid=$(awk "/^Uid:/ {print \$2}" /proc/1/status); [ "$uid" = "$(id -u node)" ]' || { echo "::error::the MCP connector must run as the node user"; exit 1; }
          echo "The frontend and the connector write their logs into the logs folder, without addresses or query strings, and rotated the files left over from an earlier day"
          curl -fsS -o /dev/null --max-time 10 'http://localhost:8089/?q=not-in-the-log'
          docker exec nfnn-frontend wget -q -O /dev/null http://127.0.0.1/healthcheck-not-in-the-log
          grep -q 'Authorization server discovered' "$logs/mcp.log" || { echo "::error::the MCP connector did not write its log file"; ls -la "$logs"; exit 1; }
          grep -qE ' GET / 200 ' "$logs/nginx-access.log" || { echo "::error::nginx did not write its access log"; ls -la "$logs"; exit 1; }
          grep -qE ' POST /mcp 401 ' "$logs/nginx-access.log" || { echo "::error::the access log misses the connector's 401"; cat "$logs/nginx-access.log"; exit 1; }
          if grep -nE 'not-in-the-log|([0-9]{1,3}\.){3}[0-9]{1,3}' "$logs/nginx-access.log"; then
            echo "::error::the access log must name no client address, no query string and no healthcheck from inside the container"
            exit 1
          fi
          docker logs nfnn-frontend > "$RUNNER_TEMP/frontend-console.log" 2>&1
          grep -qE ' GET / 200 ' "$RUNNER_TEMP/frontend-console.log" || { echo "::error::nginx no longer writes its access log to the console"; exit 1; }
          if grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}T' "$RUNNER_TEMP/frontend-console.log" | grep -nE 'not-in-the-log|([0-9]{1,3}\.){3}[0-9]{1,3}'; then
            echo "::error::the console access log (docker logs) must name no client address and no query string either"
            exit 1
          fi
          for log in nginx-access.log mcp.log; do
            rotated=$(ls "$logs/$log".*.gz 2>/dev/null | head -n 1)
            [ -n "$rotated" ] && zcat "$rotated" | grep -q 'left over from an earlier day' || { echo "::error::$log left over from an earlier day was not rotated"; ls -la "$logs"; exit 1; }
            ! grep -q 'left over from an earlier day' "$logs/$log" || { echo "::error::$log still holds the earlier day"; exit 1; }
          done
          backups="$RUNNER_TEMP/nfnn/backups"
          wait_for() {
            for _ in $(seq "$2"); do
              if eval "$1"; then return 0; fi
              sleep 2
            done
            echo "::error::$3"
            return 1
          }
          wait_for "ls $backups/nfnn-*.dump > /dev/null 2>&1" 30 "the backup service wrote no dump"
          dump=$(ls "$backups"/nfnn-*.dump | head -n 1)
          if ! docker exec nfnn-backup pg_restore --list "/backups/$(basename "$dump")" | grep -q 'Compression: zstd'; then
            echo "::error::the backup dump is not compressed with zstd"
            exit 1
          fi
          echo "$dump is a zstd dump"
          grep -q '^outcome=ok$' "$backups/status/backup" || { echo "::error::the backup status file does not say ok"; cat "$backups/status/backup"; exit 1; }
          [ "$(stat -c %a "$backups/requests")" = 1777 ] || { echo "::error::the requests folder must be writable for the backend (mode 1777)"; exit 1; }

          echo "A requested backup and a test restore run from request files"
          docker exec nfnn-backend sh -c 'touch /backups/requests/ci-1.backup && touch /backups/requests/ci-2.test-restore'
          wait_for "grep -q '^request=ci-1$' $backups/status/backup" 30 "the requested backup did not run"
          grep -q -- '-rucni.dump$' "$backups/status/backup" || { echo "::error::the requested backup is not named -rucni"; exit 1; }
          wait_for "grep -q '^request=ci-2$' $backups/status/test-restore" 60 "the requested test restore did not run"
          grep -q '^outcome=ok$' "$backups/status/test-restore" || { echo "::error::the test restore failed"; cat "$backups/status/test-restore"; exit 1; }
          grep -E '^tables=[1-9][0-9]*$' "$backups/status/test-restore" || { echo "::error::the test restore counted no tables"; exit 1; }
          full_dump=$(ls "$backups"/nfnn-*-rucni.dump | head -n 1)

          echo "A dump in the restore folder is restored into the emptied database before the backend starts"
          restore="$RUNNER_TEMP/nfnn/restore"
          docker compose stop backend backup
          docker exec nfnn-postgres psql -U novanadeje -d novanadeje -c "insert into admin_action (id, admin_id, action, details, performed_at) values ('019a0000-0000-7000-8000-000000000001', '019a0000-0000-7000-8000-000000000002', 'CI_MARKER', 'to be undone by the restore', now())"
          sudo cp "$full_dump" "$restore/ci.force.dump"
          docker compose up -d --wait --wait-timeout 300 postgres backup backend frontend
          wait_for "[ -f $restore/ci.force.dump.done ]" 30 "the restore folder dump was not restored"
          grep -q '^outcome=ok$' "$backups/status/restore" || { echo "::error::the restore status file does not say ok"; cat "$backups/status/restore"; exit 1; }
          ls "$backups"/nfnn-*-pred-obnovou.dump > /dev/null || { echo "::error::no safety dump was taken before the forced restore"; exit 1; }
          marker=$(docker exec nfnn-postgres psql -U novanadeje -d novanadeje -tA -c "select count(*) from admin_action where action = 'CI_MARKER'")
          [ "$marker" = 0 ] || { echo "::error::the forced restore kept a row written after the dump"; exit 1; }
          curl -fsS --max-time 10 http://localhost:8089/ | grep -q '<app-root'

          echo "A restore asked for in the administration runs while the restarted backend waits, replaces the data and is recorded once"
          count_rows() {
            docker exec nfnn-postgres psql -U novanadeje -d novanadeje -tA -c "select count(*) from admin_action where $1"
          }
          docker exec nfnn-postgres psql -U novanadeje -d novanadeje -c "insert into admin_action (id, admin_id, action, details, performed_at) values ('019a0000-0000-7000-8000-000000000003', '019a0000-0000-7000-8000-000000000002', 'CI_MARKER', 'to be undone by the requested restore', now())"
          docker exec nfnn-backend sh -c "printf 'source=backup\nfile=%s\nadmin=019a0000-0000-7000-8000-000000000002\n' '$(basename "$full_dump")' > /backups/requests/ci-3.restore"
          docker restart nfnn-backend
          wait_for "grep -q '^request=ci-3$' $backups/status/restore" 60 "the requested restore did not run"
          grep -q '^outcome=ok$' "$backups/status/restore" || { echo "::error::the requested restore failed"; cat "$backups/status/restore"; exit 1; }
          docker compose up -d --wait --wait-timeout 300 backend
          [ ! -e "$backups/status/restore.running" ] || { echo "::error::the restore left its running marker"; exit 1; }
          [ "$(count_rows "action = 'CI_MARKER'")" = 0 ] || { echo "::error::the requested restore kept a row written after the dump"; exit 1; }
          [ "$(count_rows "action = 'BACKUP_RESTORED' and admin_id = '019a0000-0000-7000-8000-000000000002'")" = 1 ] || { echo "::error::the finished restore is not recorded in the administration history"; exit 1; }
          docker exec nfnn-postgres psql -U novanadeje -d postgres -tA -c "select datname from pg_database" | grep -q nfnn_restore && { echo "::error::a staging or retired database was left behind"; exit 1; }

          echo "A restore that fails leaves the data as they were, removes the upload and lets the backend start"
          docker exec nfnn-postgres psql -U novanadeje -d novanadeje -c "insert into admin_action (id, admin_id, action, details, performed_at) values ('019a0000-0000-7000-8000-000000000004', '019a0000-0000-7000-8000-000000000002', 'CI_MARKER', 'kept by the failed restore', now())"
          docker exec nfnn-backend sh -c "printf 'PGDMP but not a dump' > /restore/ci-4.upload && printf 'source=upload\nfile=ci-4.upload\nadmin=\n' > /backups/requests/ci-4.restore"
          docker restart nfnn-backend
          wait_for "grep -q '^request=ci-4$' $backups/status/restore" 60 "the failing restore did not run"
          grep -q '^outcome=failed$' "$backups/status/restore" || { echo "::error::the broken upload was not reported as failed"; cat "$backups/status/restore"; exit 1; }
          docker compose up -d --wait --wait-timeout 300 backend
          [ "$(count_rows "action = 'CI_MARKER'")" = 1 ] || { echo "::error::the failed restore changed the data"; exit 1; }
          [ ! -e "$restore/ci-4.upload" ] || { echo "::error::the upload was left in the restore folder"; exit 1; }
          curl -fsS --max-time 10 http://localhost:8089/ | grep -q '<app-root'

      - name: Logs
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Stop
        if: always()
        run: docker compose down
