          }
          live_sessions() {
            docker exec nfnn-postgres psql -U novanadeje_app -d novanadeje -tA -c "select (select count(*) from donor_refresh_token where revoked_at is null and used_at is null and expires_at > now()) + (select count(*) from donor_device where ended_at is null)"
          }
          docker exec nfnn-postgres psql -U novanadeje_app -d novanadeje -c "insert into donor (id, type, name, street, city, postal_code, email, variable_symbol, preferred_locale, registered_at, email_verified_at) values ('019a0000-0000-7000-8000-000000000007', 'PERSON', 'Zkušební Dárce', 'Ulice 1', 'Město', '110 00', 'ci-session@example.cz', '9900000007', 'cs', now(), now())"
          docker exec nfnn-postgres psql -U novanadeje_app -d novanadeje -c "insert into donor_device (id, donor_id, platform, browser, session_kind, signed_in_at, last_used_at) values ('019a0000-0000-7000-8000-000000000005', '019a0000-0000-7000-8000-000000000007', 'IPHONE', 'SAFARI', 'APP', now(), now())"
          docker exec nfnn-postgres psql -U novanadeje_app -d novanadeje -c "insert into donor_refresh_token (id, donor_id, secret_hash, issued_at, granted_at, expires_at, device_id) select '019a0000-0000-7000-8000-000000000006', donor_id, 'ci-session-in-the-dump', now(), now(), now() + interval '400 days', id from donor_device where id = '019a0000-0000-7000-8000-000000000005'"
          [ "$(live_sessions)" -ge 2 ] || { echo "::error::the dump to restore holds no signed-in device, so the restore cannot show that it ends them"; exit 1; }
          usable_links() {
            docker exec nfnn-postgres psql -U novanadeje_app -d novanadeje -tA -c "select (select count(*) from donor_password_reset_token where used_at is null and expires_at > now()) + (select count(*) from donor_email_verification_token where used_at is null and expires_at > now())"
          }
          docker exec nfnn-postgres psql -U novanadeje_app -d novanadeje -c "insert into donor_password_reset_token (id, donor_id, secret_hash, issued_at, expires_at) select '019a0000-0000-7000-8000-000000000007', id, repeat('7', 64), now(), now() + interval '1 day' from donor order by id limit 1"
          docker exec nfnn-postgres psql -U novanadeje_app -d novanadeje -c "insert into donor_email_verification_token (id, donor_id, secret_hash, issued_at, expires_at) select '019a0000-0000-7000-8000-000000000008', id, repeat('8', 64), now(), now() + interval '1 day' from donor order by id limit 1"
          [ "$(usable_links)" -ge 2 ] || { echo "::error::the dump to restore holds no usable reset or verification link, so the restore cannot show that it spends them"; exit 1; }
          erased=019a0000-0000-7000-8000-000000000012
          changed=019a0000-0000-7000-8000-000000000013
          demoted=019a0000-0000-7000-8000-000000000014
          docker exec nfnn-postgres psql -U novanadeje_app -d novanadeje -v ON_ERROR_STOP=1 \
            -c "insert into donor (id, type, name, street, city, postal_code, email, password_hash, variable_symbol, preferred_locale, registered_at, email_verified_at) values ('$erased', 'PERSON', 'Vymazat Později', 'Ulice 1', 'Město', '110 00', 'ci-erased@example.cz', '\$2a\$12\$ci-before-the-erasure', '9900000012', 'cs', now(), now()), ('$changed', 'PERSON', 'Změní Heslo', 'Ulice 1', 'Město', '110 00', 'ci-changed@example.cz', '\$2a\$12\$ci-password-in-the-dump', '9900000013', 'cs', now(), now()), ('$demoted', 'PERSON', 'Přestane Spravovat', 'Ulice 1', 'Město', '110 00', 'ci-demoted@example.cz', '\$2a\$12\$ci-administrator', '9900000014', 'cs', now(), now())" \
            -c "insert into donor_role (donor_id, role) values ('$erased', 'DONOR'), ('$changed', 'DONOR'), ('$demoted', 'DONOR'), ('$demoted', 'ADMIN')" \
            -c "insert into donor_record (donor_id, type, name, street, city, postal_code, variable_symbol, preferred_locale, registered_at, updated_at) select id, type, name, street, city, postal_code, variable_symbol, preferred_locale, registered_at, registered_at from donor where id = '$erased'"
          docker exec nfnn-postgres psql -U novanadeje_app -d novanadeje -c "update databasechangeloglock set locked = true, lockgranted = now(), lockedby = 'ci, as a dump taken while Liquibase runs'"
          docker exec nfnn-backend sh -c 'touch /backups/requests/ci-lock.backup'
          wait_for "grep -q '^request=ci-lock$' $backups/status/backup" 60 "the backup with the Liquibase lock held did not run"
          locked_dump=$(sed -n 's/^file=//p' "$backups/status/backup")
          docker exec nfnn-postgres psql -U novanadeje_app -d novanadeje -c "update databasechangeloglock set locked = false, lockgranted = null, lockedby = null"
          added_after_the_dump 019a0000-0000-7000-8000-000000000015 ci-after-the-locked-dump 9900000015
          docker exec nfnn-postgres psql -U novanadeje_app -d novanadeje -c "insert into admin_action (id, admin_id, action, details, performed_at) values ('019a0000-0000-7000-8000-000000000003', '019a0000-0000-7000-8000-000000000002', 'CI_MARKER', 'kept by the requested restore', now())"
          echo "After the dump: a donor erased as the administration erases one, a password changed and an administrator removed"
          docker exec nfnn-postgres psql -U novanadeje_app -d novanadeje -v ON_ERROR_STOP=1 \
            -c "update donor set erased_at = now(), name = 'Vymazaný dárce', email = 'erased-$erased@erased.invalid', street = 'Vymazáno', city = 'Vymazáno', postal_code = '00000', password_hash = null, email_verified_at = null where id = '$erased'" \
            -c "delete from donor_role where donor_id = '$erased'" \
            -c "update donor_record set erased_at = now(), name = 'Vymazaný dárce', street = 'Vymazáno', city = 'Vymazáno', postal_code = '00000' where donor_id = '$erased'" \
            -c "update donor set password_hash = '\$2a\$12\$ci-password-after-the-dump' where id = '$changed'" \
            -c "delete from donor_role where donor_id = '$demoted' and role = 'ADMIN'"
          docker exec nfnn-postgres psql -U novanadeje_app -d novanadeje -tA -c "select setval('donation_receipt_number_seq', 41)"
          docker exec nfnn-backend sh -c "printf 'source=backup\nfile=%s\nadmin=019a0000-0000-7000-8000-000000000002\n' '$locked_dump' > /backups/requests/ci-3.restore"
          docker restart nfnn-backend
          wait_for "grep -q '^request=ci-3$' $backups/status/restore" 60 "the requested restore did not run"
          grep -q '^outcome=ok$' "$backups/status/restore" || { echo "::error::the requested restore failed"; cat "$backups/status/restore"; exit 1; }
          docker compose up -d --wait --wait-timeout 300 backend
          [ ! -e "$backups/status/restore.running" ] || { echo "::error::the restore left its running marker"; exit 1; }
          [ "$(kept_rows 019a0000-0000-7000-8000-000000000015)" = 0 ] || { echo "::error::the requested restore kept a donor registered after the dump"; exit 1; }
          [ "$(count_rows "id in ('019a0000-0000-7000-8000-000000000001', '019a0000-0000-7000-8000-000000000003')")" = 2 ] || { echo "::error::the requested restore took back audit entries written after the dump"; exit 1; }
          [ "$(docker exec nfnn-postgres psql -U novanadeje_app -d novanadeje -tA -c "select datlocprovider::text || ' ' || datlocale from pg_database where datname = current_database()")" = "b C.UTF-8" ] || { echo "::error::a restored database takes PostgreSQL's built-in C.UTF-8 locale (create_app_database in deploy/backup/backup.sh)"; exit 1; }
          [ "$(docker exec nfnn-postgres psql -U novanadeje_app -d novanadeje -tA -c "select count(*) from databasechangeloglock where locked")" = 0 ] || { echo "::error::the restore kept the Liquibase lock caught in the dump"; exit 1; }
          receipt_number=$(docker exec nfnn-postgres psql -U novanadeje_app -d novanadeje -tA -c "select last_value from donation_receipt_number_seq")
          [ "$receipt_number" = 1041 ] || { echo "::error::the restore left the receipt numbers at $receipt_number; over a database without issued receipts they must go on from the higher of the two (41) plus 1000, so numbers issued after the backup are never issued again"; exit 1; }
          erasure_complete() {
            [ "$(docker exec nfnn-postgres psql -U novanadeje_app -d novanadeje -tA -c "select name || ' ' || email || ' ' || coalesce(password_hash, 'none') || ' ' || (erased_at is not null) from donor where id = '$erased'")" = "Vymazaný dárce erased-$erased@erased.invalid none true" ] \
              && [ "$(docker exec nfnn-postgres psql -U novanadeje_app -d novanadeje -tA -c "select name || ' ' || (erased_at is not null) from donor_record where donor_id = '$erased'")" = "Vymazaný dárce true" ]
          }
          wait_for erasure_complete 30 "the restore brought back a donor erased after the dump: the donor or the donations copy holds the personal data again, so the backend did not complete the erasure at its start"
          [ "$(docker exec nfnn-postgres psql -U novanadeje_app -d novanadeje -tA -c "select password_hash from donor where id = '$changed'")" = '$2a$12$ci-password-after-the-dump' ] || { echo "::error::the restore brought back a password replaced after the dump"; exit 1; }
          [ "$(docker exec nfnn-postgres psql -U novanadeje_app -d novanadeje -tA -c "select count(*) from donor_role where donor_id = '$demoted' and role = 'ADMIN'")" = 0 ] || { echo "::error::the restore made an administrator removed after the dump an administrator again"; exit 1; }
          for carried in erasures_carried=1 credentials_carried=1 roles_carried=1 receipt_numbers_skipped=1000; do
            grep -qx "$carried" "$backups/status/restore" || { echo "::error::the restore status does not say $carried"; cat "$backups/status/restore"; exit 1; }
          done
          admin_actions_carried=$(sed -n 's/^admin_actions_carried=//p' "$backups/status/restore")
          [ "${admin_actions_carried:-0}" -ge 1 ] || { echo "::error::the restore status does not count the audit entries it kept"; cat "$backups/status/restore"; exit 1; }
          [ "$(count_rows "action = 'BACKUP_RESTORED' and admin_id = '019a0000-0000-7000-8000-000000000002'")" = 1 ] || { echo "::error::the finished restore is not recorded in the administration history"; exit 1; }
          [ "$(live_sessions)" = 0 ] || { echo "::error::the restore kept a refresh token or a signed-in device of the backup, so a cookie from before the restore would still sign in"; exit 1; }
          [ "$(docker exec nfnn-postgres psql -U novanadeje_app -d novanadeje -tA -c "select end_reason from donor_device where id = '019a0000-0000-7000-8000-000000000005'")" = EXPIRED ] || { echo "::error::the restore did not end the device of the backup as expired"; exit 1; }
          [ "$(usable_links)" = 0 ] || { echo "::error::the restore kept a reset or verification link of the backup usable, so a link used after the backup would work again"; exit 1; }
          sessions_ended=$(sed -n 's/^sessions_ended=//p' "$backups/status/restore")
          secrets_spent=$(sed -n 's/^one_time_secrets_spent=//p' "$backups/status/restore")
          [ "${sessions_ended:-0}" -ge 1 ] && [ "${secrets_spent:-0}" -ge 2 ] || { echo "::error::the restore status does not count the sessions it ended and the one-time secrets it spent"; cat "$backups/status/restore"; exit 1; }
          [ "$(count_rows "action = 'BACKUP_RESTORED' and details like '%; ukončená přihlášení: $sessions_ended, zneplatněné jednorázové odkazy a kódy: $secrets_spent; zachováno z doby po záloze: vymazaní dárci 1, přihlašovací údaje 1, role 1, záznamy historie $admin_actions_carried; čísla potvrzení posunuta o 1000'")" = 1 ] || { echo "::error::the administration history does not name what the restore revoked and what it kept from after the backup"; exit 1; }
          docker exec nfnn-postgres psql -U novanadeje -d postgres -tA -c "select datname from pg_database" | grep -q nfnn_restore && { echo "::error::a staging or retired database was left behind"; exit 1; }
          [ "$(docker exec nfnn-postgres psql -U novanadeje_app -d novanadeje -tA -c "select count(*) from pg_class c join pg_namespace n on n.oid = c.relnamespace where n.nspname = 'public' and c.relowner <> 'novanadeje_app'::regrole")" = 0 ] || { echo "::error::the restored database must belong to novanadeje_app, or the backend cannot migrate it"; exit 1; }
          [ "$(docker exec nfnn-postgres psql -U novanadeje_app -d novanadeje -tA -c "select pg_get_userbyid(nspowner) from pg_namespace where nspname = 'public'")" = novanadeje_app ] || { echo "::error::the public schema of the restored database must belong to novanadeje_app"; exit 1; }
          [ "$(docker exec nfnn-postgres psql -U novanadeje_app -d novanadeje -tA -c "select pg_get_userbyid(datdba) from pg_database where datname = 'novanadeje'")" = novanadeje ] || { echo "::error::the restored database itself must belong to the superuser, so the application role creates no schema in it"; exit 1; }
          [ "$(docker exec nfnn-postgres psql -U novanadeje_app -d novanadeje -tA -c "select count(*) from pg_trigger where tgrelid = 'public.admin_action'::regclass and not tgisinternal")" = 2 ] || { echo "::error::the restore lost the triggers that keep the administration history append-only"; exit 1; }

          echo "A restore that fails leaves the data as they were, removes the upload and lets the backend start"
          docker exec nfnn-postgres psql -U novanadeje_app -d novanadeje -c "insert into admin_action (id, admin_id, action, details, performed_at) values ('019a0000-0000-7000-8000-000000000004', '019a0000-0000-7000-8000-000000000002', 'CI_MARKER', 'kept by the failed restore', now())"
          docker exec -u app nfnn-backend sh -c "printf 'PGDMP but not a dump' > /restore/ci-4.upload && printf 'source=upload\nfile=ci-4.upload\nadmin=\n' > /backups/requests/ci-4.restore"
          docker restart nfnn-backend
          wait_for "grep -q '^request=ci-4$' $backups/status/restore" 60 "the failing restore did not run"
          grep -q '^outcome=failed$' "$backups/status/restore" || { echo "::error::the broken upload was not reported as failed"; cat "$backups/status/restore"; exit 1; }
          docker compose up -d --wait --wait-timeout 300 backend
          [ "$(count_rows "id = '019a0000-0000-7000-8000-000000000004'")" = 1 ] || { echo "::error::the failed restore changed the data"; exit 1; }
          [ ! -e "$restore/ci-4.upload" ] || { echo "::error::the upload was left in the restore folder"; exit 1; }
          curl -fsS --max-time 10 http://localhost:8089/ | grep -q '<app-root'

      - name: A backup from before the switch is refused, a planted backup key is not adopted and an uploaded backup brings its own key
        if: matrix.part == 'keys'
        run: |
          echo "The restore probes start from a requested backup of this stack, as the journeys part takes it"
          backups="$RUNNER_TEMP/nfnn/backups"
          wait_for() {
            for _ in $(seq "$2"); do
              if eval "$1"; then return 0; fi
              sleep 2
            done
            echo "::error::$3"
            return 1
          }
          wait_for "ls $backups/nfnn-*.dump.age > /dev/null 2>&1" 30 "the backup service wrote no encrypted dump"
          docker exec nfnn-backend sh -c 'touch /backups/requests/ci-1.backup'
          wait_for "grep -q '^request=ci-1$' $backups/status/backup" 30 "the requested backup did not run"
          full_dump=$(ls "$backups"/nfnn-*-rucni.dump.age | head -n 1)
          restore="$RUNNER_TEMP/nfnn/restore"
          count_rows() {
            docker exec nfnn-postgres psql -U novanadeje_app -d novanadeje -tA -c "select count(*) from admin_action where $1"
          }
          echo "As after the restores part: a receipt number given out since the switch (41) and one row the failed restore kept"
          docker exec nfnn-postgres psql -U novanadeje_app -d novanadeje -tA -c "select setval('donation_receipt_number_seq', 41)"
          docker exec nfnn-postgres psql -U novanadeje_app -d novanadeje -c "insert into admin_action (id, admin_id, action, details, performed_at) values ('019a0000-0000-7000-8000-000000000004', '019a0000-0000-7000-8000-000000000002', 'CI_MARKER', 'kept by the failed restore', now())"
          echo "A backup taken before receipts moved to the browser is refused once this server has given out a receipt number, so the numbering never starts at 1 again below numbers already issued"
          switch_changeset="024-delete-test-receipts-and-drop-the-server-drawing"
          docker exec nfnn-postgres psql -U novanadeje_app -d novanadeje -v ON_ERROR_STOP=1 -c "create table ci_switch_row as select * from databasechangelog where id = '$switch_changeset'" -c "delete from databasechangelog where id = '$switch_changeset'"
          docker exec nfnn-backend sh -c 'touch /backups/requests/ci-pre-switch.backup'
          wait_for "grep -q '^request=ci-pre-switch$' $backups/status/backup" 60 "the backup without the switch changeset did not run"
          pre_switch_dump=$(sed -n 's/^file=//p' "$backups/status/backup")
          docker exec nfnn-postgres psql -U novanadeje_app -d novanadeje -v ON_ERROR_STOP=1 -c "insert into databasechangelog select * from ci_switch_row" -c "drop table ci_switch_row"
          [ "$(docker exec nfnn-postgres psql -U novanadeje_app -d novanadeje -tA -c "select is_called from donation_receipt_number_seq")" = t ] || { echo "::error::the probe needs a receipt number given out since the switch"; exit 1; }
          docker exec nfnn-backend sh -c "printf 'source=backup\nfile=%s\nadmin=019a0000-0000-7000-8000-000000000002\n' '$pre_switch_dump' > /backups/requests/ci-pre-switch.restore"
          docker restart nfnn-backend
          wait_for "grep -q '^request=ci-pre-switch$' $backups/status/restore" 60 "the restore of the backup from before the switch did not run"
          grep -q '^outcome=failed$' "$backups/status/restore" || { echo "::error::a backup from before the switch was restored although receipt numbers were given out since"; cat "$backups/status/restore"; exit 1; }
          grep -q 'taken before receipts moved to the browser' "$backups/status/restore" || { echo "::error::the refusal does not say why"; cat "$backups/status/restore"; exit 1; }
          docker compose up -d --wait --wait-timeout 300 backend
          [ "$(count_rows "action = 'CI_MARKER'")" = 1 ] || { echo "::error::the refused restore changed the data"; exit 1; }
          [ "$(docker exec nfnn-postgres psql -U novanadeje_app -d novanadeje -tA -c "select last_value from donation_receipt_number_seq")" = 41 ] || { echo "::error::the refused restore moved the receipt numbers"; exit 1; }
          [ "$(docker exec nfnn-postgres psql -U novanadeje_app -d novanadeje -tA -c "select count(*) from databasechangelog where id = '$switch_changeset'")" = 1 ] || { echo "::error::the switch changeset is no longer recorded"; exit 1; }

          echo "A key planted in the restore folder is not adopted, and a backup uploaded with its own key is restored and its key becomes the server's"
          secrets="$RUNNER_TEMP/nfnn/secrets"
          server_key() {
            sudo grep -m 1 '^AGE-SECRET-KEY-' "$secrets/backup-key"
          }
          first_key=$(server_key)
          planted_key=$(docker exec nfnn-backup age-keygen 2> /dev/null | grep '^AGE-SECRET-KEY-')
          printf '%s\n' "$planted_key" | docker exec -i -u app nfnn-backend sh -c 'cat > /restore/backup-key.adopt'
          docker restart nfnn-backend
          docker compose up -d --wait --wait-timeout 300 backend
          [ "$(server_key)" = "$first_key" ] || { echo "::error::the backend adopted a backup key the app user left in the restore folder"; exit 1; }
          docker logs nfnn-backend 2>&1 | grep -q 'is not the one the backup container recorded' || { echo "::error::the backend did not warn about the planted backup key"; exit 1; }
          uploaded_key=$(docker exec nfnn-backup age-keygen 2> /dev/null | grep '^AGE-SECRET-KEY-')
          uploaded_recipient=$(printf '%s\n' "$uploaded_key" | docker exec -i nfnn-backup age-keygen -y)
          docker exec nfnn-backup sh -c "age --decrypt --identity /secrets/backup-key '/backups/$(basename "$full_dump")' | age --recipient '$uploaded_recipient'" | docker exec -i -u app nfnn-backend sh -c 'cat > /restore/ci-5.upload'
          printf '%s\n' "$uploaded_key" | docker exec -i -u app nfnn-backend sh -c 'cat > /restore/ci-5.key'
          docker exec -u app nfnn-backend sh -c "printf 'source=upload\nfile=ci-5.upload\nadmin=\n' > /backups/requests/ci-5.restore"
          docker restart nfnn-backend
          wait_for "grep -q '^request=ci-5$' $backups/status/restore" 60 "the restore of the upload with its own key did not run"
          grep -q '^outcome=ok$' "$backups/status/restore" || { echo "::error::the restore of the upload with its own key failed"; cat "$backups/status/restore"; exit 1; }
          docker compose up -d --wait --wait-timeout 300 backend
          grep -qx "recipient=$uploaded_recipient" "$backups/status/adopted-key" || { echo "::error::the backup container did not record the adopted key"; exit 1; }
          [ "$(server_key)" = "$uploaded_key" ] || { echo "::error::the key uploaded with the backup did not become the server's backup key"; exit 1; }
          [ "$(sudo sh -c "grep -h -m 1 '^AGE-SECRET-KEY-' '$secrets'/backup-key.replaced-*")" = "$first_key" ] || { echo "::error::the replaced backup key was not kept"; exit 1; }
          [ -z "$(sudo find "$restore" -maxdepth 1 \( -name '*.key' -o -name '*.adopt' -o -name '*.upload' \))" ] || { echo "::error::the restore left the upload or a key in the restore folder"; exit 1; }
          [ -z "$(sudo find "$backups" \( -name '*.dump' -o -name work \))" ] || { echo "::error::a backup, a restore or a test restore left an unencrypted copy in the backups folder"; sudo find "$backups"; exit 1; }
          curl -fsS --max-time 10 http://localhost:8089/ | grep -q '<app-root'

      - name: A dump or site data that would run a program as the database's superuser runs as the application role instead, so the restore or test restore fails and changes nothing
        if: matrix.part == 'keys'
        run: |
          echo "Whatever a dump or the site's data runs during a restore or a test restore runs as novanadeje_app, which may not run programs on the database server (security audit 2026-11-06)"
          backups="$RUNNER_TEMP/nfnn/backups"
          restore="$RUNNER_TEMP/nfnn/restore"
          secrets="$RUNNER_TEMP/nfnn/secrets"
          wait_for() {
            for _ in $(seq "$2"); do
              if eval "$1"; then return 0; fi
              sleep 2
            done
            echo "::error::$3"
            return 1
          }
          as_app() {
            docker exec nfnn-postgres psql -U novanadeje_app -d novanadeje -v ON_ERROR_STOP=1 -tA "$@"
          }
          count_rows() {
            docker exec nfnn-postgres psql -U novanadeje_app -d novanadeje -tA -c "select count(*) from admin_action where $1"
          }
          nothing_ran() {
            if docker exec nfnn-postgres test -e /tmp/nfnn-pwned; then
              echo "::error::$1 ran a program on the database server with the superuser's rights"
              exit 1
            fi
          }
          refused_program() {
            sudo grep -q 'permission denied to COPY to or from an external program' "$backups/status/$1.err" || { echo "::error::$2 did not fail because the application role may not run a program"; sudo cat "$backups/status/$1.err"; exit 1; }
          }
          server_key() {
            sudo grep -m 1 '^AGE-SECRET-KEY-' "$secrets/backup-key"
          }
          payload="create function public.ci_trap() returns boolean language plpgsql as \$\$ begin if current_database() like 'nfnn_restore%' then copy (select 1) to program 'touch /tmp/nfnn-pwned'; end if; return true; end \$\$"
          wait_for "ls $backups/nfnn-*.dump.age > /dev/null 2>&1" 30 "the backup service wrote no encrypted dump"
          first_key=$(server_key)
          adopted_record=$(sudo cat "$backups/status/adopted-key" 2> /dev/null || true)
          docker exec nfnn-postgres psql -U novanadeje_app -d novanadeje -c "insert into admin_action (id, admin_id, action, details, performed_at) values ('019a0000-0000-7000-8000-000000000009', '019a0000-0000-7000-8000-000000000002', 'CI_HOSTILE', 'kept by every hostile restore', now())"

          echo "An upload whose dump checks its rows with a function that runs a program, brought with its own key, is refused and its key is not adopted"
          docker exec nfnn-postgres createdb -U novanadeje ci_hostile
          docker exec nfnn-postgres psql -U novanadeje -d ci_hostile -v ON_ERROR_STOP=1 -c "$payload" -c "create table public.ci_rows (id int check (public.ci_trap()))" -c "insert into public.ci_rows values (1)"
          hostile_key=$(docker exec nfnn-backup age-keygen 2> /dev/null | grep '^AGE-SECRET-KEY-')
          hostile_recipient=$(printf '%s\n' "$hostile_key" | docker exec -i nfnn-backup age-keygen -y)
          docker exec nfnn-postgres pg_dump -U novanadeje --format=custom ci_hostile | docker exec -i nfnn-backup age --recipient "$hostile_recipient" | docker exec -i -u app nfnn-backend sh -c 'cat > /restore/ci-hostile.upload'
          docker exec nfnn-postgres dropdb -U novanadeje ci_hostile
          printf '%s\n' "$hostile_key" | docker exec -i -u app nfnn-backend sh -c 'cat > /restore/ci-hostile.key'
          docker exec -u app nfnn-backend sh -c "printf 'source=upload\nfile=ci-hostile.upload\nadmin=\n' > /backups/requests/ci-hostile.restore"
          wait_for "grep -q '^request=ci-hostile$' $backups/status/restore" 60 "the restore of the hostile upload did not run"
          grep -q '^outcome=failed$' "$backups/status/restore" || { echo "::error::the hostile upload was restored"; cat "$backups/status/restore"; exit 1; }
          nothing_ran "the restore of the hostile upload"
          refused_program restore "the restore of the hostile upload"
          [ "$(sudo cat "$backups/status/adopted-key" 2> /dev/null || true)" = "$adopted_record" ] && [ ! -e "$restore/backup-key.adopt" ] || { echo "::error::the key brought with the hostile upload was offered for adoption"; exit 1; }
          [ -z "$(sudo find "$restore" -maxdepth 1 \( -name 'ci-hostile.*' \))" ] || { echo "::error::the hostile upload or its key was left in the restore folder"; exit 1; }

          echo "A check that runs a program, planted in the live data by the application role, makes the test restore of the next backup fail instead of running it"
          as_app -c "$payload" -c "alter table admin_action add constraint ci_trap check (public.ci_trap())"
          docker exec nfnn-backend sh -c 'touch /backups/requests/ci-trap-check.backup'
          wait_for "grep -q '^request=ci-trap-check$' $backups/status/backup" 60 "the backup with the planted check did not run"
          grep -q '^outcome=ok$' "$backups/status/backup" || { echo "::error::the backup with the planted check failed"; cat "$backups/status/backup"; exit 1; }
          as_app -c "alter table admin_action drop constraint ci_trap" -c "drop function public.ci_trap()"
          docker exec nfnn-backend sh -c 'touch /backups/requests/ci-trap-check.test-restore'
          wait_for "grep -q '^request=ci-trap-check$' $backups/status/test-restore" 60 "the test restore of the backup with the planted check did not run"
          grep -q '^outcome=failed$' "$backups/status/test-restore" || { echo "::error::the test restore of the backup with the planted check passed"; cat "$backups/status/test-restore"; exit 1; }
          nothing_ran "the test restore of the backup with the planted check"
          refused_program test-restore "the test restore of the backup with the planted check"

          echo "A trigger that runs a program, planted in the live data by the application role, makes the restore of a backup that holds it fail when the restore ends the backup's sessions"
          as_app -c "$payload" -c "create function public.ci_trap_trigger() returns trigger language plpgsql as \$\$ begin perform public.ci_trap(); return null; end \$\$" -c "create trigger ci_trap after update on donor_refresh_token for each statement execute function public.ci_trap_trigger()"
          docker exec nfnn-backend sh -c 'touch /backups/requests/ci-trap-trigger.backup'
          wait_for "grep -q '^request=ci-trap-trigger$' $backups/status/backup" 60 "the backup with the planted trigger did not run"
          trap_dump=$(sed -n 's/^file=//p' "$backups/status/backup")
          as_app -c "drop trigger ci_trap on donor_refresh_token" -c "drop function public.ci_trap_trigger()" -c "drop function public.ci_trap()"
          docker exec nfnn-postgres psql -U novanadeje_app -d novanadeje -c "insert into admin_action (id, admin_id, action, details, performed_at) values ('019a0000-0000-7000-8000-00000000000a', '019a0000-0000-7000-8000-000000000002', 'CI_HOSTILE', 'kept by the refused restore', now())"
          docker exec nfnn-backend sh -c "printf 'source=backup\nfile=%s\nadmin=019a0000-0000-7000-8000-000000000002\n' '$trap_dump' > /backups/requests/ci-trap-trigger.restore"
          wait_for "grep -q '^request=ci-trap-trigger$' $backups/status/restore" 60 "the restore of the backup with the planted trigger did not run"
          grep -q '^outcome=failed$' "$backups/status/restore" || { echo "::error::the backup with the planted trigger was restored"; cat "$backups/status/restore"; exit 1; }
          nothing_ran "the restore of the backup with the planted trigger"
          refused_program restore "the restore of the backup with the planted trigger"

          [ "$(count_rows "action = 'CI_HOSTILE'")" = 2 ] || { echo "::error::a refused hostile restore changed the live data"; exit 1; }
          [ "$(server_key)" = "$first_key" ] || { echo "::error::a hostile restore changed the server's backup key"; exit 1; }
          docker exec nfnn-postgres psql -U novanadeje -d postgres -tA -c "select datname from pg_database" | grep -qE 'nfnn_restore|ci_hostile' && { echo "::error::a staging, test or probe database was left behind"; exit 1; }
          if as_app -c "delete from admin_action where action = 'CI_HOSTILE'" > /dev/null 2>&1; then
            echo "::error::the administration history is append-only: the database must refuse to delete its rows outside a migration"
            exit 1
          fi
          docker exec nfnn-backend sh -c 'touch /backups/requests/ci-clean.backup && touch /backups/requests/ci-clean.test-restore'
          wait_for "grep -q '^request=ci-clean$' $backups/status/test-restore" 60 "the test restore after the hostile probes did not run"
          grep -q '^outcome=ok$' "$backups/status/test-restore" || { echo "::error::a backup without the planted objects does not restore in a test database"; cat "$backups/status/test-restore"; exit 1; }
          curl -fsS --max-time 10 http://localhost:8089/ | grep -q '<app-root'

      - name: An administrator with the second factor chooses who signs the receipts, with their receipt role, an SVG signature and a portrait, issues a receipt from the donor card, and the donor issues and reads theirs, active and then replaced after moving, while nfnn_status follows the signatory
        if: matrix.part == 'journeys'
        run: |
          echo "Mail goes to the probe's own mail catcher, the MAIL_HOST of the first setup, on the stack's network"
          docker run -d --name nfnn-probe-mail --network nfnn-edge -p 127.0.0.1:8025:8025 axllent/mailpit:v1.31.5 > /dev/null
          for _ in $(seq 30); do
            curl -fsS -o /dev/null --max-time 2 http://127.0.0.1:8025/api/v1/messages 2> /dev/null && break
            sleep 1
          done
          echo "The connector's nfnn_status reads the signatory through a real connection: the backend reads Claude Code's client metadata document from claude.ai"
          node scripts/stack-journey.mjs receipts --state "$RUNNER_TEMP/journey.json"
          if scripts/backend-log.sh "$RUNNER_TEMP/nfnn/logs" | grep -nE 'UnsatisfiedLinkError|A stored portrait cannot be decoded'; then
            echo "::error::the read-only backend could not decode the portrait it prints on the receipts"
            exit 1
          fi

      - name: An administrator signed in with the second factor uploads a JPEG and a WebP photo, which the read-only backend stores as WebP, and withdraws the server's receipt signing key, which the next start replaces
        if: matrix.part == 'journeys'
        run: |
          api=http://localhost:8089/api
          client='X-Forwarded-For: 203.0.113.30'
          admin=$(jq -r '.adminToken' "$RUNNER_TEMP/journey.json")
          echo "::add-mask::$admin"
          totp() {
            node scripts/stack-journey.mjs totp --state "$RUNNER_TEMP/journey.json"
          }
          ACCESS_TOKEN="$admin" python3 -c 'import base64, json, os, sys; payload = os.environ["ACCESS_TOKEN"].split(".")[1]; sys.exit("ADMIN" not in json.loads(base64.urlsafe_b64decode(payload + "=" * (-len(payload) % 4)))["roles"])' || { echo "::error::the session opened with the second factor does not carry ADMIN"; exit 1; }
          for photo in frontend/public/images/og-image.jpg:image/jpeg frontend/public/images/news-1.webp:image/webp; do
            file=${photo%%:*}
            uploaded=$(curl -sS -w '\n%{http_code}' --max-time 60 -H "$client" -H "Authorization: Bearer $admin" -F "file=@$file;type=${photo#*:}" "$api/admin/content/media")
            [ "$(echo "$uploaded" | tail -n 1)" = 201 ] || { echo "::error::uploading $file answered $(echo "$uploaded" | tail -n 1): $(echo "$uploaded" | head -n -1)"; exit 1; }
            url=$(echo "$uploaded" | head -n -1 | jq -r '.url')
            variant="$RUNNER_TEMP/variant.webp"
            type=$(curl -fsS -o "$variant" -w '%{content_type}' --max-time 10 "http://localhost:8089$url?w=480")
            [ "$type" = image/webp ] && [ "$(head -c 4 "$variant")" = RIFF ] && [ "$(dd if="$variant" bs=1 skip=8 count=4 2> /dev/null)" = WEBP ] || { echo "::error::the photo uploaded from $file is not served as WebP (got $type)"; exit 1; }
            echo "$file was stored and is served as WebP at $url"
          done
          if scripts/backend-log.sh "$RUNNER_TEMP/nfnn/logs" | grep -n 'UnsatisfiedLinkError'; then
            echo "::error::the backend could not load the WebP codec's native library"
            exit 1
          fi

          echo "Withdrawing the server's own receipt signing key with a fresh code tells the administrator, restarts the backend, keeps the seed aside, registers a new key and passes the withdrawn id to Java"
          secrets="$RUNNER_TEMP/nfnn/secrets"
          restore="$RUNNER_TEMP/nfnn/restore"
          withdrawn_seed=$(sudo cat "$secrets/receipt-signing-key" | tr -d '\n')
          withdrawn_key=$(curl -fsS --max-time 10 -H "$client" -H "Authorization: Bearer $admin" "$api/admin/donations/receipt-signing-keys" | jq -r '.currentKeyId')
          echo "$withdrawn_key" | grep -qxE '[0-9a-f]{8}' || { echo "::error::the administration names no current receipt signing key (got $withdrawn_key)"; exit 1; }
          restarts=$(docker inspect -f '{{.RestartCount}}' nfnn-backend)
          withdrawal=$(curl -sS -w '\n%{http_code}' --max-time 30 -H "$client" -H "Authorization: Bearer $admin" -H 'Content-Type: application/json' --data "{\"secondFactorCode\":\"$(totp)\"}" "$api/admin/donations/receipt-signing-keys/$withdrawn_key/withdrawal")
          [ "$(echo "$withdrawal" | tail -n 1)" = 200 ] || { echo "::error::withdrawing the receipt signing key $withdrawn_key answered $(echo "$withdrawal" | tail -n 1): $(echo "$withdrawal" | head -n -1)"; exit 1; }
          [ "$(echo "$withdrawal" | head -n -1 | jq -r '.restarting')" = true ] || { echo "::error::withdrawing the server's own key must restart the backend"; exit 1; }
          notice=
          for _ in $(seq 60); do
            notice=$(curl -fsS --max-time 5 'http://127.0.0.1:8025/api/v1/search?query=to%3Aspravce%40example.cz%20subject%3A%22Kl%C3%AD%C4%8D%20k%20ov%C4%9B%C5%99ovac%C3%ADm%22' | jq -r '.messages_count')
            [ "$notice" = 1 ] && break
            sleep 1
          done
          [ "$notice" = 1 ] || { echo "::error::the administrator got no notice of the withdrawn receipt signing key"; exit 1; }
          for _ in $(seq 120); do
            [ "$(docker inspect -f '{{.RestartCount}}' nfnn-backend)" -gt "$restarts" ] && break
            sleep 1
          done
          [ "$(docker inspect -f '{{.RestartCount}}' nfnn-backend)" -gt "$restarts" ] || { echo "::error::the backend did not restart after the withdrawal of its own receipt signing key"; exit 1; }
          docker compose up -d --wait --wait-timeout 300 backend
          [ ! -e "$restore/receipt-signing-key.renew" ] || { echo "::error::the request for a new receipt signing seed was left in the restore folder"; exit 1; }
          [ "$(sudo stat -c '%a %U' "$secrets/receipt-signing-key.withdrawn-$withdrawn_key")" = '600 root' ] || { echo "::error::the withdrawn seed must be kept as secrets/receipt-signing-key.withdrawn-$withdrawn_key, owned by root with mode 600"; sudo ls -la "$secrets"; exit 1; }
          [ "$(sudo cat "$secrets/receipt-signing-key.withdrawn-$withdrawn_key" | tr -d '\n')" = "$withdrawn_seed" ] || { echo "::error::the kept withdrawn seed is not the seed the server signed with"; exit 1; }
          [ "$(sudo stat -c '%a %U' "$secrets/receipt-signing-key")" = '600 root' ] || { echo "::error::secrets/receipt-signing-key must be generated again, owned by root with mode 600"; exit 1; }
          renewed_seed=$(sudo cat "$secrets/receipt-signing-key" | tr -d '\n')
          [ "$renewed_seed" != "$withdrawn_seed" ] || { echo "::error::the receipt signing seed was not replaced after the withdrawal"; exit 1; }
          [ "$(echo "$renewed_seed" | base64 -d | wc -c)" = 32 ] || { echo "::error::the new receipt signing seed must be a 32-byte Ed25519 seed in base64"; exit 1; }
          docker logs nfnn-backend 2>&1 | grep -q "the receipt signing key $withdrawn_key was withdrawn in the administration" || { echo "::error::the entrypoint did not say that it replaced the withdrawn seed"; exit 1; }
          renewed_key=$(scripts/backend-log.sh "$RUNNER_TEMP/nfnn/logs" | grep -oE 'Receipt signing key [0-9a-f]{8} registered and published' | tail -n 1 | cut -d' ' -f4)
          [ -n "$renewed_key" ] && [ "$renewed_key" != "$withdrawn_key" ] || { echo "::error::the backend did not register a new receipt signing key after the seed was replaced"; exit 1; }
          docker exec --privileged nfnn-backend sh -c 'tr "\0" "\n" < /proc/1/environ' | grep -qxE "RECEIPT_SIGNING_KEYS_WITHDRAWN=([0-9a-f]{8},)*$withdrawn_key(,[0-9a-f]{8})*" || { echo "::error::the entrypoint did not pass the withdrawn key $withdrawn_key to Java as RECEIPT_SIGNING_KEYS_WITHDRAWN"; exit 1; }
          listed=$(curl -fsS --max-time 10 http://localhost:8089/api/donations/receipt-keys | jq -r '.keys[] | .keyId + " " + .status' | sort)
          [ "$listed" = "$(printf '%s\n%s\n' "$withdrawn_key revoked" "$renewed_key active" | sort)" ] || { echo "::error::the receipt keys must list $withdrawn_key as revoked and $renewed_key as active (got $listed)"; exit 1; }
          seed_spellings="$RUNNER_TEMP/receipt-seed-spellings"
          for seed in "$withdrawn_seed" "$renewed_seed"; do
            echo "$seed"; echo "${seed%%=*}"; echo "${seed%%=*}" | tr '+/' '-_'; echo "$seed" | base64 -d | od -An -tx1 | tr -d ' \n'; echo
          done > "$seed_spellings"
          if scripts/backend-log.sh "$RUNNER_TEMP/nfnn/logs" | grep -iF -f "$seed_spellings" > /dev/null || docker logs nfnn-backend 2>&1 | grep -qiF -f "$seed_spellings"; then
            echo "::error::neither the withdrawn nor the new receipt signing seed may reach backend.log or the container log (Base64, unpadded, Base64url or hex)"
            exit 1
          fi
          rm -f "$seed_spellings"

      - name: Hashed bundles are cached for good and a missing file answers 404, never the app
        if: matrix.part == 'journeys'
        run: |
          docker cp nfnn-frontend:/usr/share/nginx/html "$RUNNER_TEMP/frontend-html"
          node frontend/scripts/probe-asset-caching.mjs http://localhost:8089 "$RUNNER_TEMP/frontend-html" frontend/nginx.conf

      - name: The image's worker carries the payment route, and the operator's flag in the logs folder turns the service worker off and back on
        if: matrix.part == 'journeys'
        run: |
          route=frontend/service-worker/payment-route.js
          cmp -s -n "$(wc -c < "$route")" "$route" "$RUNNER_TEMP/frontend-html/ngsw-worker.js" || { echo "::error::the image's ngsw-worker.js must begin with the payment route of $route (npm run build prepends it)"; exit 1; }
          flag="$RUNNER_TEMP/nfnn/logs/service-worker.off"
          safety=$(sha256sum < "$RUNNER_TEMP/frontend-html/safety-worker.js")
          worker=$(sha256sum < "$RUNNER_TEMP/frontend-html/ngsw-worker.js")
          sudo touch "$flag"
          headers=$(curl -sS --max-time 10 -o /dev/null -D - http://localhost:8089/ngsw.json | tr -d '\r')
          echo "$headers" | head -n 1 | grep -q ' 404' || { echo "::error::with the flag set /ngsw.json must answer 404, so every worker removes itself"; echo "$headers"; exit 1; }
          echo "$headers" | grep -qix 'cloudflare-cdn-cache-control: no-store' || { echo "::error::the 404 of /ngsw.json must not be kept by Cloudflare"; echo "$headers"; exit 1; }
          type=$(curl -fsS --max-time 10 -o "$RUNNER_TEMP/served-worker.js" -w '%{content_type}' http://localhost:8089/ngsw-worker.js)
          echo "$type" | grep -qE '^(text|application)/javascript' || { echo "::error::with the flag set /ngsw-worker.js must still be a script (got $type)"; exit 1; }
          [ "$(sha256sum < "$RUNNER_TEMP/served-worker.js")" = "$safety" ] || { echo "::error::with the flag set /ngsw-worker.js must serve safety-worker.js"; exit 1; }
          sudo rm "$flag"
          [ "$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' http://localhost:8089/ngsw.json)" = 200 ] || { echo "::error::without the flag /ngsw.json must answer 200 again"; exit 1; }
          curl -fsS --max-time 10 -o "$RUNNER_TEMP/served-worker.js" http://localhost:8089/ngsw-worker.js
          [ "$(sha256sum < "$RUNNER_TEMP/served-worker.js")" = "$worker" ] || { echo "::error::without the flag /ngsw-worker.js must serve the app's worker again"; exit 1; }

      - name: API, connector and discovery answers stay out of the browser's and Cloudflare's caches
        if: matrix.part == 'journeys'
        run: |
          echo "A donor of the stack signs in, so the probe can show that the cacheable answers are the same for a signed-in donor"
          probe_donor='{"type":"PERSON","name":"Sonda Mezipaměti","address":{"street":"Zkušební 1","city":"Tišnov","postalCode":"666 01"},"email":"sonda-mezipameti@example.cz","password":"a probe of the stack only","preferredLocale":"cs"}'
          curl -fsS --max-time 30 -o /dev/null -H 'X-Forwarded-For: 203.0.113.41' -H 'Content-Type: application/json' --data "$probe_donor" http://localhost:8089/api/donors/auth/register || { echo "::error::the probe donor's registration was refused"; exit 1; }
          docker exec nfnn-postgres psql -U novanadeje_app -d novanadeje -c "update donor set email_verified_at = now() where email = 'sonda-mezipameti@example.cz'" | grep -qx 'UPDATE 1' || { echo "::error::the probe donor was not registered"; exit 1; }
          token=$(curl -fsS --max-time 30 -H 'X-Forwarded-For: 203.0.113.41' -H 'Content-Type: application/json' --data '{"email":"sonda-mezipameti@example.cz","password":"a probe of the stack only"}' http://localhost:8089/api/donors/auth/login | jq -r '.accessToken')
          [ -n "$token" ] && [ "$token" != null ] || { echo "::error::the probe donor could not sign in"; exit 1; }
          echo "::add-mask::$token"
          PROBE_ACCESS_TOKEN="$token" node frontend/scripts/probe-edge-caching.mjs http://localhost:8089

      - name: Logs
        if: failure()
        run: |
          docker compose logs --no-color --tail 200
          for container in nfnn-postgres nfnn-backup nfnn-backend nfnn-mcp nfnn-frontend; do
            echo "$container: $(docker inspect -f '{{.State.Status}}, restarts {{.RestartCount}}, health {{json .State.Health}}' "$container" 2>&1)"
          done

      - name: Stop
        if: always()
        run: |
          docker rm -f nfnn-probe-mail > /dev/null 2>&1 || true
          docker compose down

  release:
    name: Zkouška vydání
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/release-rehearsal.yml

  gate:
    if: always()
    needs: [changes, agent-context, backend, acceptance, frontend, e2e, e2e-report, pwa, visual, mcp, main-recording, compare-v2, stack, release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed, or the change touches no code and only the agent context ran
        env:
          CODE: ${{ needs.changes.outputs.code }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          if [ "$CODE" = true ]; then expected=success; else expected=skipped; fi
          if ! jq -e --arg expected "$expected" '.changes.result == "success" and .["agent-context"].result == "success" and ([del(.changes, .["agent-context"])[] | .result] | all(. == $expected))' <<<"$NEEDS" > /dev/null; then
            echo "::error::the agent context and every other job must pass on a change to code (and only the agent context run on a change to docs/, .claude/ or Markdown only); see the results above"
            exit 1
          fi
