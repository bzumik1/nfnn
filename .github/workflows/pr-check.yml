name: PR check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "**"
      - "!docs/**"
      - "!.claude/**"
      - "!**/*.md"

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - name: Find whether the change touches code or only docs/, .claude/ and Markdown
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PULL_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PULL_NUMBER" ]; then
            echo "A push to main runs every job."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api "repos/$REPOSITORY/pulls/$PULL_NUMBER/files" --paginate --jq '.[].filename')
          if grep -Ev '^(docs/|\.claude/)|\.md$' <<<"$files" | grep -q .; then
            echo "The pull request changes code, so every job runs."
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "The pull request changes only docs/, .claude/ or Markdown, so no job runs and the gate passes."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  backend:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'push' && 35 || 25 }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6

      - name: Build and test, recording the API transcripts
        run: ./gradlew build
        env:
          API_TRANSCRIPTS: record

      - name: Keep test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: backend/build/reports/
          retention-days: 14

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: List the backend's tests for the test inventory
        run: node ../scripts/test-inventory.mjs --part=backend --out="$GITHUB_WORKSPACE/backend/build/backend-inventory.json"

      - name: Keep the transcripts and the test list for the v2 comparison
        uses: actions/upload-artifact@v7
        with:
          name: backend-recording
          path: |
            backend/build/api-transcripts/
            backend/build/backend-inventory.json
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && 90 || 3 }}

      - name: Record main a second time and compare the two recordings
        if: github.event_name == 'push'
        run: |
          cp -R build/api-transcripts "$RUNNER_TEMP/first-recording"
          ./gradlew acceptanceTest --rerun
          node ../scripts/compare-recordings.mjs "$RUNNER_TEMP/first-recording" build/api-transcripts
        env:
          API_TRANSCRIPTS: record

  frontend:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Start installing Playwright's Chromium headless shell while the checks run
        run: |
          (npx playwright install --with-deps --only-shell chromium > "$RUNNER_TEMP/playwright-install.log" 2>&1; echo $? > "$RUNNER_TEMP/playwright-install.status") &

      - name: Formatting follows Prettier
        run: npm run format:check

      - name: Code follows the lint rules
        run: npm run lint

      - name: Styles use the theme's tokens
        run: npm run lint:styles

      - name: Unit tests
        run: |
          mkdir -p "$RUNNER_TEMP/inventory"
          npx ng test --watch=false --reporters=default --reporters=json --output-file="$RUNNER_TEMP/inventory/frontend-vitest.json"

      - name: Build
        run: npm run build

      - name: Only the receipt worker carries the PDF library
        run: node scripts/check-receipt-chunks.mjs dist/frontend/browser

      - name: Playwright's Chromium headless shell is installed
        run: |
          for _ in $(seq 300); do
            [ -s "$RUNNER_TEMP/playwright-install.status" ] && break
            sleep 1
          done
          cat "$RUNNER_TEMP/playwright-install.log"
          [ "$(cat "$RUNNER_TEMP/playwright-install.status" 2>/dev/null)" = 0 ] || { echo "::error::Playwright's Chromium headless shell was not installed (log above)"; exit 1; }

      - name: End-to-end and accessibility tests
        run: npm run e2e
        env:
          E2E_DIST: dist/frontend/browser

      - name: List the end-to-end tests for the test inventory
        run: npx playwright test --list --reporter=json > "$RUNNER_TEMP/inventory/frontend-playwright.json"

      - name: Keep the test lists for the v2 comparison
        uses: actions/upload-artifact@v7
        with:
          name: frontend-inventory
          path: ${{ runner.temp }}/inventory/
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && 90 || 3 }}

      - name: Build with the control theme
        run: npx ng build --configuration=production,control-theme --output-path=dist/control-theme

      - name: The control theme restyles every page
        run: npx playwright test e2e/theme.spec.ts
        env:
          E2E_THEME: control
          E2E_DIST: dist/control-theme/browser

  mcp:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - run: npm ci

      - name: Formatting, types and tests
        run: npm run check

      - name: List the tests for the test inventory
        run: npx vitest run --reporter=json --outputFile="$RUNNER_TEMP/inventory/mcp-vitest.json"

      - name: Keep the test list for the v2 comparison
        uses: actions/upload-artifact@v7
        with:
          name: mcp-inventory
          path: ${{ runner.temp }}/inventory/
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && 90 || 3 }}

  main-recording:
    name: Nahrávka main
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      commit: ${{ steps.find.outputs.commit }}
      missing: ${{ steps.find.outputs.missing }}
    steps:
      - name: Find the newest successful push run on main at or before the base that keeps its recording
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          keeps() {
            [ "$(gh api "repos/$REPOSITORY/actions/runs/$1/artifacts?per_page=100" --jq '[.artifacts[] | select(.expired == false) | .name | select(. == "backend-recording" or . == "frontend-inventory" or . == "mcp-inventory")] | unique | length')" = 3 ]
          }
          base=$(gh api "repos/$REPOSITORY/commits/$HEAD_SHA" --jq '.parents[0].sha')
          runs=$(gh api "repos/$REPOSITORY/actions/workflows/pr-check.yml/runs?branch=main&event=push&status=success&per_page=100" --jq '.workflow_runs[] | "\(.head_sha) \(.id)"')
          for commit in $(gh api "repos/$REPOSITORY/commits?sha=$base&per_page=50" --jq '.[].sha'); do
            for run in $(awk -v commit="$commit" '$1 == commit { print $2 }' <<<"$runs"); do
              if keeps "$run"; then
                echo "The recording of main at $commit (run $run) is the comparison base for $base."
                { echo "commit=$commit"; echo "run=$run"; } >> "$GITHUB_OUTPUT"
                exit 0
              fi
            done
          done
          for run in $(awk '{ print $2 }' <<<"$runs"); do
            if keeps "$run"; then
              echo "::error::No successful push run of the last 50 commits on main up to ${base:0:12} keeps its recording and test lists, although run $run does. Re-run the PR check of the newest commit on main (Actions, PR check, the push run, Re-run all jobs), then re-run this check (testing.md, \"Regression against v2\")."
              exit 1
            fi
          done
          missing="no successful push run on main keeps a backend-recording, frontend-inventory and mcp-inventory artifact yet (before the first push run that keeps them)"
          echo "::warning::$missing; the comparison falls back to v2 only"
          echo "missing=$missing" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        if: steps.find.outputs.run != ''
        with:
          name: backend-recording
          run-id: ${{ steps.find.outputs.run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/main-recording

      - uses: actions/download-artifact@v8
        if: steps.find.outputs.run != ''
        with:
          name: frontend-inventory
          run-id: ${{ steps.find.outputs.run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/main-recording

      - uses: actions/download-artifact@v8
        if: steps.find.outputs.run != ''
        with:
          name: mcp-inventory
          run-id: ${{ steps.find.outputs.run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/main-recording

      - name: Keep the recording and test lists of main for the comparison
        if: steps.find.outputs.run != ''
        uses: actions/upload-artifact@v7
        with:
          name: main-recording
          path: ${{ runner.temp }}/main-recording/
          if-no-files-found: error
          retention-days: 1

  compare-v2:
    name: Srovnání s v2
    needs: [backend, frontend, mcp, main-recording]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: List the files the pull request changes, with their git status
        run: git diff --name-status --no-renames HEAD^1 HEAD > "$RUNNER_TEMP/changed-files.txt"

      - uses: actions/download-artifact@v8
        if: needs.main-recording.outputs.commit != ''
        with:
          name: main-recording
          path: ${{ runner.temp }}/main-recording

      - name: List the files changed since the recorded main commit
        if: needs.main-recording.outputs.commit != ''
        env:
          MAIN_COMMIT: ${{ needs.main-recording.outputs.commit }}
        run: |
          git fetch --quiet --depth=1 origin "$MAIN_COMMIT"
          git diff --name-status --no-renames "$MAIN_COMMIT" HEAD > "$RUNNER_TEMP/changed-since-main.txt"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - name: The pull request leaves the v2 baseline as its commit recorded it
        run: node scripts/compare-v2-baseline.mjs --base=HEAD^1

      - uses: actions/download-artifact@v8
        with:
          name: backend-recording
          path: backend/build

      - uses: actions/download-artifact@v8
        with:
          name: frontend-inventory
          path: ${{ runner.temp }}/inventory

      - uses: actions/download-artifact@v8
        with:
          name: mcp-inventory
          path: ${{ runner.temp }}/inventory

      - name: The comparison and inventory scripts work on their fixtures
        run: node --test scripts/*.test.mjs

      - name: Collect the test inventory
        run: >-
          node scripts/test-inventory.mjs
          --backend=backend/build/backend-inventory.json
          --frontendVitest="$RUNNER_TEMP/inventory/frontend-vitest.json"
          --playwright="$RUNNER_TEMP/inventory/frontend-playwright.json"
          --mcpVitest="$RUNNER_TEMP/inventory/mcp-vitest.json"
          --out="$RUNNER_TEMP/test-inventory.json"

      - name: The connector's backend calls have the recorded shapes
        working-directory: mcp
        run: |
          npm ci
          npx vitest run test/backend-shapes.spec.ts
        env:
          API_TRANSCRIPTS_DIR: ${{ github.workspace }}/backend/build/api-transcripts

      - name: Collect the test inventory of main
        if: needs.main-recording.outputs.commit != ''
        run: >-
          node scripts/test-inventory.mjs
          --backend="$RUNNER_TEMP/main-recording/backend-inventory.json"
          --frontendVitest="$RUNNER_TEMP/main-recording/frontend-vitest.json"
          --playwright="$RUNNER_TEMP/main-recording/frontend-playwright.json"
          --mcpVitest="$RUNNER_TEMP/main-recording/mcp-vitest.json"
          --out="$RUNNER_TEMP/main-inventory.json"

      - name: Transcripts and tests compared with v2 and with the recording of main
        env:
          MAIN_COMMIT: ${{ needs.main-recording.outputs.commit }}
          MAIN_MISSING: ${{ needs.main-recording.outputs.missing }}
        run: |
          if [ -n "$MAIN_COMMIT" ]; then
            main=(--main="$RUNNER_TEMP/main-recording/api-transcripts" --main-commit="$MAIN_COMMIT" --main-changed="$RUNNER_TEMP/changed-since-main.txt" --main-inventory="$RUNNER_TEMP/main-inventory.json")
          else
            main=(--main-missing="${MAIN_MISSING:-the job main-recording named no recording of main}")
          fi
          node scripts/compare-v2.mjs --inventory="$RUNNER_TEMP/test-inventory.json" --changed="$RUNNER_TEMP/changed-files.txt" "${main[@]}" --report="$RUNNER_TEMP/srovnani-s-v2.md" > /dev/null
          status=$?
          cat "$RUNNER_TEMP/srovnani-s-v2.md" >> "$GITHUB_STEP_SUMMARY"
          exit $status
        shell: bash {0}

      - name: Keep the comparison report for the PR body
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: srovnani-s-v2
          path: ${{ runner.temp }}/srovnani-s-v2.md
          if-no-files-found: ignore
          retention-days: 14

  stack:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Compose file has no dollar signs
        run: |
          if grep -n '\$' deploy/compose.yml; then
            echo "::error::ZimaOS stores the compose file without its \$\$ escapes, so every \$ becomes an empty variable"
            exit 1
          fi

      - name: Compose file names no secret
        run: |
          if grep -noE '\b(POSTGRES_PASSWORD|PGPASSWORD|DB_PASSWORD|JWT_SECRET|SETTINGS_KEY|BACKUP_KEY|RECEIPT_SIGNING_KEY|MAIL_PASSWORD|FIO_TOKEN)\b' deploy/compose.yml; then
            echo "::error::Secrets are generated into secrets/ or entered in the first setup, never written into deploy/compose.yml"
            exit 1
          fi

      - name: Only the frontend publishes a port, nothing reads an env file and the secrets folder reaches only its services
        run: |
          if [ "$(yq '[.services[] | select(has("ports"))] | length' deploy/compose.yml)" != 1 ] || [ "$(yq '.services.frontend | has("ports")' deploy/compose.yml)" != true ]; then
            echo "::error::only the frontend publishes a port"
            exit 1
          fi
          if [ "$(yq '[.services[] | select(has("env_file"))] | length' deploy/compose.yml)" != 0 ]; then
            echo "::error::no service reads an env file: secrets are generated into secrets/ and settings come from the first setup"
            exit 1
          fi
          secrets_mounts=$(yq -o=json '[.services | to_entries[] | select(.value.volumes[]? | test("^/DATA/AppData/nfnn/secrets:")) | .key + "=" + (.value.volumes[] | select(test("^/DATA/AppData/nfnn/secrets:")))] | sort | join(" ")' deploy/compose.yml)
          if [ "$secrets_mounts" != '"backend=/DATA/AppData/nfnn/secrets:/secrets backup=/DATA/AppData/nfnn/secrets:/secrets:ro postgres=/DATA/AppData/nfnn/secrets:/secrets"' ]; then
            echo "::error::the secrets folder goes to postgres and the backend, read-only to the backup, and to nothing else (found $secrets_mounts)"
            exit 1
          fi
          if [ "$(yq '.services.mcp.volumes | length' deploy/compose.yml)" != 1 ] || [ "$(yq '.services.mcp.volumes[0]' deploy/compose.yml)" != /DATA/AppData/nfnn/logs:/logs ] || [ "$(yq '.services.mcp | has("env_file")' deploy/compose.yml)" != false ]; then
            echo "::error::the MCP connector mounts only the logs folder (for its own log file) and reads no env file (it holds no secret)"
            exit 1
          fi
          if [ "$(yq '.services.frontend.volumes | length' deploy/compose.yml)" != 1 ] || [ "$(yq '.services.frontend.volumes[0]' deploy/compose.yml)" != /DATA/AppData/nfnn/logs:/logs ] || [ "$(yq '.services.frontend | has("env_file")' deploy/compose.yml)" != false ]; then
            echo "::error::the frontend mounts only the logs folder (for its access log) and reads no env file"
            exit 1
          fi
          if [ "$(yq '[.services[] | select(has("network_mode") or has("links"))] | length' deploy/compose.yml)" != 0 ] || [ "$(yq '.networks | keys | join(",")' deploy/compose.yml)" != edge ] || [ "$(yq '.networks.edge.name' deploy/compose.yml)" != nfnn-edge ]; then
            echo "::error::the services live on their own network nfnn-edge, not the default bridge that other apps on the server share"
            exit 1
          fi
          networks=$(yq -o=json '[.services | to_entries[] | .key + "=" + ((.value.networks // []) | join(","))] | sort | join(" ")' deploy/compose.yml)
          if [ "$networks" != '"backend=edge backup=edge frontend=edge mcp=edge postgres=edge"' ]; then
            echo "::error::every service joins exactly the one network edge: ZimaOS attaches a service only to the first network it lists (found $networks)"
            exit 1
          fi
          if [ "$(yq '[.services[] | select((.security_opt // []) | contains(["no-new-privileges:true"]) | not)] | length' deploy/compose.yml)" != 0 ]; then
            echo "::error::every service sets no-new-privileges"
            exit 1
          fi
          if [ "$(yq '[.services[] | select(.read_only != true or ((.cap_drop // []) | join(",")) != "ALL")] | length' deploy/compose.yml)" != 0 ]; then
            echo "::error::every service runs on a read-only file system (tmpfs where it writes) and drops every capability, adding back only those its entrypoint needs"
            exit 1
          fi
          caps=$(yq -o=json '[.services | to_entries[] | .key + "=" + ((.value.cap_add // []) | sort | join(","))] | sort | join(" ")' deploy/compose.yml)
          if [ "$caps" != '"backend=CHOWN,SETGID,SETUID backup=DAC_OVERRIDE,FOWNER frontend=CHOWN,DAC_OVERRIDE,NET_BIND_SERVICE,SETGID,SETUID mcp=CHOWN,DAC_OVERRIDE,FOWNER,SETGID,SETUID postgres=CHOWN,DAC_OVERRIDE,FOWNER,SETGID,SETUID"' ]; then
            echo "::error::a service adds back a capability nobody reviewed (found $caps)"
            exit 1
          fi
          if [ "$(yq '.services.backend.environment.DB_USERNAME' deploy/compose.yml)" != novanadeje_app ]; then
            echo "::error::the backend logs in to the database as the application role novanadeje_app, never as the superuser"
            exit 1
          fi
          if [ "$(yq '.services.backend.environment.SPRING_PROFILES_ACTIVE' deploy/compose.yml)" != prod ]; then
            echo "::error::the backend runs with exactly the prod profile: without one it would start as dev, which accepts the public development keys and reads no stored settings"
            exit 1
          fi

      - name: The backend gets the time its shutdown waits for before Docker kills it
        run: |
          for compose in deploy/compose.yml docker-compose.yml; do
            if [ "$(yq '.services.backend.stop_grace_period' "$compose")" != 75s ]; then
              echo "::error::$compose must give the backend stop_grace_period 75s: Spring drains requests for up to 30 s and then awaits a running bank import for up to 30 s (spring.task.scheduling.shutdown), and Docker kills after 10 s by default"
              exit 1
            fi
          done

      - name: Both images rotate their log with the same script
        run: |
          if ! cmp frontend/rotate-log.sh mcp/rotate-log.sh; then
            echo "::error::frontend/rotate-log.sh and mcp/rotate-log.sh are one script copied into two build contexts; change both"
            exit 1
          fi

      - name: The database and the backup hand the database to the application role with the same script
        run: |
          if ! cmp deploy/postgres/own-by-app-role.sql deploy/backup/own-by-app-role.sql; then
            echo "::error::deploy/postgres/own-by-app-role.sql and deploy/backup/own-by-app-role.sql are one script copied into two build contexts; change both"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - uses: docker/setup-buildx-action@v4

      - name: Build images
        uses: docker/bake-action@v7
        env:
          CACHE_FROM_GHA: "true"
          CACHE_TO_GHA: ${{ github.event_name == 'push' }}
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          source: .
          files: .github/docker-bake.hcl
          load: true

      - name: Prepare the compose file
        run: |
          mkdir -p "$RUNNER_TEMP/nfnn"
          install -d -m 755 "$RUNNER_TEMP/nfnn/logs"
          for log in nginx-access.log mcp.log; do
            echo "2026-01-01T00:00:00+00:00 left over from an earlier day" > "$RUNNER_TEMP/nfnn/logs/$log"
            chmod 644 "$RUNNER_TEMP/nfnn/logs/$log"
            touch -d '2 days ago' "$RUNNER_TEMP/nfnn/logs/$log"
          done
          sed "s#/DATA/AppData/nfnn#$RUNNER_TEMP/nfnn#g" deploy/compose.yml > "$RUNNER_TEMP/compose.yml"
          yq -i '.services.backup.environment.POLL_SECONDS = "1"' "$RUNNER_TEMP/compose.yml"
          echo "COMPOSE_FILE=$RUNNER_TEMP/compose.yml" >> "$GITHUB_ENV"

      - name: Start the production stack
        run: |
          docker compose up -d --wait --wait-timeout 300
          for container in nfnn-postgres nfnn-backup nfnn-backend nfnn-mcp nfnn-frontend; do
            restarts=$(docker inspect -f '{{.RestartCount}}' "$container")
            [ "$restarts" = 0 ] || { echo "::error::$container restarted $restarts times while a fresh install started: the backend waits until the database accepts connections, so nothing restarts"; exit 1; }
          done

      - name: First setup
        run: |
          secrets="$RUNNER_TEMP/nfnn/secrets"
          for file in db-password db-app-password jwt-secret settings-key receipt-signing-key backup-key; do
            [ "$(sudo stat -c '%a %U' "$secrets/$file")" = '600 root' ] || { echo "::error::secrets/$file must exist, owned by root with mode 600"; sudo ls -la "$secrets"; exit 1; }
          done
          [ "$(sudo cat "$secrets/receipt-signing-key" | base64 -d | wc -c)" = 32 ] || { echo "::error::secrets/receipt-signing-key must hold a 32-byte Ed25519 seed in base64"; exit 1; }
          grep -qE 'Receipt signing key [0-9a-f]{8} registered and published' "$RUNNER_TEMP/nfnn/logs/backend.log" || { echo "::error::the backend did not register its receipt signing key at its first start"; exit 1; }
          seed=$(sudo cat "$secrets/receipt-signing-key" | tr -d '\n')
          seed_spellings="$RUNNER_TEMP/receipt-seed-spellings"
          { echo "$seed"; echo "${seed%%=*}"; echo "${seed%%=*}" | tr '+/' '-_'; echo "$seed" | base64 -d | od -An -tx1 | tr -d ' \n'; } > "$seed_spellings"
          if grep -qiF -f "$seed_spellings" "$RUNNER_TEMP/nfnn/logs/backend.log"; then
            echo "::error::the receipt signing seed must never reach backend.log (Base64, unpadded, Base64url or hex)"
            exit 1
          fi
          rm -f "$seed_spellings"
          status=$(curl -fsS --max-time 10 http://localhost:8089/api/operations/setup)
          [ "$status" = '{"required":true,"codeRequired":false,"lastRestore":null}' ] || { echo "::error::a fresh install opened directly must ask for the setup without a code (got $status)"; exit 1; }
          proxied=$(curl -fsS --max-time 10 -H 'X-Forwarded-For: 203.0.113.7' http://localhost:8089/api/operations/setup)
          [ "$proxied" = '{"required":true,"codeRequired":true,"lastRestore":null}' ] || { echo "::error::a request through a proxy must need the code (got $proxied)"; exit 1; }
          wrong=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 -H 'X-Forwarded-For: 203.0.113.7' -H 'Content-Type: application/json' --data '{"code":"AAAA-BBBB-CCCC"}' http://localhost:8089/api/operations/setup/unlock)
          [ "$wrong" = 403 ] || { echo "::error::a wrong code must answer 403 (got $wrong)"; exit 1; }
          code=$(docker logs nfnn-backend 2>&1 | grep -oE '^ +[2-9A-Z]{4}-[2-9A-Z]{4}-[2-9A-Z]{4} *$' | tail -n 1 | tr -d ' ')
          [ -n "$code" ] || { echo "::error::the backend printed no setup code into the container log"; exit 1; }
          if grep -q -- "$code" "$RUNNER_TEMP/nfnn/logs/backend.log"; then
            echo "::error::the setup code must not reach backend.log, which administrators and the connector read"
            exit 1
          fi
          right=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 -H 'X-Forwarded-For: 203.0.113.7' -H 'Content-Type: application/json' --data "{\"code\":\"$code\"}" http://localhost:8089/api/operations/setup/unlock)
          [ "$right" = 204 ] || { echo "::error::the code from the log must unlock the setup (got $right)"; exit 1; }
          sudo grep -qE '^AGE-SECRET-KEY-1[0-9A-Z]{58}$' "$secrets/backup-key" || { echo "::error::secrets/backup-key must hold one age identity"; exit 1; }
          key_headers=$(curl -sS -D - -o "$RUNNER_TEMP/backup-key.json" --max-time 10 -H 'X-Forwarded-For: 203.0.113.7' -H "X-Nfnn-Setup-Code: $code" http://localhost:8089/api/operations/setup/backup-key)
          echo "$key_headers" | grep -qi '^Cache-Control: private, no-store' || { echo "::error::the backup key must not be cached"; echo "$key_headers"; exit 1; }
          backup_key=$(jq -r '.key' "$RUNNER_TEMP/backup-key.json")
          [ "$backup_key" = "$(sudo grep -m 1 '^AGE-SECRET-KEY-' "$secrets/backup-key")" ] || { echo "::error::the setup must show the generated backup key"; exit 1; }
          echo "::add-mask::$backup_key"
          [ "$(jq -c '.checkPositions | length' "$RUNNER_TEMP/backup-key.json")" = 3 ] || { echo "::error::the setup must ask for three words of the backup key"; exit 1; }
          key_words=$(BACKUP_KEY_TEXT="$backup_key" CHECK_POSITIONS="$(jq -c '.checkPositions' "$RUNNER_TEMP/backup-key.json")" python3 - backend/src/main/resources/cz/novanadeje/app/operations/domain/backup/bip39-czech.txt <<'PY'
          import hashlib, json, os, sys
          alphabet = 'qpzry9x8gf2tvdw0s3jn54khce6mua7l'
          text = os.environ['BACKUP_KEY_TEXT'].lower()
          accumulator, bits, key = 0, 0, []
          for character in text[text.rfind('1') + 1:-6]:
              accumulator, bits = (accumulator << 5) | alphabet.index(character), bits + 5
              if bits >= 8:
                  bits -= 8
                  key.append((accumulator >> bits) & 255)
          wordlist = open(sys.argv[1]).read().split()
          number = int.from_bytes(bytes(key) + hashlib.sha256(bytes(key)).digest()[:1], 'big')
          words = [wordlist[(number >> (11 * (23 - index))) & 2047] for index in range(24)]
          print(json.dumps([{'position': position, 'word': words[position - 1]} for position in json.loads(os.environ['CHECK_POSITIONS'])]))
          PY
          )
          mismatch=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 -H 'X-Forwarded-For: 203.0.113.7' -H 'Content-Type: application/json' --data "{\"code\":\"$code\",\"settings\":[],\"backupKeyWords\":[{\"position\":1,\"word\":\"****\"},{\"position\":2,\"word\":\"****\"},{\"position\":3,\"word\":\"****\"}]}" http://localhost:8089/api/operations/setup)
          rm -f "$RUNNER_TEMP/backup-key.json"
          [ "$mismatch" = 400 ] || { echo "::error::the setup must refuse words that are not the backup key's (got $mismatch)"; exit 1; }
          restarts=$(docker inspect -f '{{.RestartCount}}' nfnn-backend)
          saved=$(curl -fsS --max-time 30 -H 'X-Forwarded-For: 203.0.113.7' -H 'Content-Type: application/json' --data "{\"code\":\"$code\",\"backupKeyWords\":$key_words,\"settings\":[{\"name\":\"PUBLIC_URL\",\"value\":\"http://localhost:8089\"},{\"name\":\"MAIL_HOST\",\"value\":\"nfnn-probe-mail\"},{\"name\":\"MAIL_PORT\",\"value\":\"1025\"},{\"name\":\"MAIL_FROM\",\"value\":\"info@nfnn.cz\"},{\"name\":\"CONTACT_RECIPIENT\",\"value\":\"info@nfnn.cz\"},{\"name\":\"ADMIN_EMAILS\",\"value\":\"spravce@example.cz\"},{\"name\":\"MAIL_PASSWORD\",\"value\":\"not-a-real-password\"}]}" http://localhost:8089/api/operations/setup)
          echo "$saved" | jq -e '.restarting == true' > /dev/null || { echo "::error::the setup was not saved: $saved"; exit 1; }
          echo "The backend restarts with the stored settings"
          for _ in $(seq 90); do
            if [ "$(docker inspect -f '{{.RestartCount}}' nfnn-backend)" -gt "$restarts" ] && [ "$(docker inspect -f '{{.State.Health.Status}}' nfnn-backend)" = healthy ]; then
              break
            fi
            sleep 2
          done
          [ "$(docker inspect -f '{{.State.Health.Status}}' nfnn-backend)" = healthy ] && [ "$(docker inspect -f '{{.RestartCount}}' nfnn-backend)" -gt "$restarts" ] || { echo "::error::the backend did not come back after the setup"; exit 1; }
          done_status=$(curl -fsS --max-time 10 http://localhost:8089/api/operations/setup)
          [ "$(echo "$done_status" | jq -r '.required')" = false ] || { echo "::error::the setup still asks after the restart"; exit 1; }
          grep -q 'Loaded 7 stored settings' "$RUNNER_TEMP/nfnn/logs/backend.log" || { echo "::error::the backend did not load the stored settings"; exit 1; }
          if sudo grep -rqF "$backup_key" "$RUNNER_TEMP/nfnn/logs"; then
            echo "::error::the backup key must reach no log file"
            exit 1
          fi
          [ "$(docker exec nfnn-postgres psql -U novanadeje -d novanadeje -tA -c "select count(*) from operations_backup_key_confirmation where confirmed_by is null")" = 1 ] || { echo "::error::the setup did not record the backup key as saved"; exit 1; }
          stored=$(docker exec nfnn-postgres psql -U novanadeje -d novanadeje -tA -c "select value from operations_setting where name = 'MAIL_PASSWORD'")
          case "$stored" in
            v1:*) ;;
            *) echo "::error::the SMTP password must be stored encrypted"; exit 1 ;;
          esac
          if echo "$stored" | grep -q not-a-real-password; then
            echo "::error::the stored SMTP password is readable in the database"
            exit 1
          fi
          carried=$(docker exec nfnn-postgres psql -U novanadeje -d novanadeje -tA -c "select wrapped from operations_carried_settings_key")
          case "$carried" in
            v1:*) ;;
            *) echo "::error::the backend must carry its settings key, wrapped under the backup key, into the database for the backups"; exit 1 ;;
          esac
          if echo "$carried" | grep -qF "$(sudo cat "$secrets/settings-key")"; then
            echo "::error::the carried settings key must be wrapped, not stored as it is"
            exit 1
          fi
          closed=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 -H 'Content-Type: application/json' --data '{"code":null,"settings":[]}' http://localhost:8089/api/operations/setup)
          [ "$closed" = 409 ] || { echo "::error::a completed setup must answer 409 (got $closed)"; exit 1; }

      - name: The backend uses the database as an ordinary role that owns the site's tables
        run: |
          sql() {
            docker exec nfnn-postgres psql -U novanadeje -d novanadeje -tA -c "$1"
          }
          [ "$(sql "select rolsuper or rolcreaterole or rolcreatedb or rolreplication or rolbypassrls from pg_roles where rolname = 'novanadeje_app'")" = f ] || { echo "::error::the application role must be no superuser and create neither roles nor databases"; exit 1; }
          [ "$(sql "select count(*) from pg_auth_members where member = 'novanadeje_app'::regrole")" = 0 ] || { echo "::error::the application role must belong to no other role (pg_read_server_files, pg_execute_server_program and the like)"; exit 1; }
          [ "$(sql "select string_agg(distinct usename, ',') from pg_stat_activity where datname = 'novanadeje' and usename <> 'novanadeje'")" = novanadeje_app ] || { echo "::error::the backend must log in as novanadeje_app"; sql "select usename, application_name from pg_stat_activity where datname = 'novanadeje'"; exit 1; }
          [ "$(sql "select count(*) from pg_class c join pg_namespace n on n.oid = c.relnamespace where n.nspname = 'public' and c.relowner <> 'novanadeje_app'::regrole")" = 0 ] || { echo "::error::every table, index and sequence of the site belongs to novanadeje_app"; exit 1; }
          [ "$(sql "select pg_get_userbyid(datdba) from pg_database where datname = 'novanadeje'")" = novanadeje_app ] || { echo "::error::the site's database belongs to novanadeje_app"; exit 1; }
          if docker exec -u app nfnn-backend cat /secrets/db-password > /dev/null 2>&1 || docker exec -u app nfnn-backend cat /secrets/db-app-password > /dev/null 2>&1; then
            echo "::error::the backend's Java process must read no database password from the secrets folder"
            exit 1
          fi

      - name: The database takes the generated passwords and hands an older database to the application role
        run: |
          docker exec nfnn-postgres psql -U novanadeje -d novanadeje -c "alter role novanadeje password 'an-old-password'" -c "alter role novanadeje_app password 'an-old-password'" -c "alter table admin_action owner to novanadeje" -c "alter database novanadeje owner to novanadeje"
          docker compose restart postgres
          synced=false
          for _ in $(seq 30); do
            if docker exec nfnn-postgres sh -c 'PGPASSWORD=$(cat /secrets/db-password) psql -h 127.0.0.1 -U novanadeje -d novanadeje -tA -c "select 1" > /dev/null && PGPASSWORD=$(cat /secrets/db-app-password) psql -h 127.0.0.1 -U novanadeje_app -d novanadeje -tA -c "select 1"' 2> /dev/null | grep -q 1; then
              synced=true
              break
            fi
            sleep 2
          done
          [ "$synced" = true ] || { echo "::error::nfnn-postgres did not set the roles' passwords to the generated ones"; exit 1; }
          [ "$(docker exec nfnn-postgres psql -U novanadeje -d novanadeje -tA -c "select pg_get_userbyid(relowner) from pg_class where oid = 'public.admin_action'::regclass")" = novanadeje_app ] || { echo "::error::nfnn-postgres did not hand a table of an older database to novanadeje_app"; exit 1; }
          [ "$(docker exec nfnn-postgres psql -U novanadeje -d novanadeje -tA -c "select pg_get_userbyid(datdba) from pg_database where datname = 'novanadeje'")" = novanadeje_app ] || { echo "::error::nfnn-postgres did not hand an older database to novanadeje_app"; exit 1; }
          docker compose up -d --wait --wait-timeout 300 backend

      - name: Verify
        run: |
          curl -fsS --max-time 10 http://localhost:8089/ | grep -q '<app-root'
          status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 http://localhost:8089/api/)
          echo "/api/ answered $status"
          case "$status" in
            502|503|504|000) echo "::error::nginx could not reach the backend"; exit 1 ;;
          esac
          for container in nfnn-postgres nfnn-backup nfnn-mcp nfnn-frontend; do
            main_environment=$(docker exec --privileged "$container" sh -c "tr '\\0' '\\n' < /proc/1/environ")
            [ "$container" = nfnn-frontend ] || echo "$main_environment" | grep -q '^PATH=' || { echo "::error::could not read the environment of $container's main process (nginx alone writes its title over it)"; exit 1; }
            for key in JWT_SECRET SETTINGS_KEY BACKUP_KEY RECEIPT_SIGNING_KEY DB_PASSWORD FIO_TOKEN MAIL_PASSWORD; do
              if docker exec "$container" printenv "$key" > /dev/null || echo "$main_environment" | grep -q "^$key="; then
                echo "::error::$container must not receive $key, neither in its configuration nor in its main process"
                exit 1
              fi
            done
          done
          docker exec nfnn-backend sh -c 'uid=$(awk "/^Uid:/ {print \$2}" /proc/1/status); [ "$uid" = "$(id -u app)" ]' || { echo "::error::the backend's Java process must run as the app user"; exit 1; }
          backend_ip=$(docker inspect -f '{{(index .NetworkSettings.Networks "nfnn-edge").IPAddress}}' nfnn-backend)
          postgres_ip=$(docker inspect -f '{{(index .NetworkSettings.Networks "nfnn-edge").IPAddress}}' nfnn-postgres)
          if docker run --rm --network bridge --entrypoint sh ghcr.io/bzumik1/nfnn-postgres:latest -c "wget -q -T 3 -O /dev/null http://$backend_ip:8080/actuator/health || pg_isready -q -h $postgres_ip -t 3"; then
            echo "::error::a container on the default bridge reached the backend or the database"
            exit 1
          fi
          echo "The backend and the backup service write their logs into the logs folder"
          logs="$RUNNER_TEMP/nfnn/logs"
          grep -q 'Backend revision dev is ready' "$logs/backend.log" || { echo "::error::the backend did not write its log file"; ls -la "$logs"; exit 1; }
          grep -q 'backup written' "$logs/backup.log" || { echo "::error::the backup service did not write its log file"; ls -la "$logs"; exit 1; }
          echo "The MCP connector answers through the frontend: a challenge without a token, the resource metadata and the authorization server metadata"
          [ -z "$(docker port nfnn-mcp)" ] || { echo "::error::the MCP connector must publish no port"; exit 1; }
          issuer=$(curl -fsS --max-time 10 http://localhost:8089/.well-known/oauth-authorization-server | jq -r '.issuer')
          [ -n "$issuer" ] && [ "$issuer" != null ] || { echo "::error::the authorization server metadata names no issuer"; exit 1; }
          echo "The authorization server is $issuer"
          echo "The connector picks up the address saved in the first setup within its 30 s refresh"
          for _ in $(seq 25); do
            docker exec nfnn-mcp wget -q -O - http://127.0.0.1:8081/health | jq -e --arg issuer "$issuer" '.issuer == $issuer' > /dev/null && break
            sleep 2
          done
          docker exec nfnn-mcp wget -q -O - http://127.0.0.1:8081/health | jq -e --arg issuer "$issuer" '.issuer == $issuer' > /dev/null || { echo "::error::the MCP connector still names another authorization server"; exit 1; }
          mcp_headers=$(curl -sS -D - -o /dev/null --max-time 10 -X POST -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' --data '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' http://localhost:8089/mcp)
          echo "$mcp_headers" | grep -q '^HTTP/1.1 401' || { echo "::error::/mcp without a token must answer 401"; echo "$mcp_headers"; exit 1; }
          echo "$mcp_headers" | grep -qi "^WWW-Authenticate: Bearer .*resource_metadata=\"$issuer/.well-known/oauth-protected-resource/mcp\"" || { echo "::error::the 401 must point at the protected resource metadata"; echo "$mcp_headers"; exit 1; }
          metadata=$(curl -fsS --max-time 10 http://localhost:8089/.well-known/oauth-protected-resource/mcp)
          [ "$(echo "$metadata" | jq -r '.resource')" = "$issuer/mcp" ] || { echo "::error::the protected resource metadata does not name /mcp"; echo "$metadata"; exit 1; }
          [ "$(echo "$metadata" | jq -r '.authorization_servers[0]')" = "$issuer" ] || { echo "::error::the protected resource metadata does not name the site as its authorization server"; echo "$metadata"; exit 1; }
          [ "$(echo "$metadata" | jq -r '.scopes_supported | join(" ")')" = "admin:read admin:write" ] || { echo "::error::the protected resource metadata does not list both scopes"; echo "$metadata"; exit 1; }
          docker exec nfnn-mcp wget -q -O - http://127.0.0.1:8081/health | grep -q '"status":"UP"' || { echo "::error::the MCP connector did not discover the authorization server"; exit 1; }
          docker exec nfnn-mcp sh -c 'uid=$(awk "/^Uid:/ {print \$2}" /proc/1/status); [ "$uid" = "$(id -u node)" ]' || { echo "::error::the MCP connector must run as the node user"; exit 1; }
          echo "The frontend and the connector write their logs into the logs folder, without addresses or query strings, and rotated the files left over from an earlier day"
          curl -fsS -o /dev/null --max-time 10 'http://localhost:8089/?q=not-in-the-log'
          docker exec nfnn-frontend wget -q -O /dev/null http://127.0.0.1/healthcheck-not-in-the-log
          grep -q 'Authorization server discovered' "$logs/mcp.log" || { echo "::error::the MCP connector did not write its log file"; ls -la "$logs"; exit 1; }
          grep -qE ' GET / 200 ' "$logs/nginx-access.log" || { echo "::error::nginx did not write its access log"; ls -la "$logs"; exit 1; }
          grep -qE ' POST /mcp 401 ' "$logs/nginx-access.log" || { echo "::error::the access log misses the connector's 401"; cat "$logs/nginx-access.log"; exit 1; }
          curl -fsS -o /dev/null --max-time 10 -X POST -H 'Content-Type: application/json' --data "{\"digest\":\"$(printf '%064d' 0)\"}" http://localhost:8089/api/donations/receipts/status
          grep -qE ' POST /api/donations/receipts/status 200 [0-9]+\.[0-9]{3} ' "$logs/nginx-access.log" || { echo "::error::the access log misses the receipt status question or still records the size of its answer, which tells the four answers apart"; grep 'receipts/status' "$logs/nginx-access.log"; exit 1; }
          if grep -nE 'not-in-the-log|([0-9]{1,3}\.){3}[0-9]{1,3}' "$logs/nginx-access.log"; then
            echo "::error::the access log must name no client address, no query string and no healthcheck from inside the container"
            exit 1
          fi
          docker logs nfnn-frontend > "$RUNNER_TEMP/frontend-console.log" 2>&1
          grep -qE ' GET / 200 ' "$RUNNER_TEMP/frontend-console.log" || { echo "::error::nginx no longer writes its access log to the console"; exit 1; }
          grep -qE ' POST /api/donations/receipts/status 200 [0-9]+\.[0-9]{3} ' "$RUNNER_TEMP/frontend-console.log" || { echo "::error::the console access log misses the receipt status question or still records the size of its answer"; exit 1; }
          if grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}T' "$RUNNER_TEMP/frontend-console.log" | grep -nE 'not-in-the-log|([0-9]{1,3}\.){3}[0-9]{1,3}'; then
            echo "::error::the console access log (docker logs) must name no client address and no query string either"
            exit 1
          fi
          for log in nginx-access.log mcp.log; do
            rotated=$(ls "$logs/$log".*.gz 2>/dev/null | head -n 1)
            [ -n "$rotated" ] && zcat "$rotated" | grep -q 'left over from an earlier day' || { echo "::error::$log left over from an earlier day was not rotated"; ls -la "$logs"; exit 1; }
            ! grep -q 'left over from an earlier day' "$logs/$log" || { echo "::error::$log still holds the earlier day"; exit 1; }
          done
          backups="$RUNNER_TEMP/nfnn/backups"
          wait_for() {
            for _ in $(seq "$2"); do
              if eval "$1"; then return 0; fi
              sleep 2
            done
            echo "::error::$3"
            return 1
          }
          wait_for "ls $backups/nfnn-*.dump.age > /dev/null 2>&1" 30 "the backup service wrote no encrypted dump"
          if ls "$backups"/nfnn-*.dump > /dev/null 2>&1; then
            echo "::error::a backup was written without encryption"
            exit 1
          fi
          dump=$(ls "$backups"/nfnn-*.dump.age | head -n 1)
          [ "$(head -c 21 "$dump")" = 'age-encryption.org/v1' ] || { echo "::error::the backup is not an age file"; exit 1; }
          if docker exec nfnn-backup pg_restore --list "/backups/$(basename "$dump")" > /dev/null 2>&1; then
            echo "::error::the encrypted backup reads without its key"
            exit 1
          fi
          if ! docker exec nfnn-backup sh -c "age --decrypt --identity /secrets/backup-key '/backups/$(basename "$dump")' | pg_restore --list" | grep -q 'Compression: zstd'; then
            echo "::error::the decrypted backup is not a dump compressed with zstd"
            exit 1
          fi
          echo "$dump is an encrypted zstd dump"
          grep -q '^outcome=ok$' "$backups/status/backup" || { echo "::error::the backup status file does not say ok"; cat "$backups/status/backup"; exit 1; }
          [ "$(stat -c %a "$backups/requests")" = 1777 ] || { echo "::error::the requests folder must be writable for the backend (mode 1777)"; exit 1; }

          echo "The backend hands the backup schedule to the backup service, which reports the schedule it runs"
          wait_for "grep -q '^backup_time=03:00$' $backups/requests/schedule 2> /dev/null" 60 "the backend did not hand the backup schedule over at start"
          wait_for "grep -q '^test_restore_day=7$' $backups/status/schedule 2> /dev/null" 15 "the backup service reports no schedule"
          docker exec -u app nfnn-backend sh -c "printf 'backup_time=02:30\ntest_restore_day=6\ntest_restore_time=05:15\n' > /backups/requests/schedule"
          wait_for "grep -q '^backup_time=02:30$' $backups/status/schedule && grep -q '^test_restore_day=6$' $backups/status/schedule" 15 "the backup service did not take the changed schedule"
          grep -q 'schedule: daily backup at 02:30, test restore on day 6 at 05:15' "$logs/backup.log" || { echo "::error::the backup log does not name the changed schedule"; exit 1; }
          docker exec -u app nfnn-backend sh -c "printf 'backup_time=25:00\ntest_restore_day=9\ntest_restore_time=05:15\n' > /backups/requests/schedule"
          wait_for "grep -q '^backup_time=03:00$' $backups/status/schedule && grep -q '^test_restore_day=7$' $backups/status/schedule" 15 "an invalid schedule did not fall back to the defaults"

          echo "A requested backup and a test restore run from request files"
          docker exec nfnn-backend sh -c 'touch /backups/requests/ci-1.backup && touch /backups/requests/ci-2.test-restore'
          wait_for "grep -q '^request=ci-1$' $backups/status/backup" 30 "the requested backup did not run"
          grep -q -- '-rucni.dump.age$' "$backups/status/backup" || { echo "::error::the requested backup is not named -rucni"; exit 1; }
          wait_for "grep -q '^request=ci-2$' $backups/status/test-restore" 60 "the requested test restore did not run"
          grep -q '^outcome=ok$' "$backups/status/test-restore" || { echo "::error::the test restore failed"; cat "$backups/status/test-restore"; exit 1; }
          grep -E '^tables=[1-9][0-9]*$' "$backups/status/test-restore" || { echo "::error::the test restore counted no tables"; exit 1; }
          full_dump=$(ls "$backups"/nfnn-*-rucni.dump.age | head -n 1)

          echo "A dump in the restore folder is restored into the emptied database before the backend starts"
          restore="$RUNNER_TEMP/nfnn/restore"
          docker compose stop backend backup
          docker exec nfnn-postgres psql -U novanadeje -d novanadeje -c "insert into admin_action (id, admin_id, action, details, performed_at) values ('019a0000-0000-7000-8000-000000000001', '019a0000-0000-7000-8000-000000000002', 'CI_MARKER', 'to be undone by the restore', now())"
          sudo cp "$full_dump" "$restore/ci.force.dump.age"
          docker compose up -d --wait --wait-timeout 300 postgres backup backend frontend
          wait_for "[ -f $restore/ci.force.dump.age.done ]" 30 "the restore folder dump was not restored"
          grep -q '^outcome=ok$' "$backups/status/restore" || { echo "::error::the restore status file does not say ok"; cat "$backups/status/restore"; exit 1; }
          ls "$backups"/nfnn-*-pred-obnovou.dump.age > /dev/null || { echo "::error::no safety dump was taken before the forced restore"; exit 1; }
          marker=$(docker exec nfnn-postgres psql -U novanadeje -d novanadeje -tA -c "select count(*) from admin_action where action = 'CI_MARKER'")
          [ "$marker" = 0 ] || { echo "::error::the forced restore kept a row written after the dump"; exit 1; }
          curl -fsS --max-time 10 http://localhost:8089/ | grep -q '<app-root'

          echo "A restore asked for in the administration runs while the restarted backend waits, replaces the data, releases a Liquibase lock caught in the dump, keeps the receipt numbers ahead and is recorded once"
          count_rows() {
            docker exec nfnn-postgres psql -U novanadeje -d novanadeje -tA -c "select count(*) from admin_action where $1"
          }
          docker exec nfnn-postgres psql -U novanadeje -d novanadeje -c "update databasechangeloglock set locked = true, lockgranted = now(), lockedby = 'ci, as a dump taken while Liquibase runs'"
          docker exec nfnn-backend sh -c 'touch /backups/requests/ci-lock.backup'
          wait_for "grep -q '^request=ci-lock$' $backups/status/backup" 60 "the backup with the Liquibase lock held did not run"
          locked_dump=$(sed -n 's/^file=//p' "$backups/status/backup")
          docker exec nfnn-postgres psql -U novanadeje -d novanadeje -c "update databasechangeloglock set locked = false, lockgranted = null, lockedby = null"
          docker exec nfnn-postgres psql -U novanadeje -d novanadeje -c "insert into admin_action (id, admin_id, action, details, performed_at) values ('019a0000-0000-7000-8000-000000000003', '019a0000-0000-7000-8000-000000000002', 'CI_MARKER', 'to be undone by the requested restore', now())"
          docker exec nfnn-postgres psql -U novanadeje -d novanadeje -tA -c "select setval('donation_receipt_number_seq', 41)"
          docker exec nfnn-backend sh -c "printf 'source=backup\nfile=%s\nadmin=019a0000-0000-7000-8000-000000000002\n' '$locked_dump' > /backups/requests/ci-3.restore"
          docker restart nfnn-backend
          wait_for "grep -q '^request=ci-3$' $backups/status/restore" 60 "the requested restore did not run"
          grep -q '^outcome=ok$' "$backups/status/restore" || { echo "::error::the requested restore failed"; cat "$backups/status/restore"; exit 1; }
          docker compose up -d --wait --wait-timeout 300 backend
          [ ! -e "$backups/status/restore.running" ] || { echo "::error::the restore left its running marker"; exit 1; }
          [ "$(count_rows "action = 'CI_MARKER'")" = 0 ] || { echo "::error::the requested restore kept a row written after the dump"; exit 1; }
          [ "$(docker exec nfnn-postgres psql -U novanadeje -d novanadeje -tA -c "select count(*) from databasechangeloglock where locked")" = 0 ] || { echo "::error::the restore kept the Liquibase lock caught in the dump"; exit 1; }
          receipt_number=$(docker exec nfnn-postgres psql -U novanadeje -d novanadeje -tA -c "select last_value from donation_receipt_number_seq")
          [ "$receipt_number" = 41 ] || { echo "::error::the restore rewound the receipt numbers to $receipt_number, so numbers issued after the backup would be issued again"; exit 1; }
          [ "$(count_rows "action = 'BACKUP_RESTORED' and admin_id = '019a0000-0000-7000-8000-000000000002'")" = 1 ] || { echo "::error::the finished restore is not recorded in the administration history"; exit 1; }
          docker exec nfnn-postgres psql -U novanadeje -d postgres -tA -c "select datname from pg_database" | grep -q nfnn_restore && { echo "::error::a staging or retired database was left behind"; exit 1; }
          [ "$(docker exec nfnn-postgres psql -U novanadeje -d novanadeje -tA -c "select count(*) from pg_class c join pg_namespace n on n.oid = c.relnamespace where n.nspname = 'public' and c.relowner <> 'novanadeje_app'::regrole")" = 0 ] || { echo "::error::the restored database must belong to novanadeje_app, or the backend cannot migrate it"; exit 1; }
          [ "$(docker exec nfnn-postgres psql -U novanadeje -d novanadeje -tA -c "select pg_get_userbyid(datdba) from pg_database where datname = 'novanadeje'")" = novanadeje_app ] || { echo "::error::the restored database must belong to novanadeje_app"; exit 1; }

          echo "A restore that fails leaves the data as they were, removes the upload and lets the backend start"
          docker exec nfnn-postgres psql -U novanadeje -d novanadeje -c "insert into admin_action (id, admin_id, action, details, performed_at) values ('019a0000-0000-7000-8000-000000000004', '019a0000-0000-7000-8000-000000000002', 'CI_MARKER', 'kept by the failed restore', now())"
          docker exec -u app nfnn-backend sh -c "printf 'PGDMP but not a dump' > /restore/ci-4.upload && printf 'source=upload\nfile=ci-4.upload\nadmin=\n' > /backups/requests/ci-4.restore"
          docker restart nfnn-backend
          wait_for "grep -q '^request=ci-4$' $backups/status/restore" 60 "the failing restore did not run"
          grep -q '^outcome=failed$' "$backups/status/restore" || { echo "::error::the broken upload was not reported as failed"; cat "$backups/status/restore"; exit 1; }
          docker compose up -d --wait --wait-timeout 300 backend
          [ "$(count_rows "action = 'CI_MARKER'")" = 1 ] || { echo "::error::the failed restore changed the data"; exit 1; }
          [ ! -e "$restore/ci-4.upload" ] || { echo "::error::the upload was left in the restore folder"; exit 1; }
          curl -fsS --max-time 10 http://localhost:8089/ | grep -q '<app-root'

          echo "A backup taken before receipts moved to the browser is refused once this server has given out a receipt number, so the numbering never starts at 1 again below numbers already issued"
          switch_changeset="024-delete-test-receipts-and-drop-the-server-drawing"
          docker exec nfnn-postgres psql -U novanadeje -d novanadeje -v ON_ERROR_STOP=1 -c "create table ci_switch_row as select * from databasechangelog where id = '$switch_changeset'" -c "delete from databasechangelog where id = '$switch_changeset'"
          docker exec nfnn-backend sh -c 'touch /backups/requests/ci-pre-switch.backup'
          wait_for "grep -q '^request=ci-pre-switch$' $backups/status/backup" 60 "the backup without the switch changeset did not run"
          pre_switch_dump=$(sed -n 's/^file=//p' "$backups/status/backup")
          docker exec nfnn-postgres psql -U novanadeje -d novanadeje -v ON_ERROR_STOP=1 -c "insert into databasechangelog select * from ci_switch_row" -c "drop table ci_switch_row"
          [ "$(docker exec nfnn-postgres psql -U novanadeje -d novanadeje -tA -c "select is_called from donation_receipt_number_seq")" = t ] || { echo "::error::the probe needs a receipt number given out since the switch"; exit 1; }
          docker exec nfnn-backend sh -c "printf 'source=backup\nfile=%s\nadmin=019a0000-0000-7000-8000-000000000002\n' '$pre_switch_dump' > /backups/requests/ci-pre-switch.restore"
          docker restart nfnn-backend
          wait_for "grep -q '^request=ci-pre-switch$' $backups/status/restore" 60 "the restore of the backup from before the switch did not run"
          grep -q '^outcome=failed$' "$backups/status/restore" || { echo "::error::a backup from before the switch was restored although receipt numbers were given out since"; cat "$backups/status/restore"; exit 1; }
          grep -q 'taken before receipts moved to the browser' "$backups/status/restore" || { echo "::error::the refusal does not say why"; cat "$backups/status/restore"; exit 1; }
          docker compose up -d --wait --wait-timeout 300 backend
          [ "$(count_rows "action = 'CI_MARKER'")" = 1 ] || { echo "::error::the refused restore changed the data"; exit 1; }
          [ "$(docker exec nfnn-postgres psql -U novanadeje -d novanadeje -tA -c "select last_value from donation_receipt_number_seq")" = 41 ] || { echo "::error::the refused restore moved the receipt numbers"; exit 1; }
          [ "$(docker exec nfnn-postgres psql -U novanadeje -d novanadeje -tA -c "select count(*) from databasechangelog where id = '$switch_changeset'")" = 1 ] || { echo "::error::the switch changeset is no longer recorded"; exit 1; }

          echo "A key planted in the restore folder is not adopted, and a backup uploaded with its own key is restored and its key becomes the server's"
          secrets="$RUNNER_TEMP/nfnn/secrets"
          server_key() {
            sudo grep -m 1 '^AGE-SECRET-KEY-' "$secrets/backup-key"
          }
          first_key=$(server_key)
          planted_key=$(docker exec nfnn-backup age-keygen 2> /dev/null | grep '^AGE-SECRET-KEY-')
          printf '%s\n' "$planted_key" | docker exec -i -u app nfnn-backend sh -c 'cat > /restore/backup-key.adopt'
          docker restart nfnn-backend
          docker compose up -d --wait --wait-timeout 300 backend
          [ "$(server_key)" = "$first_key" ] || { echo "::error::the backend adopted a backup key the app user left in the restore folder"; exit 1; }
          docker logs nfnn-backend 2>&1 | grep -q 'is not the one the backup container recorded' || { echo "::error::the backend did not warn about the planted backup key"; exit 1; }
          uploaded_key=$(docker exec nfnn-backup age-keygen 2> /dev/null | grep '^AGE-SECRET-KEY-')
          uploaded_recipient=$(printf '%s\n' "$uploaded_key" | docker exec -i nfnn-backup age-keygen -y)
          docker exec nfnn-backup sh -c "age --decrypt --identity /secrets/backup-key '/backups/$(basename "$full_dump")' | age --recipient '$uploaded_recipient'" | docker exec -i -u app nfnn-backend sh -c 'cat > /restore/ci-5.upload'
          printf '%s\n' "$uploaded_key" | docker exec -i -u app nfnn-backend sh -c 'cat > /restore/ci-5.key'
          docker exec -u app nfnn-backend sh -c "printf 'source=upload\nfile=ci-5.upload\nadmin=\n' > /backups/requests/ci-5.restore"
          docker restart nfnn-backend
          wait_for "grep -q '^request=ci-5$' $backups/status/restore" 60 "the restore of the upload with its own key did not run"
          grep -q '^outcome=ok$' "$backups/status/restore" || { echo "::error::the restore of the upload with its own key failed"; cat "$backups/status/restore"; exit 1; }
          docker compose up -d --wait --wait-timeout 300 backend
          grep -qx "recipient=$uploaded_recipient" "$backups/status/adopted-key" || { echo "::error::the backup container did not record the adopted key"; exit 1; }
          [ "$(server_key)" = "$uploaded_key" ] || { echo "::error::the key uploaded with the backup did not become the server's backup key"; exit 1; }
          [ "$(sudo sh -c "grep -h -m 1 '^AGE-SECRET-KEY-' '$secrets'/backup-key.replaced-*")" = "$first_key" ] || { echo "::error::the replaced backup key was not kept"; exit 1; }
          [ -z "$(sudo find "$restore" -maxdepth 1 \( -name '*.key' -o -name '*.adopt' -o -name '*.upload' \))" ] || { echo "::error::the restore left the upload or a key in the restore folder"; exit 1; }
          [ -z "$(sudo find "$backups" \( -name '*.dump' -o -name work \))" ] || { echo "::error::a backup, a restore or a test restore left an unencrypted copy in the backups folder"; sudo find "$backups"; exit 1; }
          curl -fsS --max-time 10 http://localhost:8089/ | grep -q '<app-root'

          echo "A request for a new receipt signing seed that names another key than the seed's, planted by the app user, is removed and changes nothing"
          kept_seed=$(sudo cat "$secrets/receipt-signing-key")
          docker exec -u app nfnn-backend sh -c "printf '%s' '00000000' > /restore/receipt-signing-key.renew"
          docker restart nfnn-backend
          docker compose up -d --wait --wait-timeout 300 backend
          [ ! -e "$restore/receipt-signing-key.renew" ] || { echo "::error::the request for a new receipt signing seed was left in the restore folder"; exit 1; }
          [ "$(sudo cat "$secrets/receipt-signing-key")" = "$kept_seed" ] || { echo "::error::a request naming another key replaced the receipt signing seed"; exit 1; }
          [ -z "$(sudo find "$secrets" -maxdepth 1 -name 'receipt-signing-key.withdrawn-*')" ] || { echo "::error::a request naming another key kept a seed aside"; sudo ls -la "$secrets"; exit 1; }
          docker logs nfnn-backend 2>&1 | grep -q "names the key 00000000, which is not the key of the seed" || { echo "::error::the entrypoint did not say that it ignored the request naming another key"; exit 1; }
          curl -fsS --max-time 10 http://localhost:8089/ | grep -q '<app-root'

      - name: An administrator signed in with the second factor uploads a JPEG and a WebP photo, which the read-only backend stores as WebP, and withdraws the server's receipt signing key, which the next start replaces
        run: |
          echo "Mail goes to the probe's own mail catcher, the MAIL_HOST of the first setup, on the stack's network"
          docker run -d --name nfnn-probe-mail --network nfnn-edge -p 127.0.0.1:8025:8025 axllent/mailpit:v1.31.5 > /dev/null
          for _ in $(seq 30); do
            curl -fsS -o /dev/null --max-time 2 http://127.0.0.1:8025/api/v1/messages 2> /dev/null && break
            sleep 1
          done
          api=http://localhost:8089/api
          client='X-Forwarded-For: 203.0.113.30'
          password='a probe password for the photo upload'
          registered=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 -H "$client" -H 'Content-Type: application/json' --data "{\"type\":\"PERSON\",\"name\":\"Zkušební Správce\",\"address\":{\"street\":\"Zkušební 1\",\"city\":\"Zkušebná\",\"postalCode\":\"100 00\"},\"email\":\"spravce@example.cz\",\"password\":\"$password\",\"preferredLocale\":\"cs\"}" "$api/donors/auth/register")
          [ "$registered" = 202 ] || { echo "::error::the registration of the administrator named in ADMIN_EMAILS answered $registered"; exit 1; }
          token=
          for _ in $(seq 30); do
            for id in $(curl -fsS --max-time 5 'http://127.0.0.1:8025/api/v1/search?query=to%3Aspravce%40example.cz' | jq -r '.messages[].ID'); do
              token=$(curl -fsS --max-time 5 "http://127.0.0.1:8025/api/v1/message/$id" | jq -r '.Text' | grep -oE 'potvrzeni-emailu#token=[A-Za-z0-9_-]{43}' | head -n 1 | cut -d= -f2)
              [ -n "$token" ] && break 2
            done
            sleep 1
          done
          [ -n "$token" ] || { echo "::error::no verification e-mail reached the mail catcher"; exit 1; }
          session=$(curl -fsS --max-time 30 -H "$client" -H 'Content-Type: application/json' --data "{\"token\":\"$token\"}" "$api/donors/auth/email-verification/confirm" | jq -r '.accessToken')
          enrolment=$(curl -fsS --max-time 30 -H "$client" -H "Authorization: Bearer $session" -H 'Content-Type: application/json' --data "{\"password\":\"$password\"}" "$api/donors/me/second-factor/setup")
          totp() {
            TOTP_SECRET="$(echo "$enrolment" | jq -r '.secret')" TOTP_STEPS_AHEAD="$1" python3 -c '
          import base64, hashlib, hmac, os, struct, time
          step = int(time.time()) // 30 + int(os.environ["TOTP_STEPS_AHEAD"])
          digest = hmac.new(base64.b32decode(os.environ["TOTP_SECRET"]), struct.pack(">Q", step), hashlib.sha1).digest()
          offset = digest[-1] & 15
          print("%06d" % ((struct.unpack(">I", digest[offset:offset + 4])[0] & 0x7FFFFFFF) % 1000000))'
          }
          code=$(totp 0)
          admin=$(curl -fsS --max-time 30 -H "$client" -H "Authorization: Bearer $session" -H 'Content-Type: application/json' --data "{\"code\":\"$code\"}" "$api/donors/me/second-factor/confirm" | jq -r '.accessToken')
          ACCESS_TOKEN="$admin" python3 -c 'import base64, json, os, sys; payload = os.environ["ACCESS_TOKEN"].split(".")[1]; sys.exit("ADMIN" not in json.loads(base64.urlsafe_b64decode(payload + "=" * (-len(payload) % 4)))["roles"])' || { echo "::error::the session opened with the second factor does not carry ADMIN"; exit 1; }
          for photo in frontend/public/images/og-image.jpg:image/jpeg frontend/public/images/news-1.webp:image/webp; do
            file=${photo%%:*}
            uploaded=$(curl -sS -w '\n%{http_code}' --max-time 60 -H "$client" -H "Authorization: Bearer $admin" -F "file=@$file;type=${photo#*:}" "$api/admin/content/media")
            [ "$(echo "$uploaded" | tail -n 1)" = 201 ] || { echo "::error::uploading $file answered $(echo "$uploaded" | tail -n 1): $(echo "$uploaded" | head -n -1)"; exit 1; }
            url=$(echo "$uploaded" | head -n -1 | jq -r '.url')
            variant="$RUNNER_TEMP/variant.webp"
            type=$(curl -fsS -o "$variant" -w '%{content_type}' --max-time 10 "http://localhost:8089$url?w=480")
            [ "$type" = image/webp ] && [ "$(head -c 4 "$variant")" = RIFF ] && [ "$(dd if="$variant" bs=1 skip=8 count=4 2> /dev/null)" = WEBP ] || { echo "::error::the photo uploaded from $file is not served as WebP (got $type)"; exit 1; }
            echo "$file was stored and is served as WebP at $url"
          done
          if grep -n 'UnsatisfiedLinkError' "$RUNNER_TEMP/nfnn/logs/backend.log"; then
            echo "::error::the backend could not load the WebP codec's native library"
            exit 1
          fi

          echo "Withdrawing the server's own receipt signing key with a fresh code tells the administrator, restarts the backend, keeps the seed aside, registers a new key and passes the withdrawn id to Java"
          secrets="$RUNNER_TEMP/nfnn/secrets"
          restore="$RUNNER_TEMP/nfnn/restore"
          withdrawn_seed=$(sudo cat "$secrets/receipt-signing-key" | tr -d '\n')
          withdrawn_key=$(curl -fsS --max-time 10 -H "$client" -H "Authorization: Bearer $admin" "$api/admin/donations/receipt-signing-keys" | jq -r '.currentKeyId')
          echo "$withdrawn_key" | grep -qxE '[0-9a-f]{8}' || { echo "::error::the administration names no current receipt signing key (got $withdrawn_key)"; exit 1; }
          restarts=$(docker inspect -f '{{.RestartCount}}' nfnn-backend)
          withdrawal=$(curl -sS -w '\n%{http_code}' --max-time 30 -H "$client" -H "Authorization: Bearer $admin" -H 'Content-Type: application/json' --data "{\"secondFactorCode\":\"$(totp 1)\"}" "$api/admin/donations/receipt-signing-keys/$withdrawn_key/withdrawal")
          [ "$(echo "$withdrawal" | tail -n 1)" = 200 ] || { echo "::error::withdrawing the receipt signing key $withdrawn_key answered $(echo "$withdrawal" | tail -n 1): $(echo "$withdrawal" | head -n -1)"; exit 1; }
          [ "$(echo "$withdrawal" | head -n -1 | jq -r '.restarting')" = true ] || { echo "::error::withdrawing the server's own key must restart the backend"; exit 1; }
          notice=
          for _ in $(seq 60); do
            notice=$(curl -fsS --max-time 5 'http://127.0.0.1:8025/api/v1/search?query=to%3Aspravce%40example.cz%20subject%3A%22Kl%C3%AD%C4%8D%20k%20ov%C4%9B%C5%99ovac%C3%ADm%22' | jq -r '.messages_count')
            [ "$notice" = 1 ] && break
            sleep 1
          done
          [ "$notice" = 1 ] || { echo "::error::the administrator got no notice of the withdrawn receipt signing key"; exit 1; }
          for _ in $(seq 120); do
            [ "$(docker inspect -f '{{.RestartCount}}' nfnn-backend)" -gt "$restarts" ] && break
            sleep 1
          done
          [ "$(docker inspect -f '{{.RestartCount}}' nfnn-backend)" -gt "$restarts" ] || { echo "::error::the backend did not restart after the withdrawal of its own receipt signing key"; exit 1; }
          docker compose up -d --wait --wait-timeout 300 backend
          [ ! -e "$restore/receipt-signing-key.renew" ] || { echo "::error::the request for a new receipt signing seed was left in the restore folder"; exit 1; }
          [ "$(sudo stat -c '%a %U' "$secrets/receipt-signing-key.withdrawn-$withdrawn_key")" = '600 root' ] || { echo "::error::the withdrawn seed must be kept as secrets/receipt-signing-key.withdrawn-$withdrawn_key, owned by root with mode 600"; sudo ls -la "$secrets"; exit 1; }
          [ "$(sudo cat "$secrets/receipt-signing-key.withdrawn-$withdrawn_key" | tr -d '\n')" = "$withdrawn_seed" ] || { echo "::error::the kept withdrawn seed is not the seed the server signed with"; exit 1; }
          [ "$(sudo stat -c '%a %U' "$secrets/receipt-signing-key")" = '600 root' ] || { echo "::error::secrets/receipt-signing-key must be generated again, owned by root with mode 600"; exit 1; }
          renewed_seed=$(sudo cat "$secrets/receipt-signing-key" | tr -d '\n')
          [ "$renewed_seed" != "$withdrawn_seed" ] || { echo "::error::the receipt signing seed was not replaced after the withdrawal"; exit 1; }
          [ "$(echo "$renewed_seed" | base64 -d | wc -c)" = 32 ] || { echo "::error::the new receipt signing seed must be a 32-byte Ed25519 seed in base64"; exit 1; }
          docker logs nfnn-backend 2>&1 | grep -q "the receipt signing key $withdrawn_key was withdrawn in the administration" || { echo "::error::the entrypoint did not say that it replaced the withdrawn seed"; exit 1; }
          renewed_key=$(grep -oE 'Receipt signing key [0-9a-f]{8} registered and published' "$RUNNER_TEMP/nfnn/logs/backend.log" | tail -n 1 | cut -d' ' -f4)
          [ -n "$renewed_key" ] && [ "$renewed_key" != "$withdrawn_key" ] || { echo "::error::the backend did not register a new receipt signing key after the seed was replaced"; exit 1; }
          docker exec --privileged nfnn-backend sh -c 'tr "\0" "\n" < /proc/1/environ' | grep -qxE "RECEIPT_SIGNING_KEYS_WITHDRAWN=([0-9a-f]{8},)*$withdrawn_key(,[0-9a-f]{8})*" || { echo "::error::the entrypoint did not pass the withdrawn key $withdrawn_key to Java as RECEIPT_SIGNING_KEYS_WITHDRAWN"; exit 1; }
          listed=$(curl -fsS --max-time 10 http://localhost:8089/api/donations/receipt-keys | jq -r '.keys[] | .keyId + " " + .status' | sort)
          [ "$listed" = "$(printf '%s\n%s\n' "$withdrawn_key revoked" "$renewed_key active" | sort)" ] || { echo "::error::the receipt keys must list $withdrawn_key as revoked and $renewed_key as active (got $listed)"; exit 1; }
          seed_spellings="$RUNNER_TEMP/receipt-seed-spellings"
          for seed in "$withdrawn_seed" "$renewed_seed"; do
            echo "$seed"; echo "${seed%%=*}"; echo "${seed%%=*}" | tr '+/' '-_'; echo "$seed" | base64 -d | od -An -tx1 | tr -d ' \n'; echo
          done > "$seed_spellings"
          if grep -qiF -f "$seed_spellings" "$RUNNER_TEMP/nfnn/logs/backend.log" || docker logs nfnn-backend 2>&1 | grep -qiF -f "$seed_spellings"; then
            echo "::error::neither the withdrawn nor the new receipt signing seed may reach backend.log or the container log (Base64, unpadded, Base64url or hex)"
            exit 1
          fi
          rm -f "$seed_spellings"

      - name: Hashed bundles are cached for good and a missing file answers 404, never the app
        run: |
          docker cp nfnn-frontend:/usr/share/nginx/html "$RUNNER_TEMP/frontend-html"
          node frontend/scripts/probe-asset-caching.mjs http://localhost:8089 "$RUNNER_TEMP/frontend-html" frontend/nginx.conf

      - name: API, connector and discovery answers stay out of the browser's and Cloudflare's caches
        run: |
          echo "A donor of the stack signs in, so the probe can show that the cacheable answers are the same for a signed-in donor"
          probe_donor='{"type":"PERSON","name":"Sonda Mezipaměti","address":{"street":"Zkušební 1","city":"Tišnov","postalCode":"666 01"},"email":"sonda-mezipameti@example.cz","password":"a probe of the stack only","preferredLocale":"cs"}'
          curl -fsS --max-time 30 -o /dev/null -H 'X-Forwarded-For: 203.0.113.41' -H 'Content-Type: application/json' --data "$probe_donor" http://localhost:8089/api/donors/auth/register || { echo "::error::the probe donor's registration was refused"; exit 1; }
          docker exec nfnn-postgres psql -U novanadeje -d novanadeje -c "update donor set email_verified_at = now() where email = 'sonda-mezipameti@example.cz'" | grep -qx 'UPDATE 1' || { echo "::error::the probe donor was not registered"; exit 1; }
          token=$(curl -fsS --max-time 30 -H 'X-Forwarded-For: 203.0.113.41' -H 'Content-Type: application/json' --data '{"email":"sonda-mezipameti@example.cz","password":"a probe of the stack only"}' http://localhost:8089/api/donors/auth/login | jq -r '.accessToken')
          [ -n "$token" ] && [ "$token" != null ] || { echo "::error::the probe donor could not sign in"; exit 1; }
          echo "::add-mask::$token"
          PROBE_ACCESS_TOKEN="$token" node frontend/scripts/probe-edge-caching.mjs http://localhost:8089

      - name: Logs
        if: failure()
        run: |
          docker compose logs --no-color --tail 200
          for container in nfnn-postgres nfnn-backup nfnn-backend nfnn-mcp nfnn-frontend; do
            echo "$container: $(docker inspect -f '{{.State.Status}}, restarts {{.RestartCount}}, health {{json .State.Health}}' "$container" 2>&1)"
          done

      - name: Stop
        if: always()
        run: |
          docker rm -f nfnn-probe-mail > /dev/null 2>&1 || true
          docker compose down

  gate:
    if: always()
    needs: [changes, backend, frontend, mcp, main-recording, compare-v2, stack]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed, or the change touches no code and no job ran
        env:
          CODE: ${{ needs.changes.outputs.code }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          if [ "$CODE" = true ]; then expected=success; else expected=skipped; fi
          if ! jq -e --arg expected "$expected" '.changes.result == "success" and ([del(.changes)[] | .result] | all(. == $expected))' <<<"$NEEDS" > /dev/null; then
            echo "::error::every job must pass on a change to code (and none run on a change to docs/, .claude/ or Markdown only); see the results above"
            exit 1
          fi
