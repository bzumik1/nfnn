name: PR conflicts

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr-conflicts
  cancel-in-progress: true

jobs:
  sweep:
    name: Ask conflicting PRs to rebase
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the sweep from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: scripts/pr-labels.mjs
          sparse-checkout-cone-mode: false

      - name: Comment and label each PR that conflicts with main, unlabel each that no longer does
        if: hashFiles('scripts/pr-labels.mjs') != ''
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const { sweep } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/pr-labels.mjs`);
            await sweep({ github, context, core });
