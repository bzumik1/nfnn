name: PR labels

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-labels-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  size:
    name: Size and rebase labels
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the labeller from main, nothing of the PR ever runs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: scripts/pr-labels.mjs
          sparse-checkout-cone-mode: false

      - name: Label the PR by the lines it changes
        if: hashFiles('scripts/pr-labels.mjs') != ''
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const { syncSizeLabel } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/pr-labels.mjs`);
            await syncSizeLabel({ github, context, core });

      - name: Clear the rebase label once the push merges cleanly
        if: hashFiles('scripts/pr-labels.mjs') != ''
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const { clearSettledRebase } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/pr-labels.mjs`);
            await clearSettledRebase({ github, context, core });
