name: Release rehearsal

on:
  workflow_call:

permissions:
  contents: read

jobs:
  rehearsal:
    name: Zkouška vydání (${{ matrix.server }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        server: [deployed, latest]
    env:
      SERVER: ${{ matrix.server }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pull the published images of the older revision this lane starts from
        run: |
          deployed=$(tr -d '[:space:]' < .github/deployed-revision)
          echo "$deployed" | grep -qxE '[0-9a-f]{7}' || { echo "::error::.github/deployed-revision must hold the short SHA (7 hex digits) that nfnn_status reports on the server (got $deployed)"; exit 1; }
          if [ "$SERVER" = deployed ]; then
            revision=$deployed
          else
            docker pull -q ghcr.io/bzumik1/nfnn-mcp:latest > /dev/null || { echo "::error::ghcr.io/bzumik1/nfnn-mcp:latest cannot be pulled"; exit 1; }
            labelled=$(docker inspect -f '{{index .Config.Labels "org.opencontainers.image.revision"}}' ghcr.io/bzumik1/nfnn-mcp:latest)
            echo "$labelled" | grep -qxE '[0-9a-f]{40}' || { echo "::error::ghcr.io/bzumik1/nfnn-mcp:latest is labelled with revision '$labelled', not a commit"; exit 1; }
            revision=${labelled::7}
            if [ "$revision" = "$deployed" ] || [ "$revision" = "${GITHUB_SHA::7}" ]; then
              echo "::notice::latest is $revision, which is the revision the server runs (the deployed lane rehearses it) or this very commit, so this lane has nothing to rehearse"
              echo "REHEARSE=false" >> "$GITHUB_ENV"
              exit 0
            fi
          fi
          for image in backend frontend backup postgres mcp; do
            docker pull -q "ghcr.io/bzumik1/nfnn-$image:$revision" > /dev/null || { echo "::error::ghcr.io/bzumik1/nfnn-$image:$revision is not published: the $SERVER revision must name a commit of main that images.yml published"; exit 1; }
            labelled=$(docker inspect -f '{{index .Config.Labels "org.opencontainers.image.revision"}}' "ghcr.io/bzumik1/nfnn-$image:$revision")
            case "$labelled" in
              "$revision"*) ;;
              *) echo "::error::ghcr.io/bzumik1/nfnn-$image:$revision is labelled with revision $labelled"; exit 1 ;;
            esac
          done
          echo "The $SERVER lane starts from $revision: its five images set up the site, then the images built from this change take over and hand back"
          echo "DEPLOYED_REVISION=$revision" >> "$GITHUB_ENV"
          echo "REHEARSE=true" >> "$GITHUB_ENV"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.REHEARSE == 'true'
        with:
          node-version: "26"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: env.REHEARSE == 'true'

      - name: Build images
        if: env.REHEARSE == 'true'
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        env:
          CACHE_FROM_GHA: "true"
          CACHE_TO_GHA: "false"
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          source: .
          files: .github/docker-bake.hcl
          load: true

      - name: Prepare the compose files of the older images and of the candidate's, with the bank import pointed at a fake Fio bank over https that only these copies trust
        if: env.REHEARSE == 'true'
        run: |
          export FAKE_FIO="$RUNNER_TEMP/fake-fio"
          install -d -m 755 "$FAKE_FIO"
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj /CN=nfnn-fake-fio -addext subjectAltName=DNS:nfnn-fake-fio \
            -keyout "$FAKE_FIO/key.pem" -out "$FAKE_FIO/cert.pem" 2> /dev/null
          chmod 644 "$FAKE_FIO/key.pem" "$FAKE_FIO/cert.pem"
          docker run --rm --user root --entrypoint sh -v "$FAKE_FIO:/out" "ghcr.io/bzumik1/nfnn-backend:$DEPLOYED_REVISION" -c \
            'cp "$JAVA_HOME/lib/security/cacerts" /out/cacerts && keytool -importcert -noprompt -keystore /out/cacerts -storepass changeit -alias nfnn-fake-fio -file /out/cert.pem > /dev/null && chmod 644 /out/cacerts'
          for server in first second; do
            install -d -m 755 "$RUNNER_TEMP/$server/logs"
            sed "s#/DATA/AppData/nfnn#$RUNNER_TEMP/$server#g" deploy/compose.yml > "$RUNNER_TEMP/$server-candidate.yml"
            yq -i '.services.backup.environment.POLL_SECONDS = "1"' "$RUNNER_TEMP/$server-candidate.yml"
            yq -i '.services.backend.environment.APP_DONATIONS_FIO_BASEURI = "https://nfnn-fake-fio:8443/v1/rest"' "$RUNNER_TEMP/$server-candidate.yml"
            yq -i '.services.backend.environment.JAVA_TOOL_OPTIONS += " -Djavax.net.ssl.trustStore=/fake-fio/cacerts -Djavax.net.ssl.trustStorePassword=changeit"' "$RUNNER_TEMP/$server-candidate.yml"
            yq -i '.services.backend.volumes += [strenv(FAKE_FIO) + "/cacerts:/fake-fio/cacerts:ro"]' "$RUNNER_TEMP/$server-candidate.yml"
            yq -i '.services.backend.extra_hosts = ["fioapi.fio.cz:192.0.2.1"]' "$RUNNER_TEMP/$server-candidate.yml"
          done
          sed -E "s#(image: ghcr\.io/bzumik1/nfnn-[a-z]+):latest\$#\1:$DEPLOYED_REVISION#" "$RUNNER_TEMP/first-candidate.yml" > "$RUNNER_TEMP/first-deployed.yml"
          [ "$(grep -c ":$DEPLOYED_REVISION\$" "$RUNNER_TEMP/first-deployed.yml")" = 5 ] || { echo "::error::the compose file of the older images does not name all five images at $DEPLOYED_REVISION"; exit 1; }
          echo "JOURNEY_STATE=$RUNNER_TEMP/journey.json" >> "$GITHUB_ENV"
          token=$(openssl rand -hex 24)
          echo "::add-mask::$token"
          echo "FAKE_FIO_TOKEN=$token" >> "$GITHUB_ENV"
          cat > "$RUNNER_TEMP/rehearsal.sh" <<'SCRIPT'
          backup_and_test_restore() {
            name=$1
            backups="$RUNNER_TEMP/first/backups"
            docker exec nfnn-backend sh -c "touch /backups/requests/$name.backup"
            for _ in $(seq 60); do
              grep -q "^request=$name\$" "$backups/status/backup" 2> /dev/null && break
              sleep 1
            done
            grep -q "^request=$name\$" "$backups/status/backup" && grep -q '^outcome=ok$' "$backups/status/backup" || { echo "::error::the backup $name was not written"; cat "$backups/status/backup"; return 1; }
            docker exec nfnn-backend sh -c "touch /backups/requests/$name.test-restore"
            for _ in $(seq 120); do
              grep -q "^request=$name\$" "$backups/status/test-restore" 2> /dev/null && break
              sleep 1
            done
            grep -q "^request=$name\$" "$backups/status/test-restore" && grep -q '^outcome=ok$' "$backups/status/test-restore" || { echo "::error::the test restore of the backup $name failed"; cat "$backups/status/test-restore"; return 1; }
            echo "The backup $name ($(sed -n 's/^file=//p' "$backups/status/backup")) restores in a test database with as many rows in every table: $(sed -n 's/^tables=//p' "$backups/status/test-restore") tables"
          }
          SCRIPT

      - name: The older images set up a site with the bank import, issue receipts, import and pair gifts from the fake bank and take a backup
        if: env.REHEARSE == 'true'
        env:
          COMPOSE_FILE: ${{ runner.temp }}/first-deployed.yml
        run: |
          docker compose up -d --wait --wait-timeout 300
          docker run -d --name nfnn-probe-mail --network nfnn-edge -p 127.0.0.1:8025:8025 axllent/mailpit:v1.31.5 > /dev/null
          docker run -d --name nfnn-fake-fio --network nfnn-edge -p 127.0.0.1:8090:8090 --user node --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true -e FAKE_FIO_TOKEN \
            -e TLS_KEY=/tls/key.pem -e TLS_CERT=/tls/cert.pem -v "$RUNNER_TEMP/fake-fio:/tls:ro" \
            -v "$GITHUB_WORKSPACE/scripts/fake-fio.mjs:/fake-fio.mjs:ro" node:26-alpine node /fake-fio.mjs > /dev/null
          for _ in $(seq 30); do
            curl -fsS -o /dev/null --max-time 2 http://127.0.0.1:8025/api/v1/messages 2> /dev/null \
              && curl -fsS -o /dev/null --max-time 2 http://127.0.0.1:8090/requests 2> /dev/null && break
            sleep 1
          done
          curl -fsS -o /dev/null --max-time 2 http://127.0.0.1:8090/requests || { echo "::error::the fake Fio bank did not start"; docker logs nfnn-fake-fio; exit 1; }
          node scripts/stack-journey.mjs setup --state "$JOURNEY_STATE"
          node scripts/stack-journey.mjs receipts --state "$JOURNEY_STATE"
          node scripts/stack-journey.mjs bank --phase deployed --state "$JOURNEY_STATE"
          logs="$RUNNER_TEMP/first/logs"
          [ "$(scripts/backend-log.sh "$logs" | grep -c "Backend revision $DEPLOYED_REVISION is ready")" -ge 1 ] || { echo "::error::the backend of the older images did not report revision $DEPLOYED_REVISION"; exit 1; }
          backups="$RUNNER_TEMP/first/backups"
          docker exec nfnn-backend sh -c 'touch /backups/requests/before-upgrade.backup'
          for _ in $(seq 60); do
            grep -q '^request=before-upgrade$' "$backups/status/backup" 2> /dev/null && break
            sleep 1
          done
          grep -q '^request=before-upgrade$' "$backups/status/backup" && grep -q '^outcome=ok$' "$backups/status/backup" || { echo "::error::the backup before the upgrade was not written"; cat "$backups/status/backup"; exit 1; }
          dump=$(sed -n 's/^file=//p' "$backups/status/backup")
          echo "The backup before the upgrade is $dump"
          echo "BACKUP_BEFORE_UPGRADE=$dump" >> "$GITHUB_ENV"

      - name: The candidate's images start on that database, the journeys pass, the import pairs new gifts, and its backup restores in a test database
        if: env.REHEARSE == 'true'
        env:
          COMPOSE_FILE: ${{ runner.temp }}/first-candidate.yml
        run: |
          . "$RUNNER_TEMP/rehearsal.sh"
          logs="$RUNNER_TEMP/first/logs"
          before=$(scripts/backend-log.sh "$logs" | wc -l)
          docker compose up -d --wait --wait-timeout 300
          scripts/backend-log.sh "$logs" | tail -n "+$((before + 1))" | sed -n '/ Starting AppApplication /,$p' > "$RUNNER_TEMP/candidate-start.log"
          grep -q 'Backend revision dev is ready' "$RUNNER_TEMP/candidate-start.log" || { echo "::error::the candidate's backend did not start on the database of the older images"; exit 1; }
          for container in nfnn-postgres nfnn-backup nfnn-backend nfnn-mcp nfnn-frontend; do
            [ "$(docker inspect -f '{{.RestartCount}}' "$container")" = 0 ] || { echo "::error::$container restarted while the candidate's images took over"; exit 1; }
          done
          if grep -E '^[0-9T:.+-]+ +ERROR ' "$RUNNER_TEMP/candidate-start.log"; then
            echo "::error::the candidate's backend logged an error when it started over the data of the older images"
            exit 1
          fi
          echo "Changesets the candidate applied to the older images' database:"
          grep -oE 'ChangeSet db/changelog/[^ ]+ ran successfully' "$RUNNER_TEMP/candidate-start.log" | cut -d' ' -f2 || echo "none"
          node scripts/stack-journey.mjs check --issue candidate --state "$JOURNEY_STATE"
          node scripts/stack-journey.mjs bank --phase candidate --state "$JOURNEY_STATE"
          backup_and_test_restore candidate

      - name: The older images start again on the candidate's schema, the journeys pass, the import pairs again, and their backup of that schema restores in a test database
        if: env.REHEARSE == 'true'
        env:
          COMPOSE_FILE: ${{ runner.temp }}/first-deployed.yml
        run: |
          . "$RUNNER_TEMP/rehearsal.sh"
          logs="$RUNNER_TEMP/first/logs"
          docker compose up -d --wait --wait-timeout 300
          [ "$(scripts/backend-log.sh "$logs" | grep -c "Backend revision $DEPLOYED_REVISION is ready")" -ge 3 ] || { echo "::error::the older images' backend did not start again after the candidate's"; exit 1; }
          node scripts/stack-journey.mjs check --state "$JOURNEY_STATE"
          answer=$(curl -sS --max-time 10 -o /dev/null -w '%{http_code} %{content_type}' http://localhost:8089/ngsw.json)
          case "$answer" in
            "404 "* | "200 application/json"*) ;;
            *) echo "::error::after the rollback /ngsw.json must answer 404 (an image before slice 2.4, so every installed service worker removes itself) or 200 JSON (2.4 or later), got $answer"; exit 1 ;;
          esac
          node scripts/stack-journey.mjs bank --phase rollback --state "$JOURNEY_STATE"
          backup_and_test_restore rollback

      - name: The older images restore the backup taken before the upgrade, the journeys pass and the import brings back the gifts paired since
        if: env.REHEARSE == 'true'
        env:
          COMPOSE_FILE: ${{ runner.temp }}/first-deployed.yml
        run: |
          backups="$RUNNER_TEMP/first/backups"
          restore="$RUNNER_TEMP/first/restore"
          docker compose stop backend backup
          sudo cp "$backups/$BACKUP_BEFORE_UPGRADE" "$restore/before-upgrade.force.dump.age"
          docker compose up -d --wait --wait-timeout 300
          for _ in $(seq 60); do
            [ -f "$restore/before-upgrade.force.dump.age.done" ] && break
            sleep 1
          done
          [ -f "$restore/before-upgrade.force.dump.age.done" ] && grep -q '^outcome=ok$' "$backups/status/restore" || { echo "::error::the backup taken before the upgrade was not restored"; cat "$backups/status/restore"; sudo ls -la "$restore"; exit 1; }
          docker compose up -d --wait --wait-timeout 300
          node scripts/stack-journey.mjs forget-after-backup --state "$JOURNEY_STATE"
          node scripts/stack-journey.mjs check --restored --state "$JOURNEY_STATE"
          node scripts/stack-journey.mjs bank --phase restored --state "$JOURNEY_STATE"

      - name: A second server set up from the first server's backup adopts its receipt signing key and the receipts verify there
        if: env.REHEARSE == 'true'
        run: |
          first="$RUNNER_TEMP/first"
          second="$RUNNER_TEMP/second"
          COMPOSE_FILE="$RUNNER_TEMP/first-candidate.yml" docker compose up -d --wait --wait-timeout 300
          docker exec nfnn-backend sh -c 'touch /backups/requests/for-the-second-server.backup'
          for _ in $(seq 60); do
            grep -q '^request=for-the-second-server$' "$first/backups/status/backup" 2> /dev/null && break
            sleep 1
          done
          grep -q '^outcome=ok$' "$first/backups/status/backup" || { echo "::error::the backup for the second server was not written"; exit 1; }
          sudo cp "$first/backups/$(sed -n 's/^file=//p' "$first/backups/status/backup")" "$RUNNER_TEMP/first-server.dump.age"
          sudo sh -c "grep -m 1 '^AGE-SECRET-KEY-' '$first/secrets/backup-key'" > "$RUNNER_TEMP/first-server.key"
          chmod 600 "$RUNNER_TEMP/first-server.key"
          sudo chown "$(id -u)" "$RUNNER_TEMP/first-server.dump.age"
          echo "::add-mask::$(cat "$RUNNER_TEMP/first-server.key")"
          first_key=$(jq -r '.receipts[0].keyId' "$JOURNEY_STATE")
          docker rm -f nfnn-probe-mail nfnn-fake-fio > /dev/null
          COMPOSE_FILE="$RUNNER_TEMP/first-candidate.yml" docker compose down
          export COMPOSE_FILE="$RUNNER_TEMP/second-candidate.yml"
          docker compose up -d --wait --wait-timeout 300
          [ "$(sudo cat "$second/secrets/settings-key")" != "$(sudo cat "$first/secrets/settings-key")" ] || { echo "::error::the second server must start with secrets of its own"; exit 1; }
          cp "$JOURNEY_STATE" "$RUNNER_TEMP/second-journey.json"
          node scripts/stack-journey.mjs restore-setup --dump "$RUNNER_TEMP/first-server.dump.age" --key "$RUNNER_TEMP/first-server.key" --state "$RUNNER_TEMP/second-journey.json"
          rm -f "$RUNNER_TEMP/first-server.key"
          docker compose up -d --wait --wait-timeout 300
          scripts/backend-log.sh "$second/logs" | grep "Receipt signing key $first_key from a restored backup is sealed again and published" > /dev/null || { echo "::error::the second server did not adopt the first server's receipt signing key $first_key"; grep -i 'receipt signing key' "$second/logs/backend.log"; exit 1; }
          [ "$(docker exec nfnn-postgres psql -U novanadeje -d novanadeje -tA -c "select count(*) from admin_action where action = 'ADOPT_RECEIPT_SIGNING_KEY' and details like '%$first_key%'")" = 1 ] || { echo "::error::the adoption of $first_key is not in the audit trail exactly once"; exit 1; }
          [ "$(sudo grep -m 1 '^AGE-SECRET-KEY-' "$second/secrets/backup-key")" = "$(sudo grep -m 1 '^AGE-SECRET-KEY-' "$first/secrets/backup-key")" ] || { echo "::error::the second server did not adopt the backup key the backup came with"; exit 1; }
          if scripts/backend-log.sh "$second/logs" | grep -E "Receipt signing key [0-9a-f]{8} (is sealed by the settings key of another server|fails its seal)"; then
            echo "::error::the second server refused a receipt signing key"
            exit 1
          fi
          node scripts/stack-journey.mjs adopted --state "$RUNNER_TEMP/second-journey.json"
          docker restart nfnn-backend
          docker compose up -d --wait --wait-timeout 300
          [ "$(scripts/backend-log.sh "$second/logs" | grep -c "Receipt signing key $first_key from a restored backup is sealed again and published")" = 1 ] || { echo "::error::a later start adopted the key again, so a restore confirmed more than one adoption"; exit 1; }
          node scripts/stack-journey.mjs adopted --state "$RUNNER_TEMP/second-journey.json"

      - name: Logs
        if: failure()
        run: |
          docker compose -f "$RUNNER_TEMP/first-candidate.yml" logs --no-color --tail 200 || true
          docker compose -f "$RUNNER_TEMP/second-candidate.yml" logs --no-color --tail 200 || true
          docker logs nfnn-fake-fio 2>&1 | tail -n 100 || true
          for server in first second; do
            [ -f "$RUNNER_TEMP/$server/logs/backend.log" ] && { echo "== $server backend.log"; tail -n 80 "$RUNNER_TEMP/$server/logs/backend.log"; }
            [ -f "$RUNNER_TEMP/$server/logs/backup.log" ] && { echo "== $server backup.log"; tail -n 40 "$RUNNER_TEMP/$server/logs/backup.log"; }
          done
          true

      - name: Stop
        if: always()
        run: |
          docker rm -f nfnn-probe-mail nfnn-fake-fio > /dev/null 2>&1 || true
          docker compose -f "$RUNNER_TEMP/second-candidate.yml" down > /dev/null 2>&1 || true
          docker compose -f "$RUNNER_TEMP/first-candidate.yml" down > /dev/null 2>&1 || true
