<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

/* ─── TWEAK DEFAULTS ─────────────────────────────────────── */
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "heroStyle": "fullscreen",
  "accentColor": "#2563EB",
  "showStats": true,
  "roundedCards": true
}/*EDITMODE-END*/;

/* ─── TWEAKS HOOK ────────────────────────────────────────── */
function useTweaks(defaults) {
  const [values, setValues] = useState(defaults);
  const setTweak = useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues(prev => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
  }, []);
  return [values, setTweak];
}

/* ─── TWEAKS PANEL ───────────────────────────────────────── */
function TweaksPanel({ children }) {
  const [open, setOpen] = useState(false);
  const panelRef = useRef(null);
  const posRef = useRef({ right: 16, bottom: 16 });

  useEffect(() => {
    const onMsg = (e) => {
      if (e?.data?.type === '__activate_edit_mode') setOpen(true);
      else if (e?.data?.type === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = panelRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      posRef.current = {
        right: Math.max(8, startRight - (ev.clientX - sx)),
        bottom: Math.max(8, startBottom - (ev.clientY - sy)),
      };
      panel.style.right = posRef.current.right + 'px';
      panel.style.bottom = posRef.current.bottom + 'px';
    };
    const up = () => { window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up); };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <div ref={panelRef} className="twk-panel" style={{ right: posRef.current.right, bottom: posRef.current.bottom }}>
      <div className="twk-hd" onMouseDown={onDragStart}>
        <b>Tweaks</b>
        <button className="twk-x" onClick={dismiss}>✕</button>
      </div>
      <div className="twk-body">{children}</div>
    </div>
  );
}

function TweakSection({ label, children }) {
  return <><div className="twk-sect">{label}</div>{children}</>;
}

function TweakRadio({ label, value, options, onChange }) {
  const opts = options.map(o => typeof o === 'object' ? o : { value: o, label: o });
  const idx = Math.max(0, opts.findIndex(o => o.value === value));
  const n = opts.length;
  return (
    <div className="twk-row">
      <div className="twk-lbl">{label}</div>
      <div className="twk-seg">
        <div className="twk-seg-thumb" style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`, width: `calc((100% - 4px) / ${n})` }} />
        {opts.map(o => (
          <button key={o.value} onClick={() => onChange(o.value)}>{o.label}</button>
        ))}
      </div>
    </div>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row-h twk-row">
      <div className="twk-lbl">{label}</div>
      <button className="twk-toggle" data-on={value ? '1' : '0'} onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakColor({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl">{label}</div>
      <input type="color" className="twk-swatch" value={value} onChange={e => onChange(e.target.value)} />
    </div>
  );
}

/* ─── LOGO ───────────────────────────────────────────────── */
function LogoSVG({ color = "#2563EB", size = 32 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 40 40" fill="none">

    </svg>
  );
}

/* ─── AUTH STATE (global) ────────────────────────────────── */
const authState = { user: null, listeners: [] };
function useAuth() {
  const [user, setUser] = useState(authState.user);
  useEffect(() => {
    const cb = (u) => setUser(u);
    authState.listeners.push(cb);
    return () => { authState.listeners = authState.listeners.filter(l => l !== cb); };
  }, []);
  const login = (u) => { authState.user = u; authState.listeners.forEach(l => l(u)); };
  const logout = () => { authState.user = null; authState.listeners.forEach(l => l(null)); };
  return { user, login, logout };
}

/* ─── FAKE PAYMENTS DATA ─────────────────────────────────── */
const fakePayments = [

  { id: 2, date: '10. 01. 2026', amount: 1000, purpose: 'Projekt Dominik', status: 'Přijato' },

/* ─── RESET FORM ─────────────────────────────────────────── */
function ResetForm({ accent, onBack }) {
  const [email, setEmail] = useState('');
  const [sent, setSent] = useState(false);
  const [loading, setLoading] = useState(false);

  const handleSubmit = (e) => {
    e.preventDefault();
    setLoading(true);
    setTimeout(() => { setSent(true); setLoading(false); }, 1000);
  };

  return sent ? (
    <div style={{ textAlign: 'center', padding: '20px 0' }}>
      <div style={{ width: 56, height: 56, background: '#eff6ff', borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 24, margin: '0 auto 16px' }}>✉️</div>
      <h3 style={{ fontFamily: 'Playfair Display', fontSize: 20, fontWeight: 700, color: '#1a1a2e', marginBottom: 10 }}>E-mail odeslán!</h3>

      </p>
      <button onClick={onBack} style={{ background: accent, color: '#fff', border: 'none', padding: '12px 28px', borderRadius: 50, fontWeight: 700, fontSize: 14, cursor: 'pointer' }}>

      </button>
    </div>
  ) : (
    <>
      <div style={{ marginBottom: 24 }}>
        <button onClick={onBack} style={{ background: 'none', border: 'none', color: accent, fontWeight: 600, fontSize: 13, cursor: 'pointer', padding: 0, fontFamily: 'Inter', display: 'flex', alignItems: 'center', gap: 4 }}>
          ← Zpět na přihlášení
        </button>
      </div>
      <h3 style={{ fontFamily: 'Playfair Display', fontSize: 22, fontWeight: 700, color: '#1a1a2e', marginBottom: 8 }}>Obnovení hesla</h3>
      <p style={{ color: '#6b7280', fontSize: 14, lineHeight: 1.6, marginBottom: 20 }}>
        Zadejte svůj e-mail a zašleme vám odkaz pro obnovení hesla.
      </p>
      <form onSubmit={handleSubmit} style={{ display: 'grid', gap: 14 }}>
        <div>
          <label style={{ display: 'block', fontSize: 13, fontWeight: 600, color: '#374151', marginBottom: 6 }}>E-mail</label>
          <input type="email" placeholder="vas@email.cz" value={email} onChange={e => setEmail(e.target.value)} required
            style={{ width: '100%', padding: '12px 16px', borderRadius: 12, border: '1.5px solid #e5e7eb', fontSize: 15, outline: 'none', fontFamily: 'Inter', transition: 'border-color 0.2s' }}
            onFocus={e => e.target.style.borderColor = accent}
            onBlur={e => e.target.style.borderColor = '#e5e7eb'}
          />
        </div>
        <button type="submit" disabled={loading} style={{
          background: accent, color: '#fff', border: 'none', padding: '14px',
          borderRadius: 50, fontWeight: 700, fontSize: 15, cursor: 'pointer',
          boxShadow: '0 6px 20px rgba(37,99,235,0.35)', opacity: loading ? 0.7 : 1,
        }}>{loading ? 'Odesílám…' : 'Odeslat odkaz'}</button>
      </form>
    </>
  );
}

/* ─── LOGIN MODAL ────────────────────────────────────────── */
function LoginModal({ accent, onClose, onLogin }) {
  const [mode, setMode] = useState('login'); // 'login' | 'register' | 'reset'
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [name, setName] = useState('');
  const [error, setError] = useState('');
  const [loading, setLoading] = useState(false);

  const handleSubmit = (e) => {
    e.preventDefault();
    setLoading(true);
    setError('');
    setTimeout(() => {
      if (email && password.length >= 3 && (mode === 'login' || name)) {
        onLogin({ name: mode === 'register' ? name : email.split('@')[0], email });
        onClose();
      } else {
        setError(mode === 'login' ? 'Nesprávné přihlašovací údaje.' : 'Vyplňte prosím všechna pole.');
        setLoading(false);
      }
    }, 800);
  };

  const isLogin = mode === 'login';

  return (
    <div style={{
      position: 'fixed', inset: 0, zIndex: 200,
      background: 'rgba(10,15,40,0.6)', backdropFilter: 'blur(6px)',
      display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 20,
    }} onClick={onClose}>
      <div onClick={e => e.stopPropagation()} style={{
        background: '#fff', borderRadius: 24, padding: '36px 40px',
        width: '100%', maxWidth: 420,
        boxShadow: '0 24px 80px rgba(0,0,0,0.2)',
        animation: 'fadeInUp 0.3s ease both',
      }}>
        {/* Logo */}
        <div style={{ textAlign: 'center', marginBottom: 24 }}>
          <img src="images/logo.svg" alt="Logo" style={{ height: 36, marginBottom: 16 }} />
        </div>

        {/* Tab přepínač – pouze pro login/register */}
        {mode !== 'reset' && (
          <>
          <div style={{ display: 'flex', background: '#f0f4ff', borderRadius: 50, padding: 4, marginBottom: 28 }}>
          {[
            { id: 'login', label: 'Přihlásit se' },
            { id: 'register', label: 'Registrace' },
          ].map(tab => (
            <button key={tab.id} onClick={() => { setMode(tab.id); setError(''); }} style={{
              flex: 1, padding: '10px', borderRadius: 50, border: 'none', cursor: 'pointer',
              fontFamily: 'Inter', fontWeight: 600, fontSize: 14, transition: 'all 0.2s',
              background: mode === tab.id ? accent : 'transparent',
              color: mode === tab.id ? '#fff' : '#6b7280',
              boxShadow: mode === tab.id ? '0 4px 12px rgba(37,99,235,0.3)' : 'none',
            }}>{tab.label}</button>
          ))}
          </div>
          <p style={{ color: '#6b7280', fontSize: 14, textAlign: 'center', marginBottom: 20, marginTop: -12 }}>
            {isLogin ? 'Přístup do vašeho přehledu příspěvků' : 'Vytvořte si účet dárce'}
          </p>
          </>
        )}
        {mode === 'reset' && <ResetForm accent={accent} onBack={() => setMode('login')} />}

        {mode !== 'reset' && (
          <form onSubmit={handleSubmit} style={{ display: 'grid', gap: 14 }}>
          {!isLogin && (
            <div>
              <label style={{ display: 'block', fontSize: 13, fontWeight: 600, color: '#374151', marginBottom: 6 }}>Jméno a příjmení</label>
              <input type="text" placeholder="Jan Novák" value={name} onChange={e => setName(e.target.value)} required={!isLogin}
                style={{ width: '100%', padding: '12px 16px', borderRadius: 12, border: '1.5px solid #e5e7eb', fontSize: 15, outline: 'none', fontFamily: 'Inter', transition: 'border-color 0.2s' }}
                onFocus={e => e.target.style.borderColor = accent}
                onBlur={e => e.target.style.borderColor = '#e5e7eb'}
              />
            </div>
          )}
          {[
            { id: 'email', label: 'E-mail', type: 'email', placeholder: 'vas@email.cz', val: email, set: setEmail },
            { id: 'pass', label: 'Heslo', type: 'password', placeholder: '••••••••', val: password, set: setPassword },
          ].map(f => (
            <div key={f.id}>
              <label style={{ display: 'block', fontSize: 13, fontWeight: 600, color: '#374151', marginBottom: 6 }}>{f.label}</label>
              <input type={f.type} placeholder={f.placeholder} value={f.val} onChange={e => f.set(e.target.value)} required
                style={{ width: '100%', padding: '12px 16px', borderRadius: 12, border: '1.5px solid #e5e7eb', fontSize: 15, outline: 'none', fontFamily: 'Inter', transition: 'border-color 0.2s' }}
                onFocus={e => e.target.style.borderColor = accent}
                onBlur={e => e.target.style.borderColor = '#e5e7eb'}
              />
            </div>
          ))}
          {error && <p style={{ color: '#ef4444', fontSize: 13, margin: 0 }}>{error}</p>}
          <button type="submit" disabled={loading} style={{
            background: accent, color: '#fff', border: 'none', padding: '14px',

  );
}

/* ─── PDF RECEIPT ────────────────────────────────────────── */
function Receipt({ payment, user, accent, onClose }) {

          {/* Note */}
          <p style={{ fontSize: 13, color: '#6b7280', lineHeight: 1.7, marginBottom: 24, padding: '14px 18px', background: '#f8faff', borderRadius: 10, borderLeft: `3px solid ${accent}` }}>
            Tento dokument potvrzuje přijetí {isSummary ? 'darů' : 'vašeho daru'} nadačním fondem Nová naděje. Dar je daňově odečitatelný dle § 15 odst. 1 zákona č. 586/1992 Sb.
          </p>
          <div style={{ display: 'flex', gap: 12 }}>
            <button onClick={onClose} style={{
              flex: 1, background: accent, color: '#fff', border: 'none',
              padding: '13px', borderRadius: 50, fontWeight: 700, fontSize: 14, cursor: 'pointer',
              boxShadow: '0 4px 14px rgba(37,99,235,0.3)',
            }}>Zavřít</button>
            <button onClick={() => window.print()} style={{
              flex: 1, background: '#f0f4ff', color: accent, border: `1.5px solid ${accent}33`,
              padding: '13px', borderRadius: 50, fontWeight: 700, fontSize: 14, cursor: 'pointer',
            }}>Tisk / PDF</button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ─── NAV ────────────────────────────────────────────────── */
function Nav({ accent, onLoginClick, user, onLogout }) {
  const [scrolled, setScrolled] = useState(false);
  const [menuOpen, setMenuOpen] = useState(false);

  useEffect(() => {
    const h = () => setScrolled(window.scrollY > 50);
    window.addEventListener('scroll', h);
    return () => window.removeEventListener('scroll', h);
  }, []);

  const navLinks = [
    { label: 'Domů', href: '#home' },
    { label: 'O nás', href: '#about' },
    { label: 'Projekty', href: '#projects' },
    { label: 'Aktuality', href: '#news' },
    { label: 'Kontakt', href: '#contact' },
  ];

  const close = () => setMenuOpen(false);

  return (
    <>
    <nav style={{
      position: 'fixed', top: 0, left: 0, right: 0, zIndex: 100,
      background: scrolled || menuOpen ? 'rgba(255,255,255,0.97)' : 'transparent',
      boxShadow: scrolled || menuOpen ? '0 2px 20px rgba(0,0,0,0.08)' : 'none',
      backdropFilter: scrolled || menuOpen ? 'blur(12px)' : 'none',
      transition: 'all 0.35s ease',
    }}>
      <div style={{ maxWidth: 1200, margin: '0 auto', padding: '0 20px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', height: 72 }}>
        <a href="#home" style={{ display: 'flex', alignItems: 'center', textDecoration: 'none' }}>
          <img src="images/logo.svg" alt="Nová naděje – nadační fond" style={{ height: 40, width: 'auto' }} />
        </a>

        {/* Desktop links */}
        <div style={{ display: 'flex', alignItems: 'center', gap: 4 }} className="desktop-nav">
          {navLinks.map(l => (
            <a key={l.href} href={l.href} style={{
              color: scrolled ? '#374151' : '#fff', textDecoration: 'none',
              fontSize: 14, fontWeight: 500, padding: '8px 14px', borderRadius: 8,
              transition: 'background 0.2s',
              textShadow: scrolled ? 'none' : '0 1px 4px rgba(0,0,0,0.4)',
            }}
            onMouseEnter={e => e.currentTarget.style.background = scrolled ? '#f0f4ff' : 'rgba(255,255,255,0.15)'}
            onMouseLeave={e => e.currentTarget.style.background = 'transparent'}
            >{l.label}</a>
          ))}
          <a href="#donate" style={{
            background: accent, color: '#fff', textDecoration: 'none',
            padding: '10px 22px', borderRadius: 50, fontSize: 14, fontWeight: 700,
            marginLeft: 8, boxShadow: '0 4px 14px rgba(37,99,235,0.35)',
          }}>Finanční příspěvek</a>
          {user ? (
            <button onClick={onLogout} style={{
              background: 'rgba(255,255,255,0.15)', backdropFilter: 'blur(10px)',
              border: '1.5px solid rgba(255,255,255,0.45)', color: '#fff',
              padding: '9px 18px', borderRadius: 50, fontSize: 13, fontWeight: 600, cursor: 'pointer',
              marginLeft: 8, transition: 'all 0.2s',
            }}>👤 {user.name}</button>
          ) : (
            <button onClick={onLoginClick} style={{
              background: scrolled ? '#fff' : 'rgba(255,255,255,0.15)',
              backdropFilter: scrolled ? 'none' : 'blur(10px)',
              border: `1.5px solid ${scrolled ? accent : 'rgba(255,255,255,0.45)'}`,
              color: scrolled ? accent : '#fff',
              padding: '9px 18px', borderRadius: 50, fontSize: 13, fontWeight: 600, cursor: 'pointer',
              marginLeft: 8, transition: 'all 0.2s',
            }}
            onMouseEnter={e => e.currentTarget.style.background = scrolled ? '#eff6ff' : 'rgba(255,255,255,0.25)'}
            onMouseLeave={e => e.currentTarget.style.background = scrolled ? '#fff' : 'rgba(255,255,255,0.15)'}
            >Přihlásit se</button>
          )}
        </div>

        {/* Hamburger button */}
        <button className="mobile-menu-btn" onClick={() => setMenuOpen(!menuOpen)} style={{
          background: 'none', border: 'none', cursor: 'pointer', padding: 8,
          display: 'flex', flexDirection: 'column', justifyContent: 'center', gap: 5,
        }}>
          <span style={{ display: 'block', width: 24, height: 2, background: scrolled || menuOpen ? '#1a1a2e' : '#fff', borderRadius: 2, transition: 'all 0.3s', transform: menuOpen ? 'rotate(45deg) translate(5px, 5px)' : 'none' }} />
          <span style={{ display: 'block', width: 24, height: 2, background: scrolled || menuOpen ? '#1a1a2e' : '#fff', borderRadius: 2, transition: 'all 0.3s', opacity: menuOpen ? 0 : 1 }} />
          <span style={{ display: 'block', width: 24, height: 2, background: scrolled || menuOpen ? '#1a1a2e' : '#fff', borderRadius: 2, transition: 'all 0.3s', transform: menuOpen ? 'rotate(-45deg) translate(5px, -5px)' : 'none' }} />
        </button>
      </div>
    </nav>

    {/* Mobile dropdown menu */}
    {menuOpen && (
      <div className="mobile-menu" style={{
        position: 'fixed', top: 72, left: 0, right: 0, zIndex: 99,
        background: '#fff', padding: '16px 20px 24px',
        boxShadow: '0 8px 24px rgba(0,0,0,0.1)',
        display: 'flex', flexDirection: 'column', gap: 2,
      }}>
        {navLinks.map(l => (
          <a key={l.href} href={l.href} onClick={close} style={{
            color: '#1a1a2e', textDecoration: 'none', fontSize: 17, fontWeight: 500,
            padding: '13px 8px', borderBottom: '1px solid #f0f4ff', display: 'block',
          }}>{l.label}</a>
        ))}
        <a href="#donate" onClick={close} style={{
          display: 'block', background: accent, color: '#fff', textDecoration: 'none',
          textAlign: 'center', padding: '14px', borderRadius: 50,
          fontSize: 16, fontWeight: 700, marginTop: 14,
          boxShadow: '0 4px 14px rgba(37,99,235,0.3)',
        }}>Finanční příspěvek</a>
        <button onClick={() => { close(); user ? onLogout() : onLoginClick(); }} style={{
          display: 'block', width: '100%', background: '#f0f4ff', color: accent,
          border: `1.5px solid ${accent}33`, textAlign: 'center', padding: '13px', borderRadius: 50,
          fontSize: 15, fontWeight: 600, marginTop: 8, cursor: 'pointer',
        }}>{user ? `Odhlásit (${user.name})` : '👤 Přihlásit se'}</button>
      </div>
    )}
    </>
  );
}

              { label: 'IČO', value: '12345678', icon: '🏛' },
            ].map((item, i) => (
              <div key={i} style={{ display: 'flex', gap: 18, alignItems: 'flex-start' }}>
                <div style={{ width: 46, height: 46, background: accent, borderRadius: 12, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 18, flexShrink: 0 }}>{item.icon}</div>
                <div>
                  <div style={{ color: 'rgba(255,255,255,0.45)', fontSize: 11, fontWeight: 700, letterSpacing: '0.1em', textTransform: 'uppercase', marginBottom: 4 }}>{item.label}</div>
                  <div style={{ color: '#fff', fontSize: 16, fontWeight: 500 }}>{item.value}</div>
                </div>
              </div>
            ))}
          </div>
        </div>

        <div style={{ background: '#fff', borderRadius: r, padding: '40px' }}>
          {sent ? (
            <div style={{ textAlign: 'center', padding: '40px 0' }}>
              <div style={{ width: 64, height: 64, background: '#eff6ff', borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 28, margin: '0 auto 20px' }}>✓</div>
              <h3 style={{ fontFamily: 'Playfair Display', fontSize: 24, fontWeight: 700, marginBottom: 12, color: '#1a1a2e' }}>Zpráva odeslána!</h3>
              <p style={{ color: '#6b7280', fontSize: 15, lineHeight: 1.6 }}>Děkujeme za váš zájem. Ozveme se co nejdříve.</p>
              <button onClick={() => setSent(false)} style={{ marginTop: 24, background: accent, color: '#fff', border: 'none', padding: '12px 28px', borderRadius: 50, fontWeight: 600, cursor: 'pointer', fontSize: 14 }}>Odeslat další zprávu</button>
            </div>
          ) : (
            <form onSubmit={e => { e.preventDefault(); setSent(true); }} style={{ display: 'grid', gap: 18 }}>
              <h3 style={{ fontFamily: 'Playfair Display', fontSize: 22, fontWeight: 700, color: '#1a1a2e', marginBottom: 4 }}>Napište nám</h3>
              {[
                { id: 'name', label: 'Jméno a příjmení', type: 'text', placeholder: 'Jan Novák' },
                { id: 'email', label: 'E-mailová adresa', type: 'email', placeholder: 'jan@example.com' },
              ].map(f => (
                <div key={f.id}>
                  <label style={{ display: 'block', fontSize: 13, fontWeight: 600, color: '#374151', marginBottom: 6 }}>{f.label}</label>
                  <input
                    type={f.type} placeholder={f.placeholder} required
                    value={form[f.id]} onChange={e => setForm({ ...form, [f.id]: e.target.value })}
                    style={{ width: '100%', padding: '12px 16px', borderRadius: rounded ? 10 : 4, border: '1.5px solid #e5e7eb', fontSize: 15, outline: 'none', fontFamily: 'Inter', transition: 'border-color 0.2s' }}
                    onFocus={e => e.target.style.borderColor = accent}
                    onBlur={e => e.target.style.borderColor = '#e5e7eb'}
                  />
                </div>
              ))}
              <div>
                <label style={{ display: 'block', fontSize: 13, fontWeight: 600, color: '#374151', marginBottom: 6 }}>Vaše zpráva</label>
                <textarea
                  rows={4} placeholder="Napište nám váš dotaz..." required
                  value={form.message} onChange={e => setForm({ ...form, message: e.target.value })}
                  style={{ width: '100%', padding: '12px 16px', borderRadius: rounded ? 10 : 4, border: '1.5px solid #e5e7eb', fontSize: 15, outline: 'none', resize: 'vertical', fontFamily: 'Inter', transition: 'border-color 0.2s' }}
                  onFocus={e => e.target.style.borderColor = accent}
                  onBlur={e => e.target.style.borderColor = '#e5e7eb'}
                />
              </div>
              <button type="submit" style={{
                background: accent, color: '#fff', border: 'none',
                padding: '14px 0', borderRadius: 50, fontWeight: 700, fontSize: 15, cursor: 'pointer',
                boxShadow: '0 6px 20px rgba(37,99,235,0.35)', transition: 'transform 0.2s',
              }}
              onMouseEnter={e => e.currentTarget.style.transform = 'translateY(-1px)'}
              onMouseLeave={e => e.currentTarget.style.transform = 'translateY(0)'}
              >Odeslat zprávu</button>
            </form>
          )}
        </div>
      </div>
    </section>
  );
}

/* ─── FOOTER ─────────────────────────────────────────────── */
function Footer({ accent }) {
  return (
    <footer style={{ background: '#060d1f', padding: '52px 0 28px', color: 'rgba(255,255,255,0.5)' }}>
      <div className="section-inner" style={{ maxWidth: 1200, margin: '0 auto', padding: '0 32px' }}>
        <div className="footer-top" style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 40, flexWrap: 'wrap', gap: 20 }}>
          <div style={{ display: 'flex', alignItems: 'center' }}>
            <img src="images/logo.svg" alt="Nová naděje – nadační fond" style={{ height: 40, width: 'auto' }} />
          </div>
          <div className="footer-links" style={{ display: 'flex', gap: 24, flexWrap: 'wrap' }}>
            {[
              ['Domů', '#home'], ['O nás', '#about'], ['Projekty', '#projects'],
              ['Aktuality', '#news'], ['Kontakt', '#contact']
            ].map(([label, href]) => (
              <a key={href} href={href} style={{ color: 'rgba(255,255,255,0.5)', textDecoration: 'none', fontSize: 14, transition: 'color 0.2s' }}
                onMouseEnter={e => e.currentTarget.style.color = '#fff'}
                onMouseLeave={e => e.currentTarget.style.color = 'rgba(255,255,255,0.5)'}
              >{label}</a>
            ))}
          </div>
        </div>
        <div className="footer-bottom" style={{ borderTop: '1px solid rgba(255,255,255,0.08)', paddingTop: 24, display: 'flex', justifyContent: 'space-between', flexWrap: 'wrap', gap: 12 }}>
          <p style={{ fontSize: 13 }}>© 2026 Nová naděje – nadační fond. Všechna práva vyhrazena.</p>
          <p style={{ fontSize: 13 }}>Zapsán u KS Ústí nad Labem · IČO 12345678</p>
        </div>
      </div>
    </footer>
  );
}

/* ─── APP ────────────────────────────────────────────────── */
function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const { user, login, logout } = useAuth();
  const [showLogin, setShowLogin] = useState(false);
  const [showDashboard, setShowDashboard] = useState(false);
  const accent = tweaks.accentColor;
  const rounded = tweaks.roundedCards;

  const handleLogin = (u) => { login(u); setShowDashboard(true); };
  const handleLogout = () => { logout(); setShowDashboard(false); };
  const handleUserClick = () => { if (user) setShowDashboard(true); else setShowLogin(true); };

  return (
    <>
      <Nav accent={accent} onLoginClick={() => setShowLogin(true)} user={user} onLogout={handleLogout} />
      {tweaks.heroStyle === 'fullscreen'
        ? <HeroFullscreen accent={accent} />
        : <HeroSplit accent={accent} />
      }
      {tweaks.showStats && <StatsBar accent={accent} />}
      <About accent={accent} rounded={rounded} />
      <Projects accent={accent} rounded={rounded} />
      <Donate accent={accent} rounded={rounded} />
      <News accent={accent} rounded={rounded} />
      <Contact accent={accent} rounded={rounded} />
      <Footer accent={accent} />

      {showLogin && (
        <LoginModal accent={accent} onClose={() => setShowLogin(false)} onLogin={handleLogin} />
      )}
      {showDashboard && user && (
        <Dashboard accent={accent} user={user} onLogout={handleLogout} rounded={rounded} />
      )}

      <TweaksPanel>
        <TweakSection label="Hero sekce">
          <TweakRadio
            label="Styl hero"
            value={tweaks.heroStyle}
            options={[
              { value: 'fullscreen', label: 'Celá obr.' },
              { value: 'split', label: 'Půlené' },
            ]}
            onChange={v => setTweak('heroStyle', v)}
          />
        </TweakSection>
        <TweakSection label="Barvy">
          <TweakColor label="Akcentová barva" value={accent} onChange={v => setTweak('accentColor', v)} />
        </TweakSection>
        <TweakSection label="Prvky stránky">
          <TweakToggle label="Statistiky pod hero" value={tweaks.showStats} onChange={v => setTweak('showStats', v)} />
          <TweakToggle label="Zaoblené rohy" value={rounded} onChange={v => setTweak('roundedCards', v)} />
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
