spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  site:
    public-url: ${PUBLIC_URL:http://localhost:4200}
  security:
    jwt:
      secret: ${JWT_SECRET:change-me-in-production-this-is-only-for-local-development-32chars-min}

logging:
  level:
    cz.novanadeje.app: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
