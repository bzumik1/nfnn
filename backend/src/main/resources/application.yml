spring:
  application:
    name: nova-nadeje
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/novanadeje}
    username: ${DB_USERNAME:novanadeje}
    password: ${DB_PASSWORD:novanadeje}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Europe/Prague
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}
  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false
  web:
    locale: cs
    locale-resolver: accept_header
  task:
    scheduling:
      pool:
        size: 1
      shutdown:
        await-termination: true
        await-termination-period: PT30S

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
  health:
    mail:
      enabled: false

app:
  contact:
    recipient-email: ${CONTACT_RECIPIENT:info@novanadeje.cz}
    sender-email: ${MAIL_FROM:${CONTACT_RECIPIENT:info@novanadeje.cz}}
  donations:
    bank-account:
      account-number: ${BANK_ACCOUNT_NUMBER:5544332217/2010}
      iban: ${BANK_IBAN:CZ2620100000005544332217}
      recipient-name: ${BANK_RECIPIENT_NAME:Nadační fond Nová naděje}
    import:
      overlap: P3D
      history-window: P89D
      history-from: ${FIO_HISTORY_FROM:}
    fio:
      token: ${FIO_TOKEN:}
      base-uri: https://fioapi.fio.cz/v1/rest
      interval: PT1H
      initial-delay: PT30S
      request-timeout: PT2M
  security:
    jwt:
      issuer: nova-nadeje
      secret: ${JWT_SECRET:change-me-in-production-this-is-only-for-local-development-32chars-min}
      access-token-ttl: PT15M
  donors:
    session:
      refresh-token-ttl: P14D

logging:
  level:
    cz.novanadeje.app: INFO
    org.springframework.web: INFO
