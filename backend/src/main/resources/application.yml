spring:
  application:
    name: nova-nadeje
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/novanadeje}
    username: ${DB_USERNAME:novanadeje}
    password: ${DB_PASSWORD:novanadeje}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Europe/Prague
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}
  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false
  web:
    locale: cs
    locale-resolver: accept_header
  task:
    scheduling:
      pool:
        size: 1
      shutdown:
        await-termination: true
        await-termination-period: PT30S

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
  health:
    mail:
      enabled: false

app:
  site:
    public-url: ${PUBLIC_URL:https://nfnn.znamenacek.duckdns.org}
  mail:
    sender-email: ${MAIL_FROM:${CONTACT_RECIPIENT:info@nfnn.cz}}
  contact:
    recipient-email: ${CONTACT_RECIPIENT:info@nfnn.cz}
    retention:
      max-age: P365D
      cron: "0 30 3 * * *"
  donations:
    bank-account:
      account-number: ${BANK_ACCOUNT_NUMBER:5544332217/2010}
      iban: ${BANK_IBAN:CZ2620100000005544332217}
      recipient-name: ${BANK_RECIPIENT_NAME:Nadační fond Nová naděje}
    import:
      overlap: P3D
      history-window: P89D
      history-from: ${FIO_HISTORY_FROM:}
      on-demand-cooldown: PT30S
    pairing:
      excluded-accounts: ${PAIRING_EXCLUDED_ACCOUNTS:}
    report:
      cron: "0 0 7 * * *"
      recipient: ${REPORT_RECIPIENT:${CONTACT_RECIPIENT:info@nfnn.cz}}
    fio:
      token: ${FIO_TOKEN:}
      base-uri: https://fioapi.fio.cz/v1/rest
      interval: PT1H
      initial-delay: PT30S
      request-timeout: PT2M
    receipt:
      foundation-name: Nová naděje - nadační fond
      foundation-company-identifier: "27278794"
      foundation-street: Jiráskova 436
      foundation-city: Nový Bor
      foundation-postal-code: 473 01
      registry-court: Krajský soud v Ústí nad Labem
      registry-file: N 78
      issue-place: V Novém Boru
      issue-place-en: Nový Bor
      signatory-name: ${RECEIPT_SIGNATORY_NAME:Pavel Znamenáček}
      signatory-role: ${RECEIPT_SIGNATORY_ROLE:předseda správní rady}
      signature-image: ${RECEIPT_SIGNATURE_IMAGE:}
      concurrent-renders: 3
      first-year: ${RECEIPT_FIRST_YEAR:2026}
  security:
    jwt:
      issuer: nova-nadeje
      secret: ${JWT_SECRET:}
      access-token-ttl: PT15M
  donors:
    session:
      refresh-token-ttl: P14D
    password-reset:
      token-ttl: PT1H
      max-live-links: 3
    email-verification:
      token-ttl: PT24H
      max-live-links: 3
    second-factor:
      challenge-ttl: PT5M
      challenge-attempts: 5
      issuer: Nová naděje

logging:
  level:
    cz.novanadeje.app: INFO
    org.springframework.web: INFO
    com.openhtmltopdf: WARN
    org.apache.pdfbox.pdmodel.font.PDType1Font: ERROR
