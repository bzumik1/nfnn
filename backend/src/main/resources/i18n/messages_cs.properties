receipt.declaration.single={0} potvrzuje, že od výše uvedeného dárce přijal dne {1} peněžitý dar ve výši {2}, poukázaný bankovním převodem na účet nadačního fondu č. {3}. Dar byl poskytnut bezúplatně a bez jakéhokoli protiplnění na účely sociální, zdravotnické, charitativní a na podporu a ochranu mládeže ve smyslu § 15 odst. 1 a § 20 odst. 8 zákona č. 586/1992 Sb., o daních z příjmů, ve znění pozdějších předpisů, a to v souladu s účelem nadačního fondu. Potvrzení se vydává na žádost dárce pro účely uplatnění odpočtu hodnoty daru od základu daně podle § 15 odst. 1 (poplatník daně z příjmů fyzických osob) nebo § 20 odst. 8 (poplatník daně z příjmů právnických osob) uvedeného zákona.
