problem.operations/backup-not-found.title=Záloha nenalezena
problem.operations/backup-not-found.detail=Taková záloha ve složce záloh není.
problem.operations/backups-unavailable.title=Zálohování není připojené
problem.operations/backups-unavailable.detail=Backend nevidí složku záloh nebo kontejner nfnn-backup neběží; zkontrolujte na serveru compose a sudo docker logs nfnn-backup.
problem.operations/log-not-found.title=Log nenalezen
problem.operations/log-not-found.detail=Takový soubor ve složce logů není.
problem.operations/logs-unavailable.title=Logy nejsou připojené
problem.operations/logs-unavailable.detail=Backend nevidí složku logů; v compose má mít připojenou /DATA/AppData/nfnn/logs jako /logs.
problem.operations/invalid-log-pattern.title=Neplatný vzor hledání
problem.operations/invalid-log-pattern.detail=Vzor musí být platný regulární výraz do 200 znaků.
problem.operations/log-search-too-slow.title=Hledání trvalo příliš dlouho
problem.operations/log-search-too-slow.detail=Vzor je pro hledání v logu příliš složitý. Zkuste prosím jednodušší, třeba jen kus textu.
problem.operations/invalid-logger-name.title=Neplatný název loggeru
problem.operations/invalid-logger-name.detail=Logger je ROOT nebo tečkovaný název balíčku či třídy.
problem.operations/log-override-not-found.title=Logger nemá dočasnou úroveň
problem.operations/log-override-not-found.detail=Tento logger žádnou dočasnou úroveň nastavenou nemá.
problem.operations/protected-logger.title=Tento logger nejde zesílit
problem.operations/protected-logger.detail=Tento logger by do logu zapsal hodnoty z databáze, těla požadavků, celé požadavky nebo tokeny, proto má pevnou úroveň. Úroveň TRACE je jen pro kód webu (cz.novanadeje.app).
problem.operations/invalid-settings.title=Nastavení nejde uložit
problem.operations/invalid-settings.detail=Opravte označené hodnoty a uložte znovu.
problem.operations/setup-completed.title=První nastavení už proběhlo
problem.operations/setup-completed.detail=Nastavení teď mění správce webu ve Správě v části Nastavení.
problem.operations/setup-locked.title=Průvodce je zamčený
problem.operations/setup-locked.detail=Otevřete web přímo z domácí sítě (ikona aplikace v ZimaOS), nebo zadejte kód z logu kontejneru nfnn-backend.
problem.operations/settings-key-missing.title=Hesla teď nejde uložit
problem.operations/settings-key-missing.detail=Backendu chybí klíč k šifrování nastavení (složka secrets). Zkontrolujte compose podle návodu k instalaci.
problem.operations/secret-settings-in-browser-only.title=Hesla jen v prohlížeči
problem.operations/secret-settings-in-browser-only.detail=Hesla a tokeny se mění jen ve Správě webu v prohlížeči, nikdy přes připojenou aplikaci.
problem.operations/restore-pending.title=Obnova už čeká
problem.operations/restore-pending.detail=Jedna obnova ze zálohy už čeká na kontejner záloh nebo právě běží. Počkejte, až skončí.
problem.operations/not-a-backup.title=Tohle není záloha webu
problem.operations/not-a-backup.detail=Vyberte prosím soubor zálohy s příponou .dump.age, jak ho stáhnete ve Správě na stránce Zálohy.
problem.operations/backup-too-large.title=Záloha je moc velká
problem.operations/backup-too-large.detail=Server přijme zálohu do 4 GB. Větší zálohu nahrajte do složky restore na serveru podle návodu k instalaci.
problem.operations/invalid-backup-key.title=Tohle není klíč k zálohám
problem.operations/invalid-backup-key.detail=Klíč začíná AGE-SECRET-KEY-1 a má 74 znaků, nebo je to 24 slov. Zkontrolujte, že jste ho opsali nebo vložili celý a bez překlepu.
problem.operations/backup-key-required.title=Záloha potřebuje svůj klíč
problem.operations/backup-key-required.detail=Záloha je zašifrovaná. Vložte prosím klíč k zálohám, se kterým vznikla.
problem.operations/backup-key-check-mismatch.title=Slova nesedí
problem.operations/backup-key-check-mismatch.detail=Opište prosím slova klíče k zálohám na požadovaných pořadích tak, jak je máte uložená.
problem.operations/backup-key-confirmation-expired.title=Zobrazte si klíč znovu
problem.operations/backup-key-confirmation-expired.detail=Slova klíče jde potvrdit do půl hodiny od zobrazení a nejvýš pětkrát. Zobrazte si prosím klíč znovu; zeptáme se na jiná slova.
problem.operations/backup-key-reveal-paused.title=Klíč se teď nezobrazí
problem.operations/backup-key-reveal-paused.detail=Kód nebo přístupový klíč pětkrát za sebou nesouhlasil, proto klíč k zálohám čtvrt hodiny neukážeme. Zkuste to prosím později a pokud jste to nebyli vy, změňte si heslo i druhý faktor.
problem.operations/backup-key-unavailable.title=Klíč k zálohám chybí
problem.operations/backup-key-unavailable.detail=Backend nemá klíč k zálohám ze složky secrets. Zkontrolujte compose podle návodu k instalaci a sudo docker logs nfnn-backend.
