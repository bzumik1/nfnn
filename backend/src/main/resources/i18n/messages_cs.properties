problem.donors/administrator-required.detail=Aplikace žádá o přístup ke správě webu. Ten má jen účet správce přihlášený s dvoufaktorovým ověřením.
problem.donors/second-factor-session-required.title=Nejdřív se přihlaste přístupovým klíčem
problem.donors/second-factor-session-required.detail=Účet správce mění přístupové klíče a dvoufaktorové ověření jen po přihlášení přístupovým klíčem nebo kódem z aplikace. Odhlaste se a přihlaste se znovu takto.
problem.donors/confirmation-required.title=Potvrďte změnu
problem.donors/confirmation-required.detail=Zadejte současné heslo, nebo změnu potvrďte přístupovým klíčem.
problem.donors/passkey-confirmation-rejected.title=Přístupový klíč změnu nepotvrdil
problem.donors/passkey-confirmation-rejected.detail=Potvrďte to prosím znovu některým ze svých přístupových klíčů k tomuto účtu.
problem.donors/fresh-second-factor-required.title=Potvrďte připojení kódem nebo klíčem
problem.donors/fresh-second-factor-required.detail=Připojení aplikace potvrďte aktuálním kódem z ověřovací aplikace nebo svým přístupovým klíčem.
problem.donors/last-sign-in-method.title=Přišli byste o poslední způsob přihlášení
problem.donors/last-sign-in-method.detail=Bez hesla a bez přístupového klíče byste se k účtu nepřihlásili. Nejdřív si přidejte jiný přístupový klíč nebo heslo.
problem.donors/administrator-recovery-refused.title=Účet správce se takto neobnovuje
problem.donors/administrator-recovery-refused.detail=Přístupový klíč správce e-mailem obnovit nejde. Požádejte jiného správce, ať vaše klíče odebere, a pak si nastavte heslo odkazem z e-mailu.
problem.donors/second-factor-code-required.title=Opište kód z aplikace
problem.donors/second-factor-code-required.detail=Máte zapnuté dvoufaktorové ověření, takže nový přístupový klíč přidáte jen s kódem z ověřovací aplikace.
problem.donors/connected-app-not-found.title=Připojená aplikace nenalezena
problem.donors/connected-app-not-found.detail=Aplikace už je odpojená, nebo nepatří k vašemu účtu.
