donors.receiptSigningKeyWithdrawn.email.dateFormat=d MMM yyyy 'at' HH:mm
donors.receiptSigningKeyWithdrawn.email.intro=the administrator {0} withdrew the key {2} in the administration of the Nová naděje site on {1}; the server signs the verification QR codes on donation receipts with it. The site keeps publishing this key, but as withdrawn, so nobody is to trust the QR codes signed with it. The receipts themselves stay valid.
