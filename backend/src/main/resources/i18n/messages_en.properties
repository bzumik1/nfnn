donations.importAlert.email.greeting=Hello,
donations.importAlert.email.regards=Kind regards
donations.importAlert.email.signature=Nová naděje – nadační fond
donations.importAlert.email.footer=The site sends this message automatically when downloading the payments from the bank fails three times in a row or Fio rejects the token, and again once the download works.
donations.importAlert.email.outage.subject=Downloading payments from the bank is failing – Nová naděje
donations.importAlert.email.outage.title=Downloading payments from the bank is failing
donations.importAlert.email.outage.intro.repeated=the Nová naděje site has failed {0} times in a row to download the payments from Fio, most recently on {1}.
donations.importAlert.email.outage.intro.token=on {0} Fio rejected the token the Nová naděje site downloads the foundation account''s payments with.
donations.importAlert.email.outage.reason.RATE_LIMITED=Fio refused a request that came too soon.
donations.importAlert.email.outage.action.RATE_LIMITED=The next attempt runs by itself.
donations.importAlert.email.outage.reason.HISTORY_LOCKED=Fio withheld the history older than 90 days.
donations.importAlert.email.outage.action.HISTORY_LOCKED=Unlock the history in Fio internet banking (Settings → API, the lock icon) and reinstall the application within 10 minutes.
donations.importAlert.email.outage.reason.UNAUTHORIZED=The token is missing, not yet active or expired (it lasts 180 days).
donations.importAlert.email.outage.action.UNAUTHORIZED=In Fio internet banking (Settings → API) create a new token of the "account watching" type, put it on the server into backend.env on the FIO_TOKEN line and reinstall the application. The steps are in deploy/README.md, section Fio API.
donations.importAlert.email.outage.reason.TRANSPORT=Fio could not be reached: the connection failed or timed out.
donations.importAlert.email.outage.action.TRANSPORT=Check the server's internet connection and the state of the Fio API; the attempts continue every hour by themselves.
donations.importAlert.email.outage.reason.INVALID_RESPONSE=Fio sent an answer the site does not understand.
donations.importAlert.email.outage.action.INVALID_RESPONSE=The details are in the backend log (sudo docker logs nfnn-backend); the Fio API may have changed.
donations.importAlert.email.outage.reason.UNEXPECTED=Processing the payments ended with an unexpected error.
donations.importAlert.email.outage.action.UNEXPECTED=The details are in the backend log (sudo docker logs nfnn-backend).
donations.importAlert.email.outage.lastSuccess=Last successful download of payments from the bank: {0}
donations.importAlert.email.outage.neverSucceeded=Last successful download of payments from the bank: none yet
donations.importAlert.email.outage.consequence=While the outage lasts, new gifts do not appear to donors in the portal and no receipt is issued for them.
donations.importAlert.email.outage.next=Once the download works again we send one more message; until then this message is not repeated.
donations.importAlert.email.recovery.subject=Downloading payments from the bank works again – Nová naděje
donations.importAlert.email.recovery.title=Downloading payments from the bank works again
donations.importAlert.email.recovery.intro=on {0} the Nová naděje site downloaded the payments from Fio again. Before that {1,choice,1#1 attempt|1<{1} attempts} in a row had failed.
donations.importAlert.email.recovery.lastSuccess=Last successful download before the outage: {0}
donations.importAlert.email.recovery.neverSucceeded=Before the outage the payments had never been downloaded from the bank.
donations.importAlert.email.recovery.caughtUp=The payments that arrived in the meantime are downloaded and paired; donors see them in their overview.

