donors.erased.email.subject=Your personal data has been erased – Nová naděje
donors.erased.email.title=Personal data erased
donors.erased.email.greeting=Hello,
donors.erased.email.intro=at your request we have erased the personal data of your Nová naděje donor account: name, address, e-mail, password and bank accounts. The account can no longer be used and every sign-in has been ended.
donors.erased.email.kept=The donation receipts issued are accounting documents, so we keep them on our server unchanged for as long as the accounting and tax rules require, with your name and address (for a company, also its company ID) as they stand on them. We keep the records of the payments and gifts received for the same time, with what the bank statement says about each payment, including the account number and the payer's name. The record of what the site's administrators did, this erasure included, also stays on the server.
donors.erased.email.backups=We back up the site's database to our server every day and delete the backups on the server after about a month, so the erased data leave the backups within that time at the latest.
donors.erased.email.again=Should you ever wish to come back, simply register again. Thank you for your support.
donors.erased.email.regards=Kind regards
donors.erased.email.signature=Nová naděje – nadační fond
donors.erased.email.footer=If you have a question, write to us at {0}.

