operations.backupAlert.email.greeting=Hello,
operations.backupAlert.email.regards=Kind regards
operations.backupAlert.email.signature=Nová naděje – nadační fond
operations.backupAlert.email.footer=The site sends this message automatically when the daily check finds a problem with the database backups or their test restore, and again when the problem ends.
operations.backupAlert.email.problem.subject=The database backups have a problem – Nová naděje
operations.backupAlert.email.problem.title=The database backups have a problem
operations.backupAlert.email.problem.intro=the daily check at {0} found that the Nová naděje site's database backups do not work as they should:
operations.backupAlert.email.problem.BACKUPS_UNAVAILABLE=The backend does not see the backup folder. In the compose file the backend mounts /DATA/AppData/nfnn/backups as /backups.
operations.backupAlert.email.problem.BACKUP_MISSING=No backup has run yet; the nfnn-backup container is probably not running (sudo docker logs nfnn-backup).
operations.backupAlert.email.problem.BACKUP_FAILED=The last backup at {0} failed: {1}
operations.backupAlert.email.problem.BACKUP_STALE=The last backup is from {0} and no newer one ran; the nfnn-backup container is probably not running (sudo docker logs nfnn-backup).
operations.backupAlert.email.problem.TEST_RESTORE_MISSING=No test restore has run yet although the backups are older than a week; it runs every Sunday at 4:00.
operations.backupAlert.email.problem.TEST_RESTORE_FAILED=The test restore of the backup {0} at {1} failed: {2} The backup may be unusable.
operations.backupAlert.email.problem.TEST_RESTORE_STALE=The last test restore ran at {0} and no newer one did; it runs every Sunday at 4:00.
operations.backupAlert.email.problem.noErrorText=no error text; the details are in the log of the nfnn-backup container.
operations.backupAlert.email.problem.consequence=While the problem lasts, a server failure can lose the data about gifts and donors.
operations.backupAlert.email.problem.action=The state of the backups is on the Zálohy page of the site's administration, where a backup and a test restore can be started at once; the details are in the log of the nfnn-backup container (sudo docker logs nfnn-backup).
operations.backupAlert.email.problem.next=When the backups are fine again, we send one more message; until then this message is not repeated.
operations.backupAlert.email.recovery.subject=The database backups work again – Nová naděje
operations.backupAlert.email.recovery.title=The database backups work again
operations.backupAlert.email.recovery.intro=the daily check at {0} found the Nová naděje site's database backups in order again.
operations.backupAlert.email.recovery.resolved=Ended: {0}.
operations.backupAlert.email.recovery.lastBackup=Last backup: {0} at {1} ({2}).
operations.backupAlert.email.recovery.noBackup=Last backup: none yet.
operations.backupAlert.email.recovery.lastTestRestore=Last test restore: {0}, {1,choice,0#no tables|1#1 table|2#{1} tables}.
operations.backupAlert.email.recovery.noTestRestore=Last test restore: none yet.
operations.backupAlert.email.label.BACKUPS_UNAVAILABLE=the backup folder was not connected
operations.backupAlert.email.label.BACKUP_MISSING=no backup
operations.backupAlert.email.label.BACKUP_FAILED=a failed backup
operations.backupAlert.email.label.BACKUP_STALE=a stale backup
operations.backupAlert.email.label.TEST_RESTORE_MISSING=a missing test restore
operations.backupAlert.email.label.TEST_RESTORE_FAILED=a failed test restore
operations.backupAlert.email.label.TEST_RESTORE_STALE=a stale test restore
problem.donors/invalid-client.title=The application cannot be verified
problem.donors/invalid-client.detail=The application's metadata document could not be read, or it does not list the given redirect address.
problem.donors/invalid-authorization-request.title=Invalid connection request
problem.donors/invalid-authorization-request.detail=The application's request does not match what the site offers. Start the connection in the application again.
problem.donors/invalid-grant.title=Invalid code or token
problem.donors/invalid-grant.detail=The code or token expired, was already used, or belongs to another application.
problem.donors/invalid-target.title=Unknown token target
problem.donors/invalid-target.detail=A token can be issued only for this site's connector or API.
problem.donors/administrator-required.title=Only an administrator can connect an application
problem.donors/administrator-required.detail=The application asks for access to the site's administration, which only an administrator account signed in with two-factor authentication has.
problem.donors/second-factor-session-required.title=Sign in with your passkey first
problem.donors/second-factor-session-required.detail=An administrator account changes its passkeys and two-factor authentication only after signing in with a passkey or the code from the app. Sign out and sign in again that way.
problem.donors/confirmation-required.title=Confirm the change
problem.donors/confirmation-required.detail=Enter your current password or confirm the change with a passkey.
problem.donors/passkey-confirmation-rejected.title=The passkey did not confirm the change
problem.donors/passkey-confirmation-rejected.detail=Please confirm it again with one of the passkeys of this account.
problem.donors/last-sign-in-method.title=You would lose your last way to sign in
problem.donors/last-sign-in-method.detail=Without a password and a passkey you could not sign in. Add another passkey or a password first.
problem.donors/administrator-recovery-refused.title=An administrator account is not recovered this way
problem.donors/administrator-recovery-refused.detail=An administrator's passkey cannot be recovered by e-mail. Ask another administrator to remove your passkeys, then set a password with the link from the e-mail.
problem.donors/second-factor-code-required.title=Enter the code from the app
problem.donors/second-factor-code-required.detail=Two-factor authentication is on, so a new passkey needs the code from your authenticator app.
problem.donors/connected-app-not-found.title=Connected application not found
problem.donors/connected-app-not-found.detail=The application is already disconnected, or it does not belong to your account.
