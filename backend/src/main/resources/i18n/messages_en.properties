receipt.declaration.single={0} confirms that on {1} it received from the above donor a monetary gift of {2}, transferred by bank transfer to the account of the foundation No. {3}. The gift was given free of charge and without any consideration for social, health and charitable purposes and for the support and protection of youth within the meaning of § 15 odst. 1 and § 20 odst. 8 of zákon č. 586/1992 Sb., o daních z příjmů (Section 15(1) and Section 20(8) of Act No. 586/1992 Coll., on Income Taxes), as amended, namely to support children with disabilities in accordance with the purpose of the foundation. This confirmation is issued at the request of the donor for the purpose of deducting the value of the gift from the tax base under Section 15(1) (individual income taxpayer) or Section 20(8) (corporate income taxpayer) of that Act.
