problem.donors/invalid-client.title=The application cannot be verified
problem.donors/invalid-client.detail=The application's metadata document could not be read, or it does not list the given redirect address.
problem.donors/invalid-authorization-request.title=Invalid connection request
problem.donors/invalid-authorization-request.detail=The application's request does not match what the site offers. Start the connection in the application again.
problem.donors/invalid-grant.title=Invalid code or token
problem.donors/invalid-grant.detail=The code or token expired, was already used, or belongs to another application.
problem.donors/invalid-target.title=Unknown token target
problem.donors/invalid-target.detail=A token can be issued only for this site's connector or API.
problem.donors/administrator-required.title=Only an administrator can connect an application
problem.donors/administrator-required.detail=The application asks for access to the site's administration, which only an administrator account signed in with two-factor authentication has.
problem.donors/second-factor-session-required.title=Sign in with your passkey first
problem.donors/second-factor-session-required.detail=An administrator account changes its passkeys and two-factor authentication only after signing in with a passkey or the code from the app. Sign out and sign in again that way.
problem.donors/confirmation-required.title=Confirm the change
problem.donors/confirmation-required.detail=Enter your current password or confirm the change with a passkey.
problem.donors/passkey-confirmation-rejected.title=The passkey did not confirm the change
problem.donors/passkey-confirmation-rejected.detail=Please confirm it again with one of the passkeys of this account.
problem.donors/fresh-second-factor-required.title=Confirm the connection with a code or a passkey
problem.donors/fresh-second-factor-required.detail=Confirm the connection with the current code from the authenticator app or with your passkey.
problem.donors/last-sign-in-method.title=You would lose your last way to sign in
problem.donors/last-sign-in-method.detail=Without a password and a passkey you could not sign in. Add another passkey or a password first.
problem.donors/administrator-recovery-refused.title=An administrator account is not recovered this way
problem.donors/administrator-recovery-refused.detail=An administrator's passkey cannot be recovered by e-mail. Ask another administrator to remove your passkeys, then set a password with the link from the e-mail.
problem.donors/second-factor-code-required.title=Enter the code from the app
problem.donors/second-factor-code-required.detail=Two-factor authentication is on, so a new passkey needs the code from your authenticator app.
problem.donors/connected-app-not-found.title=Connected application not found
problem.donors/connected-app-not-found.detail=The application is already disconnected, or it does not belong to your account.
