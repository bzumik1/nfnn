operations.settings.problem.placeholder=The value must not contain ${.
operations.settings.problem.backup-key=This is the backup key, not a password or a token. A password manager probably filled it in; please enter the password or token of the service here.
operations.settings.problem.invalid-url=Enter an address starting with https:// or http://, without a question mark or a hash.
