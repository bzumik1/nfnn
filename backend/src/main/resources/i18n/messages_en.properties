problem.donations/symbol-claim-not-confirmed.title=This answer is not "Yes"
problem.donations/symbol-claim-not-confirmed.detail=Only a confirmed "Yes, they are mine" can be reversed. A "No" can be deleted so the donor gets the question again.
problem.donations/symbol-claim-still-confirmed.title=This answer is "Yes"
problem.donations/symbol-claim-still-confirmed.detail=Only a "No" can be deleted. Reverse the confirmed "Yes" first.
