problem.operations/backup-not-found.title=Backup not found
problem.operations/backup-not-found.detail=There is no such backup in the backup folder.
problem.operations/backups-unavailable.title=Backups are not connected
problem.operations/backups-unavailable.detail=The backend does not see the backup folder or the nfnn-backup container is not running; check the compose file and sudo docker logs nfnn-backup on the server.
problem.operations/log-not-found.title=Log not found
problem.operations/log-not-found.detail=There is no such file in the log folder.
problem.operations/logs-unavailable.title=Logs are not connected
problem.operations/logs-unavailable.detail=The backend does not see the log folder; the compose file mounts /DATA/AppData/nfnn/logs as /logs.
problem.operations/invalid-log-pattern.title=Invalid search pattern
problem.operations/invalid-log-pattern.detail=The pattern must be a valid regular expression of at most 200 characters.
problem.operations/invalid-logger-name.title=Invalid logger name
problem.operations/invalid-logger-name.detail=A logger is ROOT or a dotted package or class name.
problem.operations/log-override-not-found.title=The logger has no temporary level
problem.operations/log-override-not-found.detail=No temporary level is set for this logger.
problem.operations/invalid-settings.title=The settings cannot be saved
problem.operations/invalid-settings.detail=Correct the marked values and save again.
problem.operations/setup-completed.title=The first setup is done
problem.operations/setup-completed.detail=Settings are now changed by an administrator under Settings in the administration.
problem.operations/setup-locked.title=The setup is locked
problem.operations/setup-locked.detail=Open the site directly from the home network (the app's icon in ZimaOS), or enter the code from the nfnn-backend container log.
problem.operations/settings-key-missing.title=Passwords cannot be saved now
problem.operations/settings-key-missing.detail=The backend has no key to encrypt settings (the secrets folder). Check the compose against the installation guide.
problem.operations/secret-settings-in-browser-only.title=Passwords only in the browser
problem.operations/secret-settings-in-browser-only.detail=Passwords and tokens change only in the administration in a browser, never through a connected application.
problem.operations/restore-pending.title=A restore is already waiting
problem.operations/restore-pending.detail=One restore from a backup is already waiting for the backup container or running. Wait until it is done.
problem.operations/not-a-backup.title=This is not a backup of the site
problem.operations/not-a-backup.detail=Choose a backup file ending in .dump, as downloaded on the Backups page of the administration.
problem.operations/backup-too-large.title=The backup is too large
problem.operations/backup-too-large.detail=The server takes a backup of up to 4 GB. Put a larger one into the restore folder on the server as the installation guide says.
