donors.receiptSigningKeyWithdrawn.email.expected=If you know about it, there is nothing to do.
donors.receiptSigningKeyWithdrawn.email.warning=If not, please change your password and your second factor at once, look in the administration history at what changed there lately, and write to the other administrators and to {0}.
