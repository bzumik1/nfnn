<!DOCTYPE html>
<html lang="cs" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{contact.email.title}">Nová zpráva z webu</title>
</head>
<body style="font-family: Arial, sans-serif; color: #1a1a2e; line-height: 1.6;">
<h1 style="font-size: 20px;" th:text="#{contact.email.title}">Nová zpráva z webu</h1>
<table style="border-collapse: collapse;">
    <tr>
        <th style="text-align: left; padding: 4px 16px 4px 0;" th:text="#{contact.email.senderName}">Jméno</th>
        <td style="padding: 4px 0;" th:text="${senderName}">Jana Nováková</td>
    </tr>
    <tr>
        <th style="text-align: left; padding: 4px 16px 4px 0;" th:text="#{contact.email.senderEmail}">E-mail</th>
        <td style="padding: 4px 0;"><a th:href="'mailto:' + ${senderEmail}" th:text="${senderEmail}">jana@example.cz</a></td>
    </tr>
    <tr>
        <th style="text-align: left; padding: 4px 16px 4px 0;" th:text="#{contact.email.receivedAt}">Přijato</th>
        <td style="padding: 4px 0;" th:text="${receivedAt}">17. 10. 2026 12:00</td>
    </tr>
</table>
<h2 style="font-size: 16px; margin-top: 24px;" th:text="#{contact.email.body}">Zpráva</h2>
<p style="white-space: pre-wrap; background: #f5f5f7; padding: 16px; border-radius: 8px;" th:text="${body}">Text zprávy</p>
<p style="color: #6b6b80; font-size: 12px;" th:text="#{contact.email.footer}">Odpovězte přímo na tento e-mail, odpověď dorazí odesílateli.</p>
</body>
</html>
