<!DOCTYPE html>
<html lang="cs" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="content">
    <table role="presentation" cellpadding="0" cellspacing="0" style="margin: 0 0 24px; font-size: 15px; line-height: 1.65;">
        <tr>
            <th align="left" style="padding: 4px 16px 4px 0; font-weight: 600; color: #6b7280; vertical-align: top;" th:text="#{contact.email.senderName}">Jméno</th>
            <td style="padding: 4px 0; color: #1a1a2e;" th:text="${senderName}">Jana Nováková</td>
        </tr>
        <tr>
            <th align="left" style="padding: 4px 16px 4px 0; font-weight: 600; color: #6b7280; vertical-align: top;" th:text="#{contact.email.senderEmail}">E-mail</th>
            <td style="padding: 4px 0;"><a th:href="'mailto:' + ${senderEmail}" th:text="${senderEmail}" style="color: #2563eb;">jana@example.cz</a></td>
        </tr>
        <tr>
            <th align="left" style="padding: 4px 16px 4px 0; font-weight: 600; color: #6b7280; vertical-align: top;" th:text="#{contact.email.receivedAt}">Přijato</th>
            <td style="padding: 4px 0; color: #1a1a2e;" th:text="${receivedAt}">17. 10. 2026 12:00</td>
        </tr>
    </table>
    <h2 style="margin: 0 0 12px; font-family: 'Playfair Display', Georgia, 'Times New Roman', serif; font-size: 18px; line-height: 1.3; font-weight: 700; color: #1a1a2e;"
        th:text="#{contact.email.body}">Zpráva</h2>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
        <tr>
            <td style="background: #f8faff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 16px 18px; color: #1a1a2e; white-space: pre-wrap;" th:text="${body}">Text zprávy</td>
        </tr>
    </table>
</th:block>
</body>
</html>
