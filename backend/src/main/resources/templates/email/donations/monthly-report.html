<!DOCTYPE html>
<html lang="cs" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="content">
    <p style="margin: 0 0 16px;" th:text="${greeting}">Dobrý den,</p>
    <p style="margin: 0 0 8px;" th:text="${intro}">posíláme měsíční přehled dárcovského portálu Nová naděje za září 2026.</p>
    <th:block th:each="section : ${sections}">
        <h2 style="margin: 24px 0 8px; font-family: 'Playfair Display', Georgia, 'Times New Roman', serif; font-size: 18px; line-height: 1.3; font-weight: 700; color: #1a1a2e;"
            th:text="${section.heading()}">Dárci</h2>
        <p style="margin: 0 0 4px;" th:each="line : ${section.lines()}" th:text="${line}">Registrovaní dárci k 30. 9. 2026: 2</p>
    </th:block>
    <p style="margin: 28px 0 0;">
        <span th:text="${regards}">S pozdravem</span><br>
        <span style="font-family: 'Playfair Display', Georgia, serif; font-size: 17px; font-style: italic; color: #1a1a2e;" th:text="${signature}">Nová naděje – nadační fond</span>
    </p>
</th:block>
</body>
</html>
