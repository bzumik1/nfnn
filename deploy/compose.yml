name: nfnn

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-novanadeje}
      POSTGRES_USER: ${DB_USERNAME:-novanadeje}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      TZ: Europe/Prague
    volumes:
      - ${NFNN_DATA:-/DATA/AppData/nfnn}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    logging: *logging

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: ${DB_NAME:-novanadeje}
      PGUSER: ${DB_USERNAME:-novanadeje}
      PGPASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      TZ: Europe/Prague
    volumes:
      - ${NFNN_DATA:-/DATA/AppData/nfnn}/backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          file="/backups/nfnn-$$(date +%Y-%m-%d_%H%M).dump"
          if pg_dump --format=custom --file="$$file.part"; then
            mv "$$file.part" "$$file"
            echo "backup written: $$file"
          else
            rm -f "$$file.part"
            echo "backup failed" >&2
          fi
          find /backups -name 'nfnn-*.dump' -mtime +"$$BACKUP_KEEP_DAYS" -delete
          sleep 86400
        done
    deploy:
      resources:
        limits:
          memory: 256M
    logging: *logging

  backend:
    image: ${NFNN_IMAGE_PREFIX:-ghcr.io/bzumik1/nfnn}-backend:${NFNN_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-novanadeje}
      DB_USERNAME: ${DB_USERNAME:-novanadeje}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_AUTH: ${MAIL_AUTH:-true}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-true}
      CONTACT_RECIPIENT: ${CONTACT_RECIPIENT:-info@novanadeje.cz}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
      TZ: Europe/Prague
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080
          && printf 'GET /actuator/health HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3
          && grep -q '"status":"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 1G
    logging: *logging

  frontend:
    image: ${NFNN_IMAGE_PREFIX:-ghcr.io/bzumik1/nfnn}-frontend:${NFNN_TAG:-latest}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8089}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
    logging: *logging
