name: nfnn

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17-alpine
    container_name: nfnn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: novanadeje
      POSTGRES_USER: novanadeje
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is not set}
      TZ: Europe/Prague
    volumes:
      - ${NFNN_DATA:-/DATA/AppData/nfnn}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novanadeje -d novanadeje"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    logging: *logging

  backup:
    image: postgres:17-alpine
    container_name: nfnn-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: novanadeje
      PGUSER: novanadeje
      PGPASSWORD: ${DB_PASSWORD:?DB_PASSWORD is not set}
      TZ: Europe/Prague
    volumes:
      - ${NFNN_DATA:-/DATA/AppData/nfnn}/backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          until pg_isready --quiet; do sleep 5; done
          if pg_dump --format=custom --file=/backups/nfnn.dump.part; then
            mv /backups/nfnn.dump.part "/backups/nfnn-`date +%Y-%m-%d_%H%M`.dump"
            echo "backup written"
          else
            rm -f /backups/nfnn.dump.part
            echo "backup failed" >&2
          fi
          find /backups -name 'nfnn-*.dump' -mtime +30 -delete
          sleep 86400
        done
    deploy:
      resources:
        limits:
          memory: 256M
    logging: *logging

  backend:
    image: ghcr.io/bzumik1/nfnn-backend:latest
    container_name: nfnn-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/novanadeje
      DB_USERNAME: novanadeje
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is not set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is not set}
      MAIL_HOST: ""
      MAIL_PORT: "587"
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""
      MAIL_AUTH: "true"
      MAIL_STARTTLS: "true"
      CONTACT_RECIPIENT: info@novanadeje.cz
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
      TZ: Europe/Prague
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080
          && printf 'GET /actuator/health HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3
          && grep -q '"status":"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 1G
    logging: *logging

  frontend:
    image: ghcr.io/bzumik1/nfnn-frontend:latest
    container_name: nfnn-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8089:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
    logging: *logging
