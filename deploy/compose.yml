name: nfnn

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17-alpine
    container_name: nfnn-postgres
    restart: unless-stopped
    network_mode: bridge
    env_file:
      - /DATA/AppData/nfnn/env/db.env
    environment:
      POSTGRES_DB: novanadeje
      POSTGRES_USER: novanadeje
      TZ: Europe/Prague
    volumes:
      - /DATA/AppData/nfnn/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novanadeje -d novanadeje"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    logging: *logging

  backup:
    image: postgres:17-alpine
    container_name: nfnn-backup
    restart: unless-stopped
    network_mode: bridge
    depends_on:
      postgres:
        condition: service_started
    links:
      - postgres
    env_file:
      - /DATA/AppData/nfnn/env/db.env
    environment:
      PGHOST: postgres
      PGDATABASE: novanadeje
      PGUSER: novanadeje
      TZ: Europe/Prague
    volumes:
      - /DATA/AppData/nfnn/backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          until pg_isready --quiet; do sleep 5; done
          if pg_dump --format=custom --file=/backups/nfnn.dump.part; then
            mv /backups/nfnn.dump.part "/backups/nfnn-`date +%Y-%m-%d_%H%M`.dump"
            echo "backup written"
          else
            rm -f /backups/nfnn.dump.part
            echo "backup failed" >&2
          fi
          find /backups -name 'nfnn-*.dump' -mtime +30 -delete
          sleep 86400
        done
    deploy:
      resources:
        limits:
          memory: 256M
    logging: *logging

  backend:
    image: ghcr.io/bzumik1/nfnn-backend:latest
    container_name: nfnn-backend
    restart: unless-stopped
    network_mode: bridge
    depends_on:
      postgres:
        condition: service_started
    links:
      - postgres
    env_file:
      - /DATA/AppData/nfnn/env/db.env
      - /DATA/AppData/nfnn/env/backend.env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/novanadeje
      DB_USERNAME: novanadeje
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
      TZ: Europe/Prague
    volumes:
      - /DATA/AppData/nfnn/config:/config:ro
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080
          && printf 'GET /actuator/health HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3
          && grep -q '"status":"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 1G
    logging: *logging

  frontend:
    image: ghcr.io/bzumik1/nfnn-frontend:latest
    container_name: nfnn-frontend
    restart: unless-stopped
    network_mode: bridge
    depends_on:
      backend:
        condition: service_started
    links:
      - backend
    ports:
      - "8089:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
    logging: *logging

x-casaos:
  title:
    custom: Nová naděje
  main: frontend
  scheme: http
  hostname: ""
  index: /
  port_map: "8089"
  category: Web
  tagline:
    cs_cz: Web Nadačního fondu Nová naděje
    en_us: Website of the Nová naděje foundation
  description:
    cs_cz: Web, dárcovský portál a potvrzení o daru. Data v /DATA/AppData/nfnn, hesla a nastavení v /DATA/AppData/nfnn/env.
    en_us: Website, donor portal and donation receipts. Data in /DATA/AppData/nfnn, secrets and settings in /DATA/AppData/nfnn/env.
