name: nfnn

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: ghcr.io/bzumik1/nfnn-postgres:latest
    container_name: nfnn-postgres
    restart: unless-stopped
    network_mode: bridge
    environment:
      POSTGRES_DB: novanadeje
      POSTGRES_USER: novanadeje
      TZ: Europe/Prague
    volumes:
      - /DATA/AppData/nfnn/postgres:/var/lib/postgresql/data
      - /DATA/AppData/nfnn/secrets:/secrets
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novanadeje -d novanadeje"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    logging: *logging

  backup:
    image: ghcr.io/bzumik1/nfnn-backup:latest
    container_name: nfnn-backup
    restart: unless-stopped
    network_mode: bridge
    depends_on:
      postgres:
        condition: service_started
    links:
      - postgres
    environment:
      PGHOST: postgres
      PGDATABASE: novanadeje
      PGUSER: novanadeje
      TZ: Europe/Prague
    volumes:
      - /DATA/AppData/nfnn/backups:/backups
      - /DATA/AppData/nfnn/restore:/restore
      - /DATA/AppData/nfnn/logs:/logs
      - /DATA/AppData/nfnn/secrets:/secrets:ro
    deploy:
      resources:
        limits:
          memory: 256M
    logging: *logging

  backend:
    image: ghcr.io/bzumik1/nfnn-backend:latest
    container_name: nfnn-backend
    restart: unless-stopped
    network_mode: bridge
    depends_on:
      postgres:
        condition: service_started
      backup:
        condition: service_started
    links:
      - postgres
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/novanadeje
      DB_USERNAME: novanadeje
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
      TZ: Europe/Prague
    volumes:
      - /DATA/AppData/nfnn/config:/config:ro
      - /DATA/AppData/nfnn/backups:/backups:ro
      - /DATA/AppData/nfnn/backups/requests:/backups/requests
      - /DATA/AppData/nfnn/restore:/restore:ro
      - /DATA/AppData/nfnn/logs:/logs
      - /DATA/AppData/nfnn/secrets:/secrets
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080
          && printf 'GET /actuator/health HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3
          && grep -q '"status":"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 1G
    logging: *logging

  mcp:
    image: ghcr.io/bzumik1/nfnn-mcp:latest
    container_name: nfnn-mcp
    restart: unless-stopped
    network_mode: bridge
    depends_on:
      backend:
        condition: service_started
    links:
      - backend
    environment:
      TZ: Europe/Prague
    volumes:
      - /DATA/AppData/nfnn/logs:/logs
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 256M
    logging: *logging

  frontend:
    image: ghcr.io/bzumik1/nfnn-frontend:latest
    container_name: nfnn-frontend
    restart: unless-stopped
    network_mode: bridge
    depends_on:
      backend:
        condition: service_started
      mcp:
        condition: service_started
    links:
      - backend
      - mcp
    ports:
      - "8089:80"
    volumes:
      - /DATA/AppData/nfnn/logs:/logs
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
    logging: *logging

x-casaos:
  title:
    custom: Nová naděje
  main: frontend
  scheme: http
  hostname: ""
  index: /
  port_map: "8089"
  category: Web
  tagline:
    cs_cz: Web Nadačního fondu Nová naděje
    en_us: Website of the Nová naděje foundation
  description:
    cs_cz: Web, dárcovský portál a potvrzení o daru. Po instalaci otevřete web a vyplňte první nastavení; později ho změníte ve správě webu. Data v /DATA/AppData/nfnn, vygenerovaná hesla a klíče v secrets, zálohy v backups, obnova ze složky restore, logy v logs, MCP konektor pro správu na /mcp.
    en_us: Website, donor portal and donation receipts. After the install, open the site and fill in the first setup; the administration changes it later. Data in /DATA/AppData/nfnn, generated passwords and keys in secrets, backups in backups, a restore from the restore folder, logs in logs, the MCP connector of the administration at /mcp.
