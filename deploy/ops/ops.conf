server {
    listen 80;
    server_name _;

    location = / {
        return 302 /logs/;
    }

    location /logs/ {
        alias /logs/;
        autoindex on;
        autoindex_exact_size on;
        autoindex_localtime on;
        types {
            text/plain log txt;
            application/gzip gz;
        }
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "no-store" always;
    }

    location = /health {
        proxy_pass http://backend:8080/actuator/health;
    }

    location = /info {
        proxy_pass http://backend:8080/actuator/info;
    }
}
