services:
  app:
    image: myoung34/github-runner:latest
    restart: unless-stopped
    network_mode: bridge
    environment:
      REPO_URL: https://github.com/bzumik1/nfnn
      RUNNER_NAME: zima-nfnn
      LABELS: zima-nfnn
      RUNNER_WORKDIR: /tmp/runner/work
      RUNNER_SCOPE: repo
      ACCESS_TOKEN: ""
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /DATA/AppData/nfnn:/DATA/AppData/nfnn
      - /DATA/AppData/github-runner-nfnn:/tmp/runner
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.00"
x-casaos:
  title:
    custom: GitHub Runner — nfnn
  main: app
  scheme: http
  hostname: ""
  index: /
  category: Developer
  tagline:
    cs_cz: Automatické nasazení webu Nová naděje
    en_us: Automatic deploys for the Nová naděje site
  description:
    cs_cz: >-
      Self-hosted GitHub Actions runner. Po merge do main stáhne nové image
      z ghcr.io a restartuje stack v /DATA/AppData/nfnn. Neposlouchá na žádném
      portu, nemá webové rozhraní.
    en_us: >-
      Self-hosted GitHub Actions runner. After a merge to main it pulls the new
      images from ghcr.io and restarts the stack in /DATA/AppData/nfnn. Listens
      on no port and has no web UI.
