services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-novanadeje}
      POSTGRES_USER: ${DB_USERNAME:-novanadeje}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-novanadeje}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-novanadeje} -d ${DB_NAME:-novanadeje}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-novanadeje}
      DB_USERNAME: ${DB_USERNAME:-novanadeje}
      DB_PASSWORD: ${DB_PASSWORD:-novanadeje}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_AUTH: ${MAIL_AUTH:-true}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-true}
      CONTACT_RECIPIENT: ${CONTACT_RECIPIENT:-info@nfnn.cz}
      MAIL_FROM: ${MAIL_FROM:-info@nfnn.cz}
      REPORT_RECIPIENT: ${REPORT_RECIPIENT:-info@nfnn.cz}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      BANK_ACCOUNT_NUMBER: ${BANK_ACCOUNT_NUMBER:-5544332217/2010}
      BANK_IBAN: ${BANK_IBAN:-CZ2620100000005544332217}
      BANK_RECIPIENT_NAME: ${BANK_RECIPIENT_NAME:-Nadační fond Nová naděje}
      FIO_TOKEN: ${FIO_TOKEN:-}
      FIO_HISTORY_FROM: ${FIO_HISTORY_FROM:-}
      PAIRING_EXCLUDED_ACCOUNTS: ${PAIRING_EXCLUDED_ACCOUNTS:-}
      RECEIPT_SIGNATORY_NAME: ${RECEIPT_SIGNATORY_NAME:-Pavel Znamenáček}
      RECEIPT_SIGNATORY_ROLE: ${RECEIPT_SIGNATORY_ROLE:-předseda správní rady}
      RECEIPT_FIRST_YEAR: ${RECEIPT_FIRST_YEAR:-2026}
      JWT_SECRET: ${JWT_SECRET:-}
    volumes:
      - backend-secrets:/secrets

  mcp:
    build:
      context: ./mcp
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      LOG_FILE: ""

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
      - mcp
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  postgres-data:
  backend-secrets:
