map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map "$http_x_forwarded_for$http_forwarded$http_x_real_ip" $nfnn_direct {
    ""      1;
    default 0;
}

map $request_uri $request_path {
    "~^(?<path>[^?]*)" $path;
}

map $status $immutable_cache_control {
    "~^(?:200|206|304)$" "public, max-age=31536000, immutable";
    default              "no-store";
}

map $status $image_cache_control {
    "~^(?:200|206|304)$" "public, max-age=3600";
    default              "no-store";
}

map $status $image_edge_cache_control {
    "~^(?:200|206|304)$" "max-age=3600, stale-if-error=604800";
    default              "no-store";
}

map $status $shell_edge_cache_control {
    "~^(?:200|304)$" "max-age=0, stale-if-error=604800";
    default          "no-store";
}

map $uri $app_page {
    default @unknown_page;
    "~^/$"                               /index.html;
    "~^/o-nas$"                          /index.html;
    "~^/prispet$"                        /index.html;
    "~^/zasady-ochrany-osobnich-udaju$"  /index.html;
    "~^/aktuality$"                      /index.html;
    "~^/aktuality/[^/]+$"                /index.html;
    "~^/projekty$"                       /index.html;
    "~^/projekty/[^/]+$"                 /index.html;
    "~^/obnova-hesla$"                   /index.html;
    "~^/pripojeni$"                      /index.html;
    "~^/prvni-nastaveni$"                /index.html;
    "~^/potvrzeni-emailu$"               /index.html;
    "~^/overit$"                         /index.html;
    "~^/aplikace$"                       /index.html;
    "~^/darce$"                          /index.html;
    "~^/darce/prehled$"                  /index.html;
    "~^/darce/dary$"                     /index.html;
    "~^/darce/potvrzeni$"                /index.html;
    "~^/darce/ucty$"                     /index.html;
    "~^/darce/udaje$"                    /index.html;
    "~^/donor$"                          /index.html;
    "~^/donor/prehled$"                  /index.html;
    "~^/donor/dary$"                     /index.html;
    "~^/donor/potvrzeni$"                /index.html;
    "~^/donor/ucty$"                     /index.html;
    "~^/donor/udaje$"                    /index.html;
    "~^/sprava$"                         /index.html;
    "~^/sprava/vice$"                    /index.html;
    "~^/sprava/platby$"                  /index.html;
    "~^/sprava/darci$"                   /index.html;
    "~^/sprava/darci/[^/]+$"             /index.html;
    "~^/sprava/darci/[^/]+/[^/]+$"       /index.html;
    "~^/sprava/hromadna-potvrzeni$"      /index.html;
    "~^/sprava/spravci$"                 /index.html;
    "~^/sprava/starsi-symboly$"          /index.html;
    "~^/sprava/prehledy$"                /index.html;
    "~^/sprava/aktuality$"               /index.html;
    "~^/sprava/aktuality/nova$"          /index.html;
    "~^/sprava/aktuality/[^/]+$"         /index.html;
    "~^/sprava/projekty$"                /index.html;
    "~^/sprava/projekty/nova$"           /index.html;
    "~^/sprava/projekty/[^/]+$"          /index.html;
    "~^/sprava/o-nas$"                   /index.html;
    "~^/sprava/lide-fondu$"              /index.html;
    "~^/sprava/zalohy$"                  /index.html;
    "~^/sprava/upozorneni$"              /index.html;
    "~^/sprava/logy$"                    /index.html;
    "~^/sprava/nastaveni$"               /index.html;
    "~^/sprava/historie$"                /index.html;
}

map $remote_addr $logged {
    127.0.0.1 0;
    default   1;
}

log_format anonymous '$time_iso8601 $request_method $request_path $status $body_bytes_sent $request_time $upstream_response_time';
log_format anonymous_unsized '$time_iso8601 $request_method $request_path $status $request_time $upstream_response_time';

limit_req_zone $binary_remote_addr zone=mcp:1m rate=10r/s;

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log anonymous if=$logged;
    access_log /logs/nginx-access.log anonymous if=$logged;

    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types application/javascript application/json application/manifest+json application/problem+json font/ttf image/svg+xml text/css text/plain;

    charset_types application/javascript application/json application/manifest+json image/svg+xml text/css text/plain text/xml;

    location /api/ {
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
        client_max_body_size 1m;
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-Ssl "";
        proxy_set_header X-Nfnn-Direct $nfnn_direct;
    }

    location = /api/admin/content/media {
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
        client_max_body_size 11m;
        proxy_pass http://backend:8080/api/admin/content/media;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-Ssl "";
        proxy_set_header X-Nfnn-Direct $nfnn_direct;
    }

    location ~ "^/api/admin/donations/receipt-signatures/[0-9a-fA-F-]{36}$" {
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
        client_max_body_size 11m;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-Ssl "";
        proxy_set_header X-Nfnn-Direct $nfnn_direct;
    }

    location = /api/donations/receipts/status {
        access_log /var/log/nginx/access.log anonymous_unsized if=$logged;
        access_log /logs/nginx-access.log anonymous_unsized if=$logged;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
        client_max_body_size 1k;
        proxy_pass http://backend:8080/api/donations/receipts/status;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-Ssl "";
        proxy_set_header X-Nfnn-Direct $nfnn_direct;
    }

    location = /api/operations/setup/restore {
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
        client_max_body_size 4g;
        proxy_request_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_pass http://backend:8080/api/operations/setup/restore;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-Ssl "";
        proxy_set_header X-Nfnn-Direct $nfnn_direct;
    }

    location = /api/operations/client-errors {
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
        client_max_body_size 4k;
        proxy_pass http://backend:8080/api/operations/client-errors;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-Ssl "";
        proxy_set_header X-Nfnn-Direct $nfnn_direct;
    }

    location = /api/live {
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
        add_header X-Accel-Buffering "no" always;
        client_max_body_size 1k;
        proxy_pass http://backend:8080/api/live;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        gzip off;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-Ssl "";
        proxy_set_header X-Nfnn-Direct $nfnn_direct;
    }

    location = /.well-known/oauth-authorization-server {
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
        proxy_pass http://backend:8080/.well-known/oauth-authorization-server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-Ssl "";
        proxy_set_header X-Nfnn-Direct "";
    }

    location = /mcp {
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
        limit_req zone=mcp burst=20 nodelay;
        client_max_body_size 1m;
        proxy_pass http://mcp:8081/mcp;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-Ssl "";
        proxy_set_header X-Nfnn-Direct "";
    }

    location = /mcp-photos {
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
        limit_req zone=mcp burst=20 nodelay;
        client_max_body_size 11m;
        proxy_pass http://mcp:8081/mcp-photos;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-Ssl "";
        proxy_set_header X-Nfnn-Direct "";
    }

    location = /.well-known/oauth-protected-resource/mcp {
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
        proxy_pass http://mcp:8081/.well-known/oauth-protected-resource/mcp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-Ssl "";
        proxy_set_header X-Nfnn-Direct "";
    }

    location ~ "^/overit/?$" {
        charset utf-8;
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
        add_header Cloudflare-CDN-Cache-Control $shell_edge_cache_control always;
        add_header X-Robots-Tag "noindex" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /ngsw.json {
        if (-f /logs/service-worker.off) {
            return 404;
        }
        charset utf-8;
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /ngsw-worker.js {
        if (-f /logs/service-worker.off) {
            rewrite ^ /safety-worker.js last;
        }
        charset utf-8;
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /manifest.webmanifest {
        types {
            application/manifest+json webmanifest;
        }
        charset utf-8;
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header Cloudflare-CDN-Cache-Control $shell_edge_cache_control always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location / {
        charset utf-8;
        try_files $uri $app_page;
        add_header Cache-Control "no-cache" always;
        add_header Cloudflare-CDN-Cache-Control $shell_edge_cache_control always;
        include /etc/nginx/snippets/security-headers.conf;

        location ~ "^/(?:chunk|main|polyfills|styles|worker)-[A-Za-z0-9_-]{8}\.(?:js|css)$" {
            try_files $uri =404;
            add_header Cache-Control $immutable_cache_control always;
            include /etc/nginx/snippets/security-headers.conf;
        }

        location ~* "\.(?:js|mjs|css|map|json|webmanifest|txt|xml|ico|png|jpe?g|gif|svg|webp|avif|woff2?|ttf|otf|pdf)$" {
            try_files $uri =404;
            add_header Cache-Control "no-cache" always;
            add_header Cloudflare-CDN-Cache-Control $shell_edge_cache_control always;
            include /etc/nginx/snippets/security-headers.conf;
        }
    }

    location @unknown_page {
        error_page 404 /index.html;
        return 404;
    }

    location /media/ {
        add_header Cache-Control $immutable_cache_control always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location /images/ {
        charset utf-8;
        add_header Cache-Control $image_cache_control always;
        add_header Cloudflare-CDN-Cache-Control $image_edge_cache_control always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location ^~ /receipt-fonts/ {
        types {
            font/ttf   ttf;
            text/plain txt;
        }
        charset utf-8;
        try_files $uri =404;
        add_header Cache-Control $image_cache_control always;
        add_header Cloudflare-CDN-Cache-Control $image_edge_cache_control always;
        include /etc/nginx/snippets/security-headers.conf;

        location ~ "^/receipt-fonts/(?:body|body-bold|heading)\.[0-9a-f]{16}\.ttf$" {
            try_files $uri =404;
            add_header Cache-Control $immutable_cache_control always;
            include /etc/nginx/snippets/security-headers.conf;
        }
    }
}
