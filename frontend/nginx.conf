map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map "$http_x_forwarded_for$http_forwarded$http_x_real_ip" $nfnn_direct {
    ""      1;
    default 0;
}

map $request_uri $request_path {
    "~^(?<path>[^?]*)" $path;
}

map $status $immutable_cache_control {
    "~^(?:200|206|304)$" "public, max-age=31536000, immutable";
    default              "no-store";
}

map $status $image_cache_control {
    "~^(?:200|206|304)$" "public, max-age=3600";
    default              "no-store";
}

map $remote_addr $logged {
    127.0.0.1 0;
    default   1;
}

log_format anonymous '$time_iso8601 $request_method $request_path $status $body_bytes_sent $request_time $upstream_response_time';

limit_req_zone $binary_remote_addr zone=mcp:1m rate=10r/s;

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log anonymous if=$logged;
    access_log /logs/nginx-access.log anonymous if=$logged;

    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types application/javascript application/json application/problem+json image/svg+xml text/css text/plain;

    location /api/ {
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
        client_max_body_size 11m;
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-Ssl "";
        proxy_set_header X-Nfnn-Direct $nfnn_direct;
    }

    location = /api/operations/setup/restore {
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
        client_max_body_size 4g;
        proxy_request_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_pass http://backend:8080/api/operations/setup/restore;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-Ssl "";
        proxy_set_header X-Nfnn-Direct $nfnn_direct;
    }

    location = /.well-known/oauth-authorization-server {
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
        proxy_pass http://backend:8080/.well-known/oauth-authorization-server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-Ssl "";
    }

    location = /mcp {
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
        limit_req zone=mcp burst=20 nodelay;
        client_max_body_size 1m;
        proxy_pass http://mcp:8081/mcp;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-Ssl "";
    }

    location = /mcp-photos {
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
        limit_req zone=mcp burst=20 nodelay;
        client_max_body_size 11m;
        proxy_pass http://mcp:8081/mcp-photos;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-Ssl "";
    }

    location = /.well-known/oauth-protected-resource/mcp {
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
        proxy_pass http://mcp:8081/.well-known/oauth-protected-resource/mcp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-Ssl "";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;

        location ~ "^/(?:chunk|main|polyfills|styles)-[A-Za-z0-9_-]{8}\.(?:js|css)$" {
            try_files $uri =404;
            add_header Cache-Control $immutable_cache_control always;
            include /etc/nginx/snippets/security-headers.conf;
        }

        location ~* "\.(?:js|mjs|css|map|json|webmanifest|txt|xml|ico|png|jpe?g|gif|svg|webp|avif|woff2?|ttf|otf|pdf)$" {
            try_files $uri =404;
            add_header Cache-Control "no-cache" always;
            include /etc/nginx/snippets/security-headers.conf;
        }
    }

    location /media/ {
        add_header Cache-Control $immutable_cache_control always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location /images/ {
        add_header Cache-Control $image_cache_control always;
        include /etc/nginx/snippets/security-headers.conf;
    }
}
