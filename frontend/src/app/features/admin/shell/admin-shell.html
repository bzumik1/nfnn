@if (sheet()) {
  <div class="admin-sheet-backdrop" aria-hidden="true"></div>
} @else {
  <app-header />
}

<div class="admin-frame" [class.admin-sheet]="sheet()">
  @if (sheet()) {
    <div class="admin-sheet-cover" aria-hidden="true"></div>
    <app-sheet-head
      role="banner"
      class="admin-sheet-head"
      [title]="pageTitle()"
      (backPressed)="back()"
      (closePressed)="close()"
    />
  }
  <app-side-nav navId="admin-nav" [groups]="groups" [label]="navLabel" [panel]="!compact()">
    <div class="admin-content" [class.ui-sheet-page]="sheet()">
      <app-first-download-notice (releasesFocus)="focusPage(null)" />
      @if (lock.locked()) {
        @if (lock.panel(); as panel) {
          <ng-container *ngComponentOutlet="panel" />
        }
      }
      @if (!lock.locked() || lock.keepsPage()) {
        <div
          #page
          class="admin-page"
          [hidden]="lock.locked()"
          [attr.inert]="lock.locked() ? '' : null"
          [appSuspendsDialogs]="lock.locked()"
        >
          <router-outlet />
        </div>
      }
    </div>
  </app-side-nav>
</div>

<app-alerts-offer />
