@switch (state()) {
  @case ('loading') {
    <section class="detail detail--waiting ui-intro">
      <div class="ui-intro__head ui-container">
        <p class="waiting" role="status" i18n="@@content.detail.loading">Načítáme stránku…</p>
      </div>
    </section>
  }
  @case ('error') {
    <section class="detail detail--waiting ui-intro">
      <div class="ui-intro__head ui-container">
        <p class="waiting" role="alert" i18n="@@content.detail.error">
          Stránku se nepodařilo načíst.
        </p>
        <button
          appNeedsConnection
          type="button"
          class="ui-cta ui-cta--ghost"
          (click)="retry()"
          i18n="@@content.detail.retry"
        >
          Zkusit znovu
        </button>
      </div>
    </section>
  }
  @case ('missing') {
    <app-not-found [missing]="kind" />
  }
  @case ('ready') {
    @if (page(); as page) {
      <app-content-article [page]="page" [kind]="kind" />
    }
  }
}
