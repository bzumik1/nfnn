<section id="uvod" class="hero">
  <img
    fetchpriority="high"
    srcset="
      /images/hero-1280.webp 1280w,
      /images/hero-1920.webp 1920w,
      /images/hero-2560.webp 2560w
    "
    sizes="max(100vw, 150vh, 900px)"
    src="/images/hero-1920.webp"
    width="1920"
    height="1280"
    alt=""
    class="real-img hero-img"
  />
  <div class="hero-top-shade"></div>
  <div class="hero-overlay"></div>

  <div class="hero-content">
    <p class="hero-eyebrow" i18n="@@home.hero.eyebrow">nadační fond</p>
    <h1 class="hero-title" i18n="@@home.hero.title">Nová naděje</h1>
    <p class="hero-lead" i18n="@@home.hero.lead">
      Pomáháme zdravotně postiženým dětem k lepšímu životu. Každý příspěvek mění příběh.
    </p>
    <div class="hero-btns">
      <a class="btn-primary" routerLink="/" fragment="prispet" i18n="@@home.hero.cta.primary"
        >Přispět nyní</a
      >
      <a class="btn-ghost" routerLink="/" fragment="projekty" i18n="@@home.hero.cta.secondary"
        >Naše projekty</a
      >
    </div>
  </div>

  <div class="hero-scroll" aria-hidden="true">
    <div class="hero-scroll-mouse">
      <div class="hero-scroll-dot"></div>
    </div>
  </div>
</section>
