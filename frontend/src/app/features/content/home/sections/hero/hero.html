<section #hero id="uvod" class="hero">
  <img
    #photo
    fetchpriority="high"
    srcset="/images/hero-1024.webp 1024w, /images/hero-1536.webp 1536w"
    sizes="max(100vw, 150vh, 900px)"
    src="/images/hero-1536.webp"
    width="1536"
    height="1024"
    alt=""
    class="real-img hero-img"
  />
  <div class="hero-top-shade"></div>
  <div class="hero-overlay"></div>

  <div #fullScreen class="hero-full-screen" aria-hidden="true">
    <div #tabBarStrip class="hero-tab-bar-strip"></div>
  </div>

  <div #content class="hero-content">
    <p class="hero-eyebrow" i18n="@@home.hero.eyebrow">nadační fond</p>
    <h1 class="hero-title" i18n="@@home.hero.title">Nová naděje</h1>
    <p #lead class="hero-lead" [style.max-width.px]="leadWidthBesideFace()" i18n="@@home.hero.lead">
      Pomáháme zdravotně postiženým dětem k&nbsp;lepšímu životu. Každý příspěvek mění příběh.
    </p>
    @if (showsDonate()) {
      <div #buttons class="hero-btns" [style.margin-top.px]="buttonsDrop() || null">
        <a class="ui-cta" routerLink="/prispet" i18n="@@home.hero.cta.primary">Přispět</a>
        @if (showsWhereWeHelp()) {
          <a
            class="ui-cta ui-cta--ghost ui-cta--on-image"
            routerLink="/projekty"
            i18n="@@home.hero.cta.secondary"
            >Kde pomáháme</a
          >
        }
      </div>
      @if (showsFigures()) {
        <app-stats-bar class="hero-figures on-image" [ownEntrance]="false" />
      }
    }
  </div>
</section>
