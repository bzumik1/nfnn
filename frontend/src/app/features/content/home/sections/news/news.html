<section id="aktuality" class="news section-pad">
  <div class="ui-container">
    <header class="news-header">
      <p class="ui-eyebrow" i18n="@@home.news.eyebrow">Co je nového</p>
      <h2 class="title" i18n="@@home.news.title">Aktuality</h2>
    </header>

    @if (items().length > 0) {
      <div class="news-grid">
        @for (item of items(); track item.id) {
          <app-news-card [item]="item" />
        }
      </div>
      <p class="all">
        <a class="all-link ui-cta ui-cta--ghost" routerLink="/aktuality" i18n="@@home.news.all"
          >Všechny aktuality</a
        >
      </p>
    } @else {
      <div class="news-grid">
        <app-news-card placeholder="dominik" />
        <app-news-card placeholder="report" />
        <app-news-card placeholder="autism" />
      </div>
    }
  </div>
</section>
