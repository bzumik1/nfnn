<article class="card">
  @if (image(); as src) {
    <div class="card-image">
      <img
        loading="lazy"
        [src]="src"
        [srcset]="imageSet()"
        sizes="(max-width: 768px) 100vw, 400px"
        width="480"
        height="300"
        alt=""
        [appFocalPoint]="item().coverImage?.focalPoint"
        focalShape="projectCard"
        class="real-img"
      />
    </div>
  }
  <div class="card-body">
    <div class="card-meta">
      @if (item().tag) {
        <span class="card-tag">{{ item().tag }}</span>
      }
      <span class="card-year">{{ item().year }}</span>
    </div>
    <h3 class="card-title">
      @if (linked()) {
        <a class="card-link" [routerLink]="['/projekty', item().slug]">{{ item().title }}</a>
      } @else {
        {{ item().title }}
      }
    </h3>
    <p class="card-desc">{{ item().perex }}</p>
    <span class="card-more" aria-hidden="true" i18n="@@home.projects.card.more">Celý příběh →</span>
  </div>
</article>
