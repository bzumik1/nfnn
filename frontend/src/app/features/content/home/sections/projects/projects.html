<section id="projekty" class="projects section-pad">
  <div class="ui-container">
    <header class="projects-header">
      <p class="ui-eyebrow" i18n="@@home.projects.eyebrow">Příběhy dětí</p>
      <h2 class="title" i18n="@@home.projects.title">Komu jsme pomohli</h2>
      <p class="lead" i18n="@@home.projects.lead">
        Každý projekt je skutečný příběh skutečného dítěte.
      </p>
    </header>

    <div class="projects-grid">
      @if (items().length > 0) {
        @for (item of items(); track item.id) {
          <app-project-card [item]="item" />
        }
      } @else {
        <app-project-card project="dominik" />
        <app-project-card project="anicka" />
        <app-project-card project="tomas" />
        <app-project-card project="eliska" />
        <app-project-card project="martin" />
      }
    </div>
  </div>
</section>
