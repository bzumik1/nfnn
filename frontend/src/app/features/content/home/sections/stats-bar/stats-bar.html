<div class="stats">
  <div class="stats-grid">
    @for (stat of stats; track stat.label; let order = $index) {
      <div class="stat" [class.is-waiting]="waiting()" [style.--stat-order]="order">
        <div class="stat-value">
          <span class="visually-hidden">{{ stat.final }}</span>
          <span aria-hidden="true">{{ shown()[order] }}</span>
        </div>
        <div class="stat-label">{{ stat.label }}</div>
      </div>
    }
  </div>
</div>
