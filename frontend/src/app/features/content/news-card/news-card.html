<article class="news-card">
  @if (image(); as src) {
    <div class="news-image">
      <img
        loading="lazy"
        [src]="src"
        [srcset]="imageSet()"
        sizes="(max-width: 768px) 100vw, 400px"
        width="480"
        height="300"
        alt=""
        [appFocalPoint]="item().coverImage?.focalPoint"
        focalShape="newsCard"
        class="real-img"
      />
    </div>
  }
  <div class="news-body">
    <div class="news-meta">
      @if (item().tag) {
        <span class="news-tag">{{ item().tag }}</span>
      }
      <span class="news-date">{{ date() }}</span>
    </div>
    <h3 class="news-title">
      @if (linked()) {
        <a class="news-link" [routerLink]="['/aktuality', item().slug]">{{ item().title }}</a>
      } @else {
        {{ item().title }}
      }
    </h3>
    <p class="news-perex">{{ item().perex }}</p>
    <span class="news-more" aria-hidden="true" i18n="@@home.news.card.more">Číst dál →</span>
  </div>
</article>
