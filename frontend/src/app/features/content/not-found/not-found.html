<section class="not-found ui-intro">
  <div class="ui-container">
    <p class="ui-eyebrow ui-eyebrow--on-inverse" i18n="@@content.notFound.eyebrow">Chyba 404</p>
    <h1 class="ui-intro__title" i18n="@@content.notFound.title">Tuhle stránku jsme nenašli</h1>
    <p class="ui-intro__lead" i18n="@@content.notFound.lead">
      Odkaz je možná starý nebo v adrese chybí písmenko. Zbytek webu je na svém místě.
    </p>
    <div class="actions">
      <a class="ui-cta" routerLink="/" i18n="@@content.notFound.home">Zpět na úvodní stránku</a>
      <a
        class="ui-cta ui-cta--ghost ui-cta--on-inverse"
        routerLink="/"
        fragment="kontakt"
        i18n="@@content.notFound.contact"
        >Napište nám</a
      >
    </div>
  </div>
</section>
