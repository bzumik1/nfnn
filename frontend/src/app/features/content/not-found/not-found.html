<section class="not-found">
  <div class="section-inner">
    <p class="eyebrow" i18n="@@content.notFound.eyebrow">Chyba 404</p>
    <h1 class="title" i18n="@@content.notFound.title">Tuhle stránku jsme nenašli</h1>
    <p class="lead" i18n="@@content.notFound.lead">
      Odkaz je možná starý nebo v adrese chybí písmenko. Zbytek webu je na svém místě.
    </p>
    <div class="actions">
      <a class="btn-primary" routerLink="/" i18n="@@content.notFound.home"
        >Zpět na úvodní stránku</a
      >
      <a class="btn-ghost" routerLink="/" fragment="kontakt" i18n="@@content.notFound.contact"
        >Napište nám</a
      >
    </div>
  </div>
</section>
