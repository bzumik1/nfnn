<span class="account ui-separated">
  <span class="number">
    @if (czech()) {
      <app-bank-logo class="logo" [account]="account()" [size]="24" />
    }
    @if (split().bankCode) {
      <span class="ui-figures breaks-before-bank-code"
        >{{ split().head }}<wbr />{{ split().bankCode }}</span
      >
    } @else {
      <span class="ui-figures">{{ account() }}</span>
    }
  </span>
  @if (bank(); as bank) {
    &ngsp;<span class="bank ui-separated__item"
      ><span class="separator ui-separated__separator">·&nbsp;</span>{{ bank }}</span
    >
  }
</span>
