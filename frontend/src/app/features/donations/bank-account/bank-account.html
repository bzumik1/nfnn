<span class="account">
  <span class="number">
    @if (czech()) {
      <app-bank-logo class="logo" [account]="account()" [size]="24" />
    }
    <span class="ui-figures">{{ account() }}</span>
  </span>
  @if (bank(); as bank) {
    &ngsp;<span class="bank"><span class="separator">·&nbsp;</span>{{ bank }}</span>
  }
</span>
