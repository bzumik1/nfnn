@if (image(); as source) {
  <img
    loading="lazy"
    [src]="source"
    [attr.width]="size()"
    [attr.height]="size()"
    alt=""
    (error)="failed.set(true)"
  />
} @else if (monogram(); as letters) {
  <span
    class="bank-monogram"
    [class.bank-monogram--long]="longMonogram()"
    [attr.data-monogram]="letters"
  ></span>
} @else {
  <svg
    class="bank-sign"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="1.8"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >
    <path d="M3 10 12 4l9 6" />
    <path d="M5 10v8M9.5 10v8M14.5 10v8M19 10v8" />
    <path d="M3 20h18" />
  </svg>
}
