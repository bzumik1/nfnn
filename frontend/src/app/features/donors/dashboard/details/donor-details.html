<app-page-title i18n="@@donor.details.heading">Údaje a zabezpečení</app-page-title>

<app-profile-card (sessionEnded)="donations.sendToSignIn()" />

<app-account-card
  [passkeyCount]="passkeyCount()"
  (sessionEnded)="donations.sendToSignIn()"
  (createPasskey)="passkeys.openForm()"
/>

<app-passkeys-card
  #passkeys
  (sessionEnded)="donations.sendToSignIn()"
  (countChanged)="passkeyCount.set($event)"
/>
