@switch (donations.state()) {
  @case ('loading') {
    <p class="dashboard-loading" role="status" i18n="@@donor.dashboard.loading">
      Načítáme vaše dary…
    </p>
  }
  @case ('error') {
    <app-load-failure
      class="dashboard-error"
      [retrying]="donations.retrying()"
      (retry)="donations.retry()"
    >
      @switch (page()) {
        @case ('gifts') {
          <ng-container i18n="@@donor.gifts.error.text">Dary se nepodařilo načíst.</ng-container>
        }
        @case ('receipts') {
          <ng-container i18n="@@donor.receipts.error.text"
            >Potvrzení o&nbsp;daru se nepodařilo načíst.</ng-container
          >
        }
        @default {
          <ng-container i18n="@@donor.dashboard.error.text"
            >Přehled darů se nepodařilo načíst.</ng-container
          >
        }
      }
    </app-load-failure>
  }
}
