<section class="send-gift" aria-labelledby="send-gift-title">
  <h2 id="send-gift-title" class="ui-group-title" i18n="@@donor.sendGift.title">Poslat dar</h2>
  <app-payment-panel
    #panel
    idPrefix="send-gift"
    [grouped]="true"
    [variableSymbol]="variableSymbol()"
  >
    <p afterBankDetails class="ui-group-note send-gift-lead" i18n="@@donor.sendGift.lead">
      Variabilní symbol je v údajích i v QR kódu už vyplněný. Uveďte ho u každé platby, dar se tak
      přiřadí k vašemu účtu a objeví se v tomto přehledu.
    </p>
    @if (variableSymbol(); as symbol) {
      <app-standing-order
        afterBankDetails
        class="send-gift-standing"
        [grouped]="true"
        [variableSymbol]="symbol"
        [account]="panel.accountState()"
        [amount]="panel.amount()"
        (retryRequested)="panel.retry()"
      />
    }
  </app-payment-panel>
</section>
