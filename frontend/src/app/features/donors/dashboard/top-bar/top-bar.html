<header class="topbar">
  <div class="topbar-inner">
    <div class="topbar-left">
      <a class="topbar-brand" routerLink="/">
        <img src="/images/logo.svg" alt="Nová naděje – nadační fond" i18n-alt="@@layout.header.logoAlt" class="topbar-logo" />
      </a>
      <a class="topbar-home" routerLink="/">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12" />
          <polyline points="12 19 5 12 12 5" />
        </svg>
        <span class="topbar-home-label" i18n="@@donor.dashboard.home">Hlavní stránka</span>
        <span class="topbar-home-label-short" i18n="@@donor.dashboard.homeShort">Domů</span>
      </a>
    </div>
    <div class="topbar-right">
      <span class="topbar-greeting">
        <span i18n="@@donor.dashboard.welcome">Vítejte,</span> {{ donor()?.name }}
      </span>
      <button type="button" class="topbar-logout" (click)="logout()" [disabled]="signingOut()">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
          <polyline points="16 17 21 12 16 7" />
          <line x1="21" y1="12" x2="9" y2="12" />
        </svg>
        <span i18n="@@donor.dashboard.logout">Odhlásit se</span>
      </button>
    </div>
  </div>
</header>
