<div class="visually-hidden" aria-live="polite">
  @if (announcement(); as message) {
    <span>{{ message }}</span>
  }
</div>

@if (connectivity.offline()) {
  <button #pill type="button" class="offline-pill" aria-haspopup="dialog" (click)="openSheet()">
    <svg
      aria-hidden="true"
      width="16"
      height="16"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M2 2l20 20" />
      <path d="M8.5 16.5a5 5 0 0 1 7 0" />
      <path d="M5 12.86a10 10 0 0 1 5.17-2.69" />
      <path d="M19 12.86a10 10 0 0 0-2.07-1.37" />
      <path d="M2 8.82a15 15 0 0 1 4.18-2.65" />
      <path d="M22 8.82a15 15 0 0 0-11.29-3.76" />
      <path d="M12 20h.01" />
    </svg>
    <span>{{ label() }}</span>
  </button>
}

<ng-container #sheetHost />
