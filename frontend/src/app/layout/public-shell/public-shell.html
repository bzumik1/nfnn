<a class="skip-link" href="#obsah" (click)="skipToContent($event)" i18n="@@layout.skipToContent"
  >Přeskočit na obsah</a
>
@if (tabBar()) {
  <a
    class="skip-link"
    href="#navigace"
    (click)="skipToNavigation($event)"
    i18n="@@layout.skipToNavigation"
    >Přeskočit na navigaci</a
  >
}
<app-header />
<main #content id="obsah" tabindex="-1" [class.with-tab-bar]="roomForTabBar()">
  <router-outlet />
</main>
@if (tabBar()) {
  <app-tab-bar />
}
<app-signed-out-notice />
