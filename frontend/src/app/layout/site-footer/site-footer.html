<footer class="footer">
  <div class="section-inner">
    <div class="footer-top">
      <div class="footer-brand">
        <img
          src="/images/logo.svg"
          alt="Nová naděje – nadační fond"
          i18n-alt="@@layout.header.logoAlt"
        />
      </div>
      <div class="footer-links">
        <a routerLink="/" fragment="uvod" i18n="@@layout.header.nav.home">Domů</a>
        <a routerLink="/" fragment="o-nas" i18n="@@layout.header.nav.about">O nás</a>
        <a routerLink="/" fragment="projekty" i18n="@@layout.header.nav.projects">Projekty</a>
        <a routerLink="/" fragment="aktuality" i18n="@@layout.header.nav.news">Aktuality</a>
        <a routerLink="/" fragment="kontakt" i18n="@@layout.header.nav.contact">Kontakt</a>
      </div>
    </div>
    <div class="footer-bottom">
      <p i18n="@@layout.footer.copyright">
        © {{ year }} Nová naděje – nadační fond. Všechna práva vyhrazena.
      </p>
      <p i18n="@@layout.footer.registry">
        Zapsán u KS Ústí nad Labem, oddíl N, vložka 78 · IČO 27278794
      </p>
      <a
        class="footer-privacy"
        routerLink="/zasady-ochrany-osobnich-udaju"
        routerLinkActive="is-active"
        ariaCurrentWhenActive="page"
        i18n="@@layout.footer.privacy"
        >Zásady ochrany osobních údajů</a
      >
    </div>
  </div>
</footer>
