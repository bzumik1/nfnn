<footer class="footer">
  <div class="ui-container">
    <div class="footer-top">
      <div class="footer-brand">
        <img
          src="/images/logo-on-dark.svg"
          alt="Nová naděje – nadační fond"
          i18n-alt="@@layout.header.logoAlt"
        />
        <a class="footer-link footer-mail" href="mailto:info&#64;nfnn.cz">info&#64;nfnn.cz</a>
      </div>
      <nav
        class="footer-links"
        aria-label="Odkazy v patičce"
        i18n-aria-label="@@layout.footer.navLabel"
      >
        <a routerLink="/" fragment="uvod" i18n="@@layout.header.nav.home">Domů</a>
        <a routerLink="/" fragment="o-nas" i18n="@@layout.header.nav.about">O nás</a>
        <a
          [class.is-current]="current() === 'projekty'"
          [routerLink]="current() === 'projekty' ? '/projekty' : '/'"
          [fragment]="current() === 'projekty' ? undefined : 'projekty'"
          [attr.aria-current]="current() === 'projekty' ? 'page' : null"
          i18n="@@layout.header.nav.projects"
          >Kde pomáháme</a
        >
        <a
          [class.is-current]="current() === 'aktuality'"
          [routerLink]="current() === 'aktuality' ? '/aktuality' : '/'"
          [fragment]="current() === 'aktuality' ? undefined : 'aktuality'"
          [attr.aria-current]="current() === 'aktuality' ? 'page' : null"
          i18n="@@layout.header.nav.news"
          >Aktuality</a
        >
        <a routerLink="/" fragment="kontakt" i18n="@@layout.header.nav.contact">Kontakt</a>
        <a routerLink="/" fragment="prispet" i18n="@@layout.header.nav.donate">Přispět</a>
      </nav>
    </div>
    <div class="footer-bottom">
      <p i18n="@@layout.footer.copyright">
        © {{ year }} Nová naděje – nadační fond. Všechna práva vyhrazena.
      </p>
      <p i18n="@@layout.footer.registry">
        Zapsán u KS Ústí nad Labem, oddíl N, vložka 78 · IČO 27278794
      </p>
      <a
        class="footer-link"
        routerLink="/zasady-ochrany-osobnich-udaju"
        routerLinkActive="is-active"
        ariaCurrentWhenActive="page"
        i18n="@@layout.footer.privacy"
        >Zásady ochrany osobních údajů</a
      >
    </div>
  </div>
</footer>
