<nav class="nav" [class.is-scrolled]="scrolled() || menuOpen()">
  <div class="nav-inner">
    <a class="brand" routerLink="/" fragment="home" (click)="closeMenu()">
      <img src="/images/logo.svg" alt="Nová naděje – nadační fond" i18n-alt="@@layout.header.logoAlt" />
    </a>

    <div class="desktop-nav">
      <a class="nav-link" routerLink="/" fragment="home" i18n="@@layout.header.nav.home">Domů</a>
      <a class="nav-link" routerLink="/" fragment="about" i18n="@@layout.header.nav.about">O nás</a>
      <a class="nav-link" routerLink="/" fragment="projects" i18n="@@layout.header.nav.projects">Projekty</a>
      <a class="nav-link" routerLink="/" fragment="news" i18n="@@layout.header.nav.news">Aktuality</a>
      <a class="nav-link" routerLink="/" fragment="contact" i18n="@@layout.header.nav.contact">Kontakt</a>
      <a class="nav-cta" routerLink="/" fragment="donate" i18n="@@layout.header.nav.donate">Finanční příspěvek</a>
      <button type="button" class="nav-login" (click)="openLogin()" i18n="@@layout.header.nav.login">Přihlásit se</button>
    </div>

    <button
      type="button"
      class="mobile-menu-btn"
      [class.is-open]="menuOpen()"
      (click)="toggleMenu()"
      aria-label="Otevřít menu"
      i18n-aria-label="@@layout.header.toggleMenu"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>
</nav>

@if (menuOpen()) {
  <div class="mobile-menu">
    <a class="mobile-link" routerLink="/" fragment="home" (click)="closeMenu()" i18n="@@layout.header.nav.home">Domů</a>
    <a class="mobile-link" routerLink="/" fragment="about" (click)="closeMenu()" i18n="@@layout.header.nav.about">O nás</a>
    <a class="mobile-link" routerLink="/" fragment="projects" (click)="closeMenu()" i18n="@@layout.header.nav.projects">Projekty</a>
    <a class="mobile-link" routerLink="/" fragment="news" (click)="closeMenu()" i18n="@@layout.header.nav.news">Aktuality</a>
    <a class="mobile-link" routerLink="/" fragment="contact" (click)="closeMenu()" i18n="@@layout.header.nav.contact">Kontakt</a>
    <a class="mobile-cta" routerLink="/" fragment="donate" (click)="closeMenu()" i18n="@@layout.header.nav.donate">Finanční příspěvek</a>
    <button type="button" class="mobile-login" (click)="openLogin()" i18n="@@layout.header.mobile.login">👤 Přihlásit se</button>
  </div>
}
