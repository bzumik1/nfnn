<nav class="nav" [class.is-scrolled]="scrolled() || menuOpen()">
  <div class="nav-inner">
    <a class="brand" routerLink="/" fragment="uvod" (click)="closeMenu()">
      <img
        src="/images/logo.svg"
        alt="Nová naděje – nadační fond"
        i18n-alt="@@layout.header.logoAlt"
      />
    </a>

    <div class="desktop-nav">
      <a class="nav-link" routerLink="/" fragment="uvod" i18n="@@layout.header.nav.home">Domů</a>
      <a class="nav-link" routerLink="/" fragment="o-nas" i18n="@@layout.header.nav.about">O nás</a>
      <a class="nav-link" routerLink="/" fragment="projekty" i18n="@@layout.header.nav.projects"
        >Projekty</a
      >
      <a class="nav-link" routerLink="/" fragment="aktuality" i18n="@@layout.header.nav.news"
        >Aktuality</a
      >
      <a class="nav-link" routerLink="/" fragment="kontakt" i18n="@@layout.header.nav.contact"
        >Kontakt</a
      >
      <a class="nav-cta" routerLink="/" fragment="prispet" i18n="@@layout.header.nav.donate"
        >Finanční příspěvek</a
      >
      @if (auth.signedIn()) {
        <a
          #portalLink
          class="nav-login"
          routerLink="/darce/prehled"
          i18n="@@layout.header.nav.portal"
          >Můj přehled</a
        >
      } @else {
        <button
          type="button"
          class="nav-login"
          (click)="openLogin()"
          i18n="@@layout.header.nav.login"
        >
          Přihlásit se
        </button>
      }
    </div>

    <button
      #menuButton
      type="button"
      class="mobile-menu-btn"
      [class.is-open]="menuOpen()"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="mobile-menu"
      [attr.aria-label]="menuOpen() ? closeMenuLabel : openMenuLabel"
      (click)="toggleMenu()"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>
</nav>

@if (menuOpen()) {
  <div id="mobile-menu" class="mobile-menu">
    <a
      class="mobile-link"
      routerLink="/"
      fragment="uvod"
      (click)="closeMenu()"
      i18n="@@layout.header.nav.home"
      >Domů</a
    >
    <a
      class="mobile-link"
      routerLink="/"
      fragment="o-nas"
      (click)="closeMenu()"
      i18n="@@layout.header.nav.about"
      >O nás</a
    >
    <a
      class="mobile-link"
      routerLink="/"
      fragment="projekty"
      (click)="closeMenu()"
      i18n="@@layout.header.nav.projects"
      >Projekty</a
    >
    <a
      class="mobile-link"
      routerLink="/"
      fragment="aktuality"
      (click)="closeMenu()"
      i18n="@@layout.header.nav.news"
      >Aktuality</a
    >
    <a
      class="mobile-link"
      routerLink="/"
      fragment="kontakt"
      (click)="closeMenu()"
      i18n="@@layout.header.nav.contact"
      >Kontakt</a
    >
    <a
      class="mobile-cta"
      routerLink="/"
      fragment="prispet"
      (click)="closeMenu()"
      i18n="@@layout.header.nav.donate"
      >Finanční příspěvek</a
    >
    @if (auth.signedIn()) {
      <a class="mobile-login" routerLink="/darce/prehled" (click)="closeMenu()">
        <svg
          class="mobile-login-icon"
          aria-hidden="true"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="8" r="4" />
          <path d="M4 21a8 8 0 0 1 16 0" />
        </svg>
        <span i18n="@@layout.header.mobile.portal">Můj přehled</span>
      </a>
    } @else {
      <button type="button" class="mobile-login" (click)="openLogin()">
        <svg
          class="mobile-login-icon"
          aria-hidden="true"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="8" r="4" />
          <path d="M4 21a8 8 0 0 1 16 0" />
        </svg>
        <span i18n="@@layout.header.mobile.login">Přihlásit se</span>
      </button>
    }
  </div>
}
