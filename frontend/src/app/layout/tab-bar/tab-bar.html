<nav #bar class="tab-bar" [attr.aria-label]="label">
  <ul class="tab-bar-list">
    @for (tab of tabs; track tab.id) {
      <li class="tab-bar-item">
        <a
          class="tab"
          [class.tab--current]="current() === tab.id"
          [href]="hrefOf(tab)"
          [attr.aria-current]="
            current() === tab.id ? (memory.isAtRoot(tab) ? 'page' : 'true') : null
          "
          (click)="open($event, tab)"
        >
          @switch (tab.id) {
            @case ('about') {
              <svg
                class="tab-icon"
                aria-hidden="true"
                viewBox="1270 205 500 420"
                fill="none"
                stroke="currentColor"
                stroke-linejoin="round"
              >
                <path
                  vector-effect="non-scaling-stroke"
                  d="M1407.6 605.5C1386.6 605.7 1377.1 592.3 1373.5 573.1C1368.6 546.3 1373.7 518.2 1383.8 493.3C1387.1 485.1 1391.3 477.4 1394.9 469.3C1396.3 466.2 1398.5 462.0 1396.8 458.6C1395.3 455.5 1391.4 454.2 1388.5 453.0C1381.9 450.1 1375.3 447.2 1368.8 444.3C1343.2 432.8 1311.2 420.1 1293.3 397.7C1284.2 386.3 1278.4 368.5 1290.5 357.0C1299.1 348.8 1311.7 346.0 1322.9 343.7C1340.9 340.1 1364.1 335.1 1382.2 335.1C1391.8 335.1 1401.1 335.8 1410.6 337.3C1413.9 337.9 1418.5 338.8 1420.7 335.5C1422.5 332.8 1422.3 328.9 1422.2 325.8C1422.0 318.6 1420.9 311.5 1419.6 304.5C1415.1 279.3 1401.6 236.5 1435.2 225.3C1440.2 223.6 1445.6 222.8 1450.9 222.7C1496.2 221.0 1536.7 253.4 1562.1 288.0C1569.4 298.1 1576.1 308.8 1581.4 320.1C1583.9 325.5 1585.4 332.9 1591.7 335.1C1601.4 338.5 1620.2 336.2 1630.5 334.7C1649.6 332.0 1668.6 328.4 1687.7 325.9C1695.0 324.9 1702.2 323.5 1709.6 323.6C1723.5 323.8 1746.4 325.9 1749.1 343.0C1751.0 354.9 1744.3 367.4 1738.1 377.1C1723.4 400.0 1702.8 418.4 1682.7 436.4C1677.4 441.2 1672.0 445.9 1666.3 450.2C1662.3 453.2 1657.7 456.7 1656.6 461.8C1655.6 466.8 1658.6 471.2 1661.5 474.9C1666.8 481.7 1672.6 488.2 1677.7 495.2C1691.5 514.9 1699.0 537.8 1692.0 561.5C1689.4 570.4 1684.8 578.5 1677.6 584.4C1664.2 595.4 1647.1 593.3 1631.3 590.4C1597.0 583.9 1566.0 568.9 1540.6 544.9C1532.4 537.1 1525.3 528.2 1519.2 518.6C1517.3 515.5 1514.7 508.9 1510.3 508.9C1506.4 508.9 1503.7 514.1 1501.8 517.0C1496.1 525.8 1491.0 535.0 1485.0 543.6C1467.9 568.7 1441.1 605.2 1407.6 605.5Z"
                />
              </svg>
            }
            @case ('news') {
              <svg
                class="tab-icon"
                aria-hidden="true"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect
                  vector-effect="non-scaling-stroke"
                  x="4"
                  y="3"
                  width="16"
                  height="18"
                  rx="2"
                />
                <path vector-effect="non-scaling-stroke" d="M8 8h8M8 12h8M8 16h5" />
              </svg>
            }
            @case ('projects') {
              <svg
                class="tab-icon"
                aria-hidden="true"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  vector-effect="non-scaling-stroke"
                  d="M12 20.5s-7.5-4.6-9.2-9.4C1.6 7.6 3.9 4 7.4 4c2 0 3.6 1.1 4.6 2.7C13 5.1 14.6 4 16.6 4c3.5 0 5.8 3.6 4.6 7.1-1.7 4.8-9.2 9.4-9.2 9.4z"
                />
              </svg>
            }
            @case ('donate') {
              <svg
                class="tab-icon"
                aria-hidden="true"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect vector-effect="non-scaling-stroke" x="3" y="8" width="18" height="4" rx="1" />
                <path vector-effect="non-scaling-stroke" d="M12 8v13M19 12v9H5v-9" />
                <path
                  vector-effect="non-scaling-stroke"
                  d="M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8s1-5 4.5-5a2.5 2.5 0 0 1 0 5"
                />
              </svg>
            }
          }
          <span class="tab-label">{{ tab.label }}</span>
        </a>
      </li>
    }
  </ul>
</nav>
