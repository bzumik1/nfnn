<nav
  #bar
  class="tab-bar ui-glass"
  [class.ui-glass--on-dark]="onDark()"
  [class.tab-bar--under-keyboard]="keyboard.isOpen()"
  [attr.aria-label]="label"
>
  <ul class="tab-bar-list">
    @for (tab of tabs; track tab.id) {
      <li class="tab-bar-item">
        <a
          class="tab"
          [class.tab--current]="current() === tab.id"
          [href]="hrefOf(tab)"
          [attr.aria-current]="
            current() === tab.id ? (memory.isAtRoot(tab) ? 'page' : 'true') : null
          "
          (click)="open($event, tab)"
        >
          @switch (tab.id) {
            @case ('about') {
              <svg
                class="tab-icon"
                aria-hidden="true"
                [attr.viewBox]="star.viewBox"
                fill="none"
                stroke="currentColor"
                stroke-linejoin="round"
              >
                <path vector-effect="non-scaling-stroke" [attr.d]="star.path" />
              </svg>
            }
            @case ('news') {
              <svg
                class="tab-icon"
                aria-hidden="true"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect
                  vector-effect="non-scaling-stroke"
                  x="4"
                  y="3"
                  width="16"
                  height="18"
                  rx="2"
                />
                <path vector-effect="non-scaling-stroke" d="M8 8h8M8 12h8M8 16h5" />
              </svg>
            }
            @case ('projects') {
              <svg
                class="tab-icon"
                aria-hidden="true"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  vector-effect="non-scaling-stroke"
                  d="M12 20.5s-7.5-4.6-9.2-9.4C1.6 7.6 3.9 4 7.4 4c2 0 3.6 1.1 4.6 2.7C13 5.1 14.6 4 16.6 4c3.5 0 5.8 3.6 4.6 7.1-1.7 4.8-9.2 9.4-9.2 9.4z"
                />
              </svg>
            }
            @case ('donate') {
              <svg
                class="tab-icon"
                aria-hidden="true"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect vector-effect="non-scaling-stroke" x="3" y="8" width="18" height="4" rx="1" />
                <path vector-effect="non-scaling-stroke" d="M12 8v13M19 12v9H5v-9" />
                <path
                  vector-effect="non-scaling-stroke"
                  d="M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8s1-5 4.5-5a2.5 2.5 0 0 1 0 5"
                />
              </svg>
            }
          }
          <span class="tab-label">{{ tab.label }}</span>
        </a>
      </li>
    }
  </ul>
</nav>
