<div role="status">
  @if (shown()) {
    <div #bar class="ui-notice ui-notice--warning ui-notice--floating">
      <p #message id="update-notice-message" class="ui-notice__text" i18n="@@layout.update.message">
        Web má novou verzi. Než budete cokoli odesílat, načtěte ji.
      </p>
      <button
        type="button"
        aria-describedby="update-notice-message"
        class="ui-button ui-button--primary ui-button--small"
        (click)="loadNewVersion()"
        i18n="@@layout.update.load"
      >
        Načíst novou verzi
      </button>
    </div>
  }
</div>
