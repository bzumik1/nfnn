<div aria-live="polite" aria-atomic="true">
  @if (shown()) {
    <div #bar class="ui-notice ui-notice--warning ui-notice--floating">
      @if (reloadOnly()) {
        <p
          #message
          id="update-notice-message"
          class="ui-notice__text"
          i18n="@@layout.update.reloadMessage"
        >
          Web má novou verzi a tahle stránka ji potřebuje načíst. Rozepsaný text si nejdřív
          zkopírujte, načtením by se ztratil.
        </p>
      } @else {
        <p
          #message
          id="update-notice-message"
          class="ui-notice__text"
          i18n="@@layout.update.message"
        >
          Web má novou verzi. Než budete cokoli odesílat, načtěte ji.
        </p>
      }
      <button
        type="button"
        aria-describedby="update-notice-message"
        class="ui-button ui-button--primary ui-button--small"
        [disabled]="loading()"
        (click)="loadNewVersion()"
      >
        @if (loading()) {
          <span i18n="@@layout.update.loading">Načítáme novou verzi…</span>
        } @else {
          <span i18n="@@layout.update.load">Načíst novou verzi</span>
        }
      </button>
    </div>
  }
</div>
