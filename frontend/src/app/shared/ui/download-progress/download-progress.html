<p
  class="download-progress-line"
  [class.download-progress-line--done]="progress()?.kind === 'done'"
  role="status"
>
  @if (progress(); as progress) {
    <span>{{ progress.text }}</span>
  }
</p>
@if (progress(); as progress) {
  @if (progress.kind === 'running') {
    <div class="download-progress-bar">
      <progress
        class="download-progress-meter"
        [max]="progress.steps"
        [value]="progress.step"
        [attr.aria-label]="progress.text"
        [attr.aria-valuetext]="progress.detail ?? null"
      ></progress>
      @if (progress.detail) {
        <span class="download-progress-detail" aria-hidden="true">{{ progress.detail }}</span>
      }
      @if (slow()) {
        <button
          type="button"
          class="ui-button ui-button--small ui-button--quiet download-progress-cancel"
          (click)="cancelled.emit()"
          i18n="@@ui.downloadProgress.cancel"
        >
          Zrušit
        </button>
      }
    </div>
  }
}
