<input
  class="file-input visually-hidden"
  type="file"
  [id]="inputId()"
  [accept]="accept()"
  [attr.aria-describedby]="describedBy()"
  [disabled]="disabled()"
  (change)="choose($event)"
/>
<label
  class="file-label"
  [class.ui-button]="look() === 'button'"
  [class.ui-list__row]="look() === 'row'"
  [class.ui-list__row--action]="look() === 'row'"
  [for]="inputId()"
  [class.file-label--disabled]="disabled()"
>
  <ng-content />
</label>
