<label class="field-label" [class.ui-word]="wholeLabel()" [for]="control().id">{{ label() }}</label>
<ng-content />
@if (control().showsError()) {
  <p class="field-error" [id]="control().id + '-error'">{{ error() }}</p>
}
@if (hint()) {
  <p class="field-hint" [id]="control().id + '-hint'">{{ hint() }}</p>
}
