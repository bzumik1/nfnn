<div role="status">
  @if (notice(); as notice) {
    @if (notice.kind === 'status') {
      <p [class]="statusClass()">{{ notice.text }}</p>
    }
  }
</div>
<div role="alert">
  @if (notice(); as notice) {
    @if (notice.kind === 'alert') {
      <p [class]="alertClass()">{{ notice.text }}</p>
    }
  }
</div>
