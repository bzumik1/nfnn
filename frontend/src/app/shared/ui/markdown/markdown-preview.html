<div
  class="preview"
  role="region"
  aria-label="Náhled textu"
  i18n-aria-label="@@ui.markdown.preview.label"
  [id]="previewId()"
  [hidden]="!isOpen()"
>
  @if (empty()) {
    <p class="preview-empty" i18n="@@ui.markdown.preview.empty">Zatím není co ukázat.</p>
  } @else {
    <app-markdown [text]="text()" />
  }
</div>
