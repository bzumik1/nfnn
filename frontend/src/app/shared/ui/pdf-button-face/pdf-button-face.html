@for (layer of layers(); track layer.state) {
  <span
    class="pdf-button__layer"
    [class.pdf-button__layer--current]="layer.state === state()"
    [class.pdf-button__layer--failed]="layer.state === 'failed'"
    [attr.aria-hidden]="layer.state === state() ? null : 'true'"
  >
    <span class="pdf-button__icon" aria-hidden="true">
      @switch (layer.state) {
        @case ('running') {
          <svg class="pdf-button__ring" viewBox="0 0 24 24" fill="none" stroke-width="2.5">
            <circle class="pdf-button__ring-track" cx="12" cy="12" r="8" />
            <circle class="pdf-button__ring-arc" cx="12" cy="12" r="8" stroke-linecap="round" />
          </svg>
        }
        @case ('ready') {
          <svg
            class="pdf-button__share"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M12 3v12" />
            <path d="m8 7 4-4 4 4" />
            <path d="M8 11H6v10h12V11h-2" />
          </svg>
        }
        @case ('failed') {
          <svg
            class="pdf-button__warning"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="9" />
            <path d="M12 7.5v5.5" />
            <path d="M12 16.5h.01" />
          </svg>
        }
        @default {
          <svg
            class="pdf-button__download"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M12 3v12" />
            <path d="m7 10 5 5 5-5" />
            <path d="M5 21h14" />
          </svg>
        }
      }
    </span>
    @if (layer.state === state()) {
      <span class="pdf-button__label">{{ layer.label }}</span>
    } @else {
      <span
        class="pdf-button__label pdf-button__reserve"
        aria-hidden="true"
        [attr.data-label]="layer.label"
      ></span>
    }
  </span>
}
