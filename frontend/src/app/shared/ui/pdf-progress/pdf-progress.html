<p
  class="pdf-progress__line"
  [class.pdf-progress__line--done]="shown()?.kind === 'ready' || shown()?.kind === 'done'"
  role="status"
>
  @if (shown(); as shown) {
    @if (shown.kind === 'running') {
      <span>{{ shown.text }}</span>
    } @else {
      <span class="pdf-progress__brief" aria-hidden="true" [attr.data-brief]="shown.brief">
        @if (shown.kind !== 'cancelled') {
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M6 12.5 10.2 16.5 18 8" />
          </svg>
        }
      </span>
      <span class="visually-hidden">{{ shown.text }}</span>
    }
  }
</p>
@if (slow()) {
  <button
    type="button"
    class="ui-button ui-button--small ui-button--quiet pdf-progress__cancel"
    (click)="cancelled.emit()"
    i18n="@@ui.downloadProgress.cancel"
  >
    Zrušit
  </button>
}
