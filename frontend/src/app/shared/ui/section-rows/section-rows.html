<nav class="section-rows" [attr.aria-label]="label()">
  @for (group of groups(); track group.id) {
    <section class="section-group" [attr.aria-labelledby]="group.id">
      <h2 class="section-group-title" [id]="group.id">{{ group.label }}</h2>
      <ul class="ui-list ui-list--inset">
        @for (row of group.rows; track row.path) {
          <li>
            <a class="ui-list__row" [routerLink]="row.path">
              @if (row.icon; as icon) {
                <span class="ui-list__lead section-icon" aria-hidden="true">
                  <svg
                    width="20"
                    height="20"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    @switch (icon) {
                      @case ('payments') {
                        <rect x="3" y="5" width="18" height="14" rx="2" />
                        <path d="M3 10h18" />
                        <path d="M7 15h3" />
                      }
                      @case ('donors') {
                        <circle cx="9" cy="8" r="3.5" />
                        <path d="M2.5 20a6.5 6.5 0 0 1 13 0" />
                        <path d="M16 4.5a3.5 3.5 0 0 1 0 7" />
                        <path d="M18.5 14.5a6.5 6.5 0 0 1 3 5.5" />
                      }
                      @case ('news') {
                        <rect x="4" y="4" width="16" height="16" rx="2" />
                        <path d="M8 9h8M8 13h8M8 17h5" />
                      }
                      @case ('projects') {
                        <path
                          d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"
                        />
                      }
                      @case ('more') {
                        <path d="M4 7h16M4 12h16M4 17h10" />
                      }
                      @case ('gifts') {
                        <rect x="3" y="8" width="18" height="4" rx="1" />
                        <path d="M12 8v13" />
                        <path d="M19 12v9H5v-9" />
                        <path
                          d="M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8s1-5 4.5-5a2.5 2.5 0 0 1 0 5"
                        />
                      }
                      @case ('receipts') {
                        <path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z" />
                        <path d="M14 3v6h6" />
                        <path d="M8 13h8M8 17h5" />
                      }
                      @case ('accounts') {
                        <path d="M3 10 12 4l9 6" />
                        <path d="M5 10v8M9.5 10v8M14.5 10v8M19 10v8" />
                        <path d="M3 21h18" />
                      }
                      @case ('details') {
                        <rect x="5" y="11" width="14" height="10" rx="2" />
                        <path d="M8 11V7a4 4 0 0 1 8 0v4" />
                      }
                      @case ('admin') {
                        <path d="M12 3 4 6v6c0 5 3.5 8.5 8 9 4.5-.5 8-4 8-9V6l-8-3z" />
                        <path d="m9 12 2 2 4-4" />
                      }
                    }
                  </svg>
                </span>
              }
              <span class="ui-list__title">{{ row.label }}</span>
              @if (row.badge; as badge) {
                @if (badge.count > 0) {
                  <span
                    class="ui-list__value ui-list__count ui-list__count--warning"
                    aria-hidden="true"
                    >{{ badge.count }}</span
                  >
                  <span class="visually-hidden">{{ badge.description }}</span>
                }
              }
              <svg
                class="ui-list__chevron"
                aria-hidden="true"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <polyline points="9 18 15 12 9 6" />
              </svg>
            </a>
          </li>
        }
      </ul>
    </section>
  }
</nav>
