<button
  type="button"
  class="sheet-head-button sheet-head-back"
  aria-label="Zpět"
  i18n-aria-label="@@layout.header.back"
  (click)="backPressed.emit()"
>
  <svg
    aria-hidden="true"
    width="20"
    height="20"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2.4"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <polyline points="15 18 9 12 15 6" />
  </svg>
</button>
@if (titleId(); as id) {
  <h2 class="sheet-head-title" [id]="id" tabindex="-1">{{ title() }}</h2>
} @else {
  <p class="sheet-head-title" aria-hidden="true">{{ title() }}</p>
}
<button
  type="button"
  class="sheet-head-button sheet-head-close"
  aria-label="Zavřít"
  i18n-aria-label="@@ui.dialog.close"
  (click)="closePressed.emit()"
>
  <svg
    aria-hidden="true"
    width="20"
    height="20"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2.4"
    stroke-linecap="round"
  >
    <path d="M4.5 4.5l15 15M19.5 4.5l-15 15" />
  </svg>
</button>
